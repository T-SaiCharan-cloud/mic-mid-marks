    // Word Document Parser (.docx)
    async function parseWordDocument(file, existingDbRecordKeys = new Set(), onProgress) {
      if (!window.mammoth) {
        throw new Error('Word document parser is loading. Please try again.');
      }
      const arrayBuffer = await file.arrayBuffer();
      const result = await window.mammoth.convertToHtml({ arrayBuffer });
      const html = result.value || '';

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const table = doc.querySelector('table');

      if (table) {
        const grid = [];
        const trs = table.querySelectorAll('tr');
        trs.forEach(tr => {
          const row = [];
          const cells = tr.querySelectorAll('th, td');
          cells.forEach(c => row.push(c.innerText.trim()));
          if (row.length > 0) grid.push(row);
        });
        if (grid.length > 0) {
          return await processGridWithAiOrHeuristic(grid, file, existingDbRecordKeys, onProgress);
        }
      }

      // Fallback: parse lines from text
      const lines = html.replace(/<[^>]+>/g, '\n').split('\n').map(l => l.trim()).filter(Boolean);
      const grid = lines.map(l => l.split(/\t|\|{1}|  +/).map(c => c.trim()).filter(Boolean)).filter(r => r.length >= 2);
      if (grid.length > 0) {
        return await processGridWithAiOrHeuristic(grid, file, existingDbRecordKeys, onProgress);
      }

      const emptyRes = [];
      emptyRes.isUnrelated = true;
      emptyRes.columnMappings = [];
      emptyRes.summary = { total: 0, valid: 0, warnings: 0, errors: 0, duplicates: 0, ignoredColumns: 0 };
      return emptyRes;
    }

    // Multi-format PDF Parser (Digital Text + Scanned OCR Fallback)
    async function parsePdfDocument(file, existingDbRecordKeys, onProgress) {
      if (!window.pdfjsLib) {
        throw new Error("PDF parser library is loading. Please try again in a moment.");
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;

      let docDept = 'CSE';
      let docSem = 1;
      let docSubject = 'Academic Subject';
      const extractedLines = [];

      for (let p = 1; p <= pdf.numPages; p++) {
        if (onProgress) onProgress(Math.round((p / pdf.numPages) * 40), `Extracting PDF page ${p} of ${pdf.numPages}...`);
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();

        const pageText = textContent.items.map(it => it.str).join(' ');
        const deptM = pageText.match(/\b(CSE|AIDS|AIML|ECE|EEE|MECH|CIVIL|IT)\b/i);
        if (deptM) docDept = deptM[1].toUpperCase();

        const semM = pageText.match(/(?:Semester|Sem)[\s:-]*([1-8]|I{1,3}|IV|V|VI|VII|VIII)\b/i);
        if (semM) {
          const v = semM[1].toUpperCase();
          const roman = { 'I': 1, 'II': 2, 'III': 3, 'IV': 4, 'V': 5, 'VI': 6, 'VII': 7, 'VIII': 8 };
          docSem = roman[v] || parseInt(v, 10) || 1;
        }

        const subM = pageText.match(/(?:Subject|Course)[\s:-]+([A-Za-z0-9 &_-]{3,35})/i);
        if (subM) docSubject = subM[1].trim();

        // Group text tokens by vertical Y-line
        const yGroups = new Map();
        for (const it of textContent.items) {
          if (!it.str || !it.str.trim()) continue;
          const y = Math.round(it.transform[5]);
          let key = null;
          for (const k of yGroups.keys()) {
            if (Math.abs(k - y) <= 4) { key = k; break; }
          }
          if (key === null) { key = y; yGroups.set(key, []); }
          yGroups.get(key).push({ x: Math.round(it.transform[4]), str: it.str.trim() });
        }

        const sortedYs = Array.from(yGroups.keys()).sort((a, b) => b - a);
        for (const y of sortedYs) {
          const sortedItems = yGroups.get(y).sort((a, b) => a.x - b.x);
          const lineStr = sortedItems.map(it => it.str).join('   ');
          extractedLines.push(lineStr);
        }
      }

      // Check if digital text yielded valid lines
      const rollRegex = /\b([0-9]{2}[A-Za-z0-9]{2}[0-9A-Za-z][A-Za-z0-9]{4,5}|[0-9]{2}[A-Za-z0-9]{8})\b/i;
      const rollMatches = extractedLines.filter(l => rollRegex.test(l));

      // Scanned PDF fallback via OCR if digital text is empty or has < 2 roll numbers
      if (rollMatches.length < 2 && window.Tesseract && pdf.numPages <= 5) {
        if (onProgress) onProgress(45, 'Scanned PDF detected. Running AI OCR on pages...');
        const ocrLines = [];
        for (let p = 1; p <= Math.min(pdf.numPages, 5); p++) {
          const page = await pdf.getPage(p);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;

          if (onProgress) onProgress(50 + Math.round((p / pdf.numPages) * 35), `OCR processing page ${p}...`);
          const text = await runOCR(canvas);
          if (text) {
            text.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => ocrLines.push(l));
          }
        }
        if (ocrLines.length > 0) {
          extractedLines.push(...ocrLines);
        }
      }

      // Convert lines to 2D grid
      const grid = [];
      for (const line of extractedLines) {
        const lower = line.toLowerCase();
        if (lower.includes('dvr & dr') || lower.includes('college of technology')) continue;
        if (lower.includes('controller of examinations') || lower.includes('principal signature')) continue;

        const tokens = line.split(/\s{2,}|\t|\|/).map(t => t.trim()).filter(Boolean);
        if (tokens.length >= 2) grid.push(tokens);
      }

      const res = await processGridWithAiOrHeuristic(grid, file, existingDbRecordKeys, onProgress);
      return res;
    }

    // Bulletproof Master Parser: Excel, CSV, PDF, Word, Image OCR
    async function parseDataFile(file, onProgress, onComplete, onError) {
      // Allow flexible 3-argument signature: parseDataFile(file, onComplete, onError)
      if (typeof onError === 'undefined' && typeof onProgress === 'function' && typeof onComplete === 'function') {
        const origOnComplete = onProgress;
        const origOnError = onComplete;
        onProgress = (pct, msg) => { };
        onComplete = origOnComplete;
        onError = origOnError;
      } else if (typeof onComplete !== 'function' && typeof onProgress === 'function') {
        const origOnComplete = onProgress;
        onProgress = (pct, msg) => { };
        onComplete = origOnComplete;
        onError = (err) => alert(err);
      }
      if (!onProgress) onProgress = () => { };
      if (!onError) onError = err => alert(err);

      const ext = (file.name || '').split('.').pop().toLowerCase();
      onProgress(10, 'Inspecting uploaded file format...');

      // 1. Word Documents (.docx)
      if (ext === 'docx' || file.type.includes('wordprocessingml')) {
        onProgress(25, 'Analyzing Word document tables...');
        try {
          const res = await parseWordDocument(file, new Set(), onProgress);
          if (res.isUnrelated) {
            onError('No student marks table was detected in this Word document. Please ensure it contains a table with student Roll Numbers.');
          } else {
            onComplete(res);
          }
        } catch (err) {
          onError('Failed to parse Word document: ' + (err.message || err));
        }
        return;
      }

      // 2. PDF Documents (.pdf)
      if (ext === 'pdf' || file.type === 'application/pdf') {
        onProgress(20, 'Analyzing PDF document structure...');
        parsePdfDocument(file, new Set(), onProgress)
          .then(res => {
            if (!res || res.length === 0 || res.isUnrelated) {
              onError('No student records detected in this PDF. Please verify the PDF contains student marks tables with Roll Numbers.');
            } else {
              onProgress(100, 'Analysis complete!');
              onComplete(res);
            }
          })
          .catch(err => onError('Failed to parse PDF: ' + (err.message || err)));
        return;
      }

      // 3. Image / Photo Files (.png, .jpg, .jpeg, .webp)
      if (['png', 'jpg', 'jpeg', 'webp', 'bmp'].includes(ext) || (file.type && file.type.startsWith('image/'))) {
        onProgress(20, 'Analyzing image with Multimodal AI Vision...');
        try {
          const visionResult = await callAiVisionExtraction(file, file.type || 'image/jpeg');
          if (visionResult && visionResult.data && !visionResult.data.is_unrelated && Array.isArray(visionResult.data.rows) && visionResult.data.rows.length > 0) {
            onProgress(85, 'AI Vision successfully recognized student marks & records!');
            const headerRow = TEMPLATE_COLUMNS;
            const dataRows = visionResult.data.rows.map(r => headerRow.map(col => r[col] ?? ''));
            const res = await processGridWithAiOrHeuristic([headerRow, ...dataRows], file, new Set(), onProgress);
            onProgress(100, 'AI Vision extraction complete!');
            onComplete(res);
            return;
          }
        } catch (visionErr) {
          console.warn('AI Vision fallback to local OCR:', visionErr);
        }

        onProgress(35, 'Running OCR fallback on image...');
        try {
          const text = await runOCR(file, p => onProgress(35 + Math.round(p * 0.45), `OCR recognizing text (${p}%)...`));
          onProgress(85, 'Detecting tables and student records...');
          const ocrRows = parseOcrText(text);
          if (ocrRows && ocrRows.length >= 2) {
            const res = await processGridWithAiOrHeuristic(ocrRows, file, new Set(), onProgress);
            if (res.isUnrelated) {
              onError('The photo/image does not contain a recognizable student marks table. Please take a clearer, well-lit photo.');
            } else {
              onProgress(100, 'OCR extraction complete!');
              onComplete(res);
            }
          } else {
            onError('Could not extract tabular text from this image. Please upload a clear photo of the marksheet.');
          }
        } catch (err) {
          onError('Image OCR failed: ' + (err.message || err));
        }
        return;
      }

      // 4. CSV Documents (.csv, .tsv, .txt)
      if (ext === 'csv' || ext === 'tsv' || ext === 'txt') {
        onProgress(30, 'Parsing CSV / delimited data...');
        Papa.parse(file, {
          skipEmptyLines: 'greedy',
          complete: async res => {
            onProgress(60, 'Running AI field detection and anomaly validation...');
            const gridRecords = await processGridWithAiOrHeuristic(res.data, file, new Set(), onProgress);
            if (gridRecords && gridRecords.length > 0 && !gridRecords.isUnrelated) {
              onProgress(100, 'Parsing complete!');
              return onComplete(gridRecords);
            }
            // Fallback attempt with header: true
            Papa.parse(file, {
              header: true,
              skipEmptyLines: 'greedy',
              complete: res2 => {
                const cleaned = (res2.data || []).map(normalizeStudentRow).filter(r => r && (r['Roll Number'] || r['Student Name']));
                if (cleaned.length > 0) {
                  onProgress(100, 'Parsing complete!');
                  onComplete(cleaned);
                } else {
                  onError('CSV file contained no readable student records. Please ensure it has student Roll Numbers.');
                }
              }
            });
          },
          error: err => onError('Failed to parse CSV: ' + (err.message || err))
        });
        return;
      }

      // 5. Multi-strategy Spreadsheet reader for Excel (.xlsx, .xls)
      onProgress(20, 'Reading spreadsheet buffer...');
      const reader = new FileReader();
      reader.onload = async e => {
        const buffer = e.target.result;
        let wb = null;
        let primaryError = null;

        // Check if file is secretly a PDF (magic bytes %PDF)
        try {
          const headerBytes = new Uint8Array(buffer.slice(0, 5));
          if (headerBytes[0] === 0x25 && headerBytes[1] === 0x50 && headerBytes[2] === 0x44 && headerBytes[3] === 0x46) {
            parsePdfDocument(file, new Set(), onProgress).then(onComplete).catch(onError);
            return;
          }
        } catch (ex) { }

        // Strategy A: SheetJS with raw ArrayBuffer
        try {
          wb = XLSX.read(buffer, { type: 'array', cellDates: true });
        } catch (errA) {
          primaryError = errA;
        }

        // Strategy B: SheetJS with Uint8Array
        if (!wb) {
          try {
            wb = XLSX.read(new Uint8Array(buffer), { type: 'array' });
          } catch (errB) {
            primaryError = primaryError || errB;
          }
        }

        // Strategy C: SheetJS with binary string
        if (!wb) {
          try {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunk = 8192;
            for (let i = 0; i < bytes.length; i += chunk) {
              binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            wb = XLSX.read(binary, { type: 'binary' });
          } catch (errC) {
            primaryError = primaryError || errC;
          }
        }

        if (wb && wb.SheetNames && wb.SheetNames.length > 0) {
          onProgress(50, 'Analyzing worksheet tables with AI...');
          for (let s = 0; s < wb.SheetNames.length; s++) {
            try {
              const sheet = wb.Sheets[wb.SheetNames[s]];
              const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
              if (!rawRows || rawRows.length === 0) continue;

              const gridRecords = await processGridWithAiOrHeuristic(rawRows, file, new Set(), onProgress);
              if (gridRecords && gridRecords.length > 0 && !gridRecords.isUnrelated) {
                onProgress(100, 'Excel extraction complete!');
                return onComplete(gridRecords);
              }
            } catch (ex) { }
          }
        }

        // Strategy D: Text / HTML-Table fallback
        try {
          const textContent = new TextDecoder('utf-8').decode(buffer);
          if (textContent.includes('<table') || textContent.includes('<tr')) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(textContent, 'text/html');
            const table = doc.querySelector('table');
            if (table) {
              const htmlWb = XLSX.utils.table_to_book(table);
              if (htmlWb && htmlWb.SheetNames && htmlWb.SheetNames.length > 0) {
                const sheet = htmlWb.Sheets[htmlWb.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                const gridRecords = await processGridWithAiOrHeuristic(rawRows, file, new Set(), onProgress);
                if (gridRecords && gridRecords.length > 0 && !gridRecords.isUnrelated) {
                  onProgress(100, 'HTML table parsed!');
                  return onComplete(gridRecords);
                }
              }
            }
          }

          // Plain text fallback
          Papa.parse(textContent, {
            skipEmptyLines: 'greedy',
            complete: async res => {
              const gridRecords = await processGridWithAiOrHeuristic(res.data, file, new Set(), onProgress);
              if (gridRecords && gridRecords.length > 0 && !gridRecords.isUnrelated) {
                onProgress(100, 'Extraction complete!');
                return onComplete(gridRecords);
              }
              onError('Could not parse student records. Please ensure your file contains student Roll Numbers.');
            },
            error: () => onError('Excel file error: ' + (primaryError ? primaryError.message : 'Could not find readable sheet in file.'))
          });
          return;
        } catch (fallbackErr) {
          onError('Excel file error: ' + (primaryError ? primaryError.message : fallbackErr.message));
        }
      };

      reader.onerror = () => onError('Failed to read the file from disk.');
      reader.readAsArrayBuffer(file);
    }

    const EMBEDDED_SCHEMA_SQL = "-- ====================================================================\n-- DVR & Dr. HS MIC College of Technology — Examination & Attendance Portal\n-- HARDENED PRODUCTION SUPABASE SECURITY MIGRATION (V3)\n-- ====================================================================\n-- This migration comprehensively hardens the Supabase PostgreSQL database:\n-- 1. Safely and dynamically drops all old/insecure wildcard RLS policies.\n-- 2. Secures admin_users table and public.is_admin() with fixed search_path.\n-- 3. REMOVES plaintext/hashed passwords from faculties and hods tables to protect credentials.\n-- 4. Creates server-side staff authorization helper functions (is_hod, is_faculty, etc.).\n-- 5. Enables Row Level Security (RLS) across all portal tables.\n-- 6. REVOKES ALL anonymous (anon) INSERT, UPDATE, and DELETE permissions (Zero Anon Writes).\n-- 7. REVOKES anonymous bulk SELECT on students, marks, attendance, faculty, hods, audit logs.\n-- 8. Implements Role-Based Access Control (RBAC):\n--    - Super Admin (Principal): full administrative access across all tables.\n--    - HOD: manages only their authorized department's students, marks, and attendance.\n--    - Faculty: enters/edits marks ONLY for their assigned subjects (canEdit = true).\n--    - Attendance In-Charge: enters/edits attendance ONLY for their assigned department.\n--    - Audit Logs: append-only for staff actions; immutable once written.\n-- 9. Provides a secure, privacy-preserving, rate-limited Student Result RPC (get_student_result).\n-- ====================================================================\n-- HOW TO RUN:\n-- 1. Open your Supabase Dashboard: https://supabase.com/dashboard/project/sdvxkupgfcvqpwkghqar\n-- 2. In the left sidebar, click \"SQL Editor\"\n-- 3. Click \"New Query\", paste this entire script, and click \"Run\" (or Ctrl+Enter)\n-- ====================================================================\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 1: DYNAMIC CLEANUP OF ALL OLD & CONFLICTING POLICIES\n-- ────────────────────────────────────────────────────────────────────\nDO $$\nDECLARE\n  pol RECORD;\nBEGIN\n  FOR pol IN \n    SELECT schemaname, tablename, policyname \n    FROM pg_policies \n    WHERE schemaname = 'public' \n      AND tablename IN (\n        'departments', 'subjects', 'students', 'marks_records', \n        'class_attendance', 'faculties', 'hods', 'audit_logs', \n        'migration_logs', 'admin_users', 'api_rate_limits'\n      )\n  LOOP\n    EXECUTE format('DROP POLICY IF EXISTS %I ON %I.%I', pol.policyname, pol.schemaname, pol.tablename);\n  END LOOP;\nEND $$;\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 2: CREATE & HARDEN ADMIN USERS MAPPING TABLE\n-- ────────────────────────────────────────────────────────────────────\nCREATE TABLE IF NOT EXISTS public.admin_users (\n  id         UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,\n  email      TEXT NOT NULL UNIQUE,\n  role       TEXT NOT NULL DEFAULT 'super_admin' CHECK (role IN ('super_admin')),\n  created_at TIMESTAMPTZ DEFAULT now()\n);\n\n-- Revoke all table modifications from public and authenticated users.\n-- Prevents users from self-granting admin privileges!\nREVOKE ALL ON TABLE public.admin_users FROM PUBLIC, anon;\nGRANT SELECT ON TABLE public.admin_users TO authenticated;\nGRANT ALL ON TABLE public.admin_users TO service_role;\n\nALTER TABLE public.admin_users ENABLE ROW LEVEL SECURITY;\n\nCREATE POLICY \"admin_users_select_own\" ON public.admin_users\n  FOR SELECT TO authenticated\n  USING (auth.uid() = id);\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 3: SECURE is_admin() FUNCTION (FIXED search_path & PRIVILEGES)\n-- ────────────────────────────────────────────────────────────────────\nCREATE OR REPLACE FUNCTION public.is_admin()\nRETURNS BOOLEAN\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\n  SELECT EXISTS (\n    SELECT 1 FROM public.admin_users\n    WHERE id = auth.uid() AND role = 'super_admin'\n  );\n$$;\n\nREVOKE ALL ON FUNCTION public.is_admin() FROM PUBLIC;\nREVOKE ALL ON FUNCTION public.is_admin() FROM anon;\nGRANT EXECUTE ON FUNCTION public.is_admin() TO authenticated, service_role;\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 4: REMOVE PASSWORDS FROM FACULTIES AND HODS TABLES\n-- ────────────────────────────────────────────────────────────────────\n-- Cloud tables should NEVER store plaintext or client-synced passwords.\n-- Credential fields are made nullable, defaulted to NULL, and existing passwords cleared.\nDO $$\nBEGIN\n  IF EXISTS (\n    SELECT 1 FROM information_schema.columns \n    WHERE table_schema = 'public' AND table_name = 'faculties' AND column_name = 'password'\n  ) THEN\n    ALTER TABLE public.faculties ALTER COLUMN password DROP NOT NULL;\n    ALTER TABLE public.faculties ALTER COLUMN password SET DEFAULT NULL;\n    UPDATE public.faculties SET password = NULL WHERE password IS NOT NULL;\n  END IF;\n\n  IF EXISTS (\n    SELECT 1 FROM information_schema.columns \n    WHERE table_schema = 'public' AND table_name = 'hods' AND column_name = 'password'\n  ) THEN\n    ALTER TABLE public.hods ALTER COLUMN password DROP NOT NULL;\n    ALTER TABLE public.hods ALTER COLUMN password SET DEFAULT NULL;\n    UPDATE public.hods SET password = NULL WHERE password IS NOT NULL;\n  END IF;\nEND $$;\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 5: SERVER-SIDE STAFF & RBAC HELPER FUNCTIONS\n-- ────────────────────────────────────────────────────────────────────\n-- Extract authenticated user email from JWT\nCREATE OR REPLACE FUNCTION public.current_staff_email()\nRETURNS TEXT\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\n  SELECT LOWER(COALESCE(auth.jwt()->>'email', ''));\n$$;\n\n-- Determine the department of the authenticated staff member\nCREATE OR REPLACE FUNCTION public.current_staff_dept()\nRETURNS TEXT\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\n  SELECT department FROM (\n    SELECT department, 1 as prio FROM public.hods WHERE LOWER(email) = public.current_staff_email() AND status = 'active'\n    UNION ALL\n    SELECT department, 2 as prio FROM public.faculties WHERE LOWER(email) = public.current_staff_email() AND status = 'active'\n  ) s ORDER BY prio LIMIT 1;\n$$;\n\n-- Verify if authenticated user is HOD (optionally of a specific department)\nCREATE OR REPLACE FUNCTION public.is_hod(p_dept TEXT DEFAULT NULL)\nRETURNS BOOLEAN\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\n  SELECT public.is_admin() OR EXISTS (\n    SELECT 1 FROM public.hods\n    WHERE LOWER(email) = public.current_staff_email()\n      AND status = 'active'\n      AND (p_dept IS NULL OR department = p_dept)\n  );\n$$;\n\n-- Verify if authenticated user is Faculty (optionally of a specific department)\nCREATE OR REPLACE FUNCTION public.is_faculty(p_dept TEXT DEFAULT NULL)\nRETURNS BOOLEAN\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\n  SELECT public.is_admin() OR EXISTS (\n    SELECT 1 FROM public.faculties\n    WHERE LOWER(email) = public.current_staff_email()\n      AND status = 'active'\n      AND (p_dept IS NULL OR department = p_dept)\n  );\n$$;\n\n-- Verify if authenticated Faculty has EDIT permission on a specific subject\nCREATE OR REPLACE FUNCTION public.faculty_can_edit_subject(p_subject_code TEXT)\nRETURNS BOOLEAN\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\n  SELECT public.is_admin() OR EXISTS (\n    SELECT 1\n    FROM public.faculties f,\n         jsonb_array_elements(f.assigned_subjects) as sub\n    WHERE LOWER(f.email) = public.current_staff_email()\n      AND f.status = 'active'\n      AND (sub->>'subjectId' = p_subject_code OR sub->>'code' = p_subject_code)\n      AND COALESCE((sub->>'canEdit')::boolean, false) = true\n  );\n$$;\n\n-- Verify if authenticated user is designated Attendance In-Charge for a department\nCREATE OR REPLACE FUNCTION public.is_attendance_in_charge(p_dept TEXT)\nRETURNS BOOLEAN\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\n  SELECT public.is_admin() \n     OR public.is_hod(p_dept)\n     OR EXISTS (\n        SELECT 1 FROM public.faculties\n        WHERE LOWER(email) = public.current_staff_email()\n          AND department = p_dept\n          AND status = 'active'\n          AND (\n            designation ILIKE '%in-charge%' \n            OR designation ILIKE '%incharge%'\n            OR COALESCE((assigned_subjects->>'isAttendanceInCharge')::boolean, false) = true\n          )\n     );\n$$;\n\n-- Restrict execution of helper functions to authenticated users and service_role\nREVOKE ALL ON FUNCTION public.current_staff_email() FROM PUBLIC, anon;\nREVOKE ALL ON FUNCTION public.current_staff_dept() FROM PUBLIC, anon;\nREVOKE ALL ON FUNCTION public.is_hod(TEXT) FROM PUBLIC, anon;\nREVOKE ALL ON FUNCTION public.is_faculty(TEXT) FROM PUBLIC, anon;\nREVOKE ALL ON FUNCTION public.faculty_can_edit_subject(TEXT) FROM PUBLIC, anon;\nREVOKE ALL ON FUNCTION public.is_attendance_in_charge(TEXT) FROM PUBLIC, anon;\n\nGRANT EXECUTE ON FUNCTION public.current_staff_email() TO authenticated, service_role;\nGRANT EXECUTE ON FUNCTION public.current_staff_dept() TO authenticated, service_role;\nGRANT EXECUTE ON FUNCTION public.is_hod(TEXT) TO authenticated, service_role;\nGRANT EXECUTE ON FUNCTION public.is_faculty(TEXT) TO authenticated, service_role;\nGRANT EXECUTE ON FUNCTION public.faculty_can_edit_subject(TEXT) TO authenticated, service_role;\nGRANT EXECUTE ON FUNCTION public.is_attendance_in_charge(TEXT) TO authenticated, service_role;\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 6: ENABLE ROW LEVEL SECURITY (RLS) ON ALL TABLES\n-- ────────────────────────────────────────────────────────────────────\nALTER TABLE public.departments      ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.subjects         ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.students         ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.marks_records    ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.class_attendance ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.faculties        ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.hods             ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.audit_logs       ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.migration_logs   ENABLE ROW LEVEL SECURITY;\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 7: REVOKE ALL ANONYMOUS WRITE & SENSITIVE SELECT PERMISSIONS\n-- ────────────────────────────────────────────────────────────────────\nREVOKE INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public FROM anon;\nREVOKE SELECT ON public.students, public.marks_records, public.class_attendance, \n                public.faculties, public.hods, public.audit_logs, \n                public.migration_logs, public.admin_users FROM anon;\n\n-- Grant anon SELECT on curriculum metadata ONLY (departments and subjects)\nGRANT SELECT ON public.departments, public.subjects TO anon;\nGRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO authenticated;\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 8: ROLE-BASED ACCESS CONTROL (RBAC) POLICIES\n-- ────────────────────────────────────────────────────────────────────\n\n-- --- 8A. DEPARTMENTS & SUBJECTS ---\nCREATE POLICY \"admin_all_departments\" ON public.departments\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"public_read_departments\" ON public.departments\n  FOR SELECT TO anon, authenticated\n  USING (true);\n\nCREATE POLICY \"admin_all_subjects\" ON public.subjects\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"public_read_subjects\" ON public.subjects\n  FOR SELECT TO anon, authenticated\n  USING (true);\n\n-- --- 8B. STUDENTS ---\nCREATE POLICY \"admin_manage_students\" ON public.students\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"staff_read_department_students\" ON public.students\n  FOR SELECT TO authenticated\n  USING (\n    public.is_admin() OR \n    department = public.current_staff_dept()\n  );\n\nCREATE POLICY \"hod_manage_department_students\" ON public.students\n  FOR INSERT TO authenticated\n  WITH CHECK (\n    public.is_admin() OR \n    public.is_hod(department)\n  );\n\nCREATE POLICY \"hod_update_department_students\" ON public.students\n  FOR UPDATE TO authenticated\n  USING (\n    public.is_admin() OR \n    public.is_hod(department)\n  )\n  WITH CHECK (\n    public.is_admin() OR \n    public.is_hod(department)\n  );\n\n-- --- 8C. MARKS RECORDS ---\nCREATE POLICY \"admin_manage_marks\" ON public.marks_records\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"staff_read_marks\" ON public.marks_records\n  FOR SELECT TO authenticated\n  USING (\n    public.is_admin() OR \n    EXISTS (\n      SELECT 1 FROM public.students s \n      WHERE s.roll_number = marks_records.student_roll \n        AND s.department = public.current_staff_dept()\n    )\n  );\n\nCREATE POLICY \"staff_insert_marks\" ON public.marks_records\n  FOR INSERT TO authenticated\n  WITH CHECK (\n    public.is_admin() OR\n    (public.is_hod() AND EXISTS (\n      SELECT 1 FROM public.students s \n      WHERE s.roll_number = marks_records.student_roll \n        AND s.department = public.current_staff_dept()\n    )) OR\n    public.faculty_can_edit_subject(subject_code)\n  );\n\nCREATE POLICY \"staff_update_marks\" ON public.marks_records\n  FOR UPDATE TO authenticated\n  USING (\n    public.is_admin() OR\n    (public.is_hod() AND EXISTS (\n      SELECT 1 FROM public.students s \n      WHERE s.roll_number = marks_records.student_roll \n        AND s.department = public.current_staff_dept()\n    )) OR\n    public.faculty_can_edit_subject(subject_code)\n  )\n  WITH CHECK (\n    public.is_admin() OR\n    (public.is_hod() AND EXISTS (\n      SELECT 1 FROM public.students s \n      WHERE s.roll_number = marks_records.student_roll \n        AND s.department = public.current_staff_dept()\n    )) OR\n    public.faculty_can_edit_subject(subject_code)\n  );\n\n-- --- 8D. CLASS ATTENDANCE ---\nCREATE POLICY \"admin_manage_attendance\" ON public.class_attendance\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"staff_read_attendance\" ON public.class_attendance\n  FOR SELECT TO authenticated\n  USING (\n    public.is_admin() OR \n    department = public.current_staff_dept()\n  );\n\nCREATE POLICY \"incharge_insert_attendance\" ON public.class_attendance\n  FOR INSERT TO authenticated\n  WITH CHECK (\n    public.is_admin() OR \n    public.is_attendance_in_charge(department)\n  );\n\nCREATE POLICY \"incharge_update_attendance\" ON public.class_attendance\n  FOR UPDATE TO authenticated\n  USING (\n    public.is_admin() OR \n    public.is_attendance_in_charge(department)\n  )\n  WITH CHECK (\n    public.is_admin() OR \n    public.is_attendance_in_charge(department)\n  );\n\n-- --- 8E. FACULTIES & HODS ---\nCREATE POLICY \"admin_manage_faculties\" ON public.faculties\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"hod_read_faculties\" ON public.faculties\n  FOR SELECT TO authenticated\n  USING (\n    public.is_admin() OR \n    department = public.current_staff_dept() OR\n    LOWER(email) = public.current_staff_email()\n  );\n\nCREATE POLICY \"hod_manage_faculties\" ON public.faculties\n  FOR INSERT TO authenticated\n  WITH CHECK (\n    public.is_admin() OR \n    public.is_hod(department)\n  );\n\nCREATE POLICY \"hod_update_faculties\" ON public.faculties\n  FOR UPDATE TO authenticated\n  USING (\n    public.is_admin() OR \n    public.is_hod(department) OR\n    LOWER(email) = public.current_staff_email()\n  )\n  WITH CHECK (\n    public.is_admin() OR \n    public.is_hod(department) OR\n    LOWER(email) = public.current_staff_email()\n  );\n\nCREATE POLICY \"admin_manage_hods\" ON public.hods\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"hod_read_own\" ON public.hods\n  FOR SELECT TO authenticated\n  USING (\n    public.is_admin() OR \n    LOWER(email) = public.current_staff_email()\n  );\n\n-- --- 8F. AUDIT LOGS & MIGRATION LOGS ---\nCREATE POLICY \"admin_manage_audit\" ON public.audit_logs\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\nCREATE POLICY \"staff_append_audit\" ON public.audit_logs\n  FOR INSERT TO authenticated\n  WITH CHECK (auth.role() = 'authenticated');\n\nCREATE POLICY \"admin_manage_migration\" ON public.migration_logs\n  FOR ALL TO authenticated\n  USING (public.is_admin()) WITH CHECK (public.is_admin());\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 9: RATE-LIMITED, SANITIZED STUDENT RESULT LOOKUP RPC\n-- ────────────────────────────────────────────────────────────────────\nCREATE TABLE IF NOT EXISTS public.api_rate_limits (\n  client_key        TEXT PRIMARY KEY,\n  request_count     INTEGER DEFAULT 1,\n  first_request_at  TIMESTAMPTZ DEFAULT now(),\n  last_request_at   TIMESTAMPTZ DEFAULT now()\n);\n\nALTER TABLE public.api_rate_limits ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON TABLE public.api_rate_limits FROM PUBLIC, anon;\n\nCREATE OR REPLACE FUNCTION public.get_student_result(p_roll_number TEXT)\nRETURNS JSONB\nLANGUAGE plpgsql\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$\nDECLARE\n  v_student       JSONB;\n  v_marks         JSONB;\n  v_attendance    JSONB;\n  v_subjects      JSONB;\n  v_clean_roll    TEXT;\n  v_client_ip     TEXT;\n  v_req_count     INTEGER;\nBEGIN\n  -- 1. Input sanitization: Trim, uppercase, length constraints (4 to 20 chars)\n  v_clean_roll := UPPER(TRIM(COALESCE(p_roll_number, '')));\n  IF LENGTH(v_clean_roll) < 4 OR LENGTH(v_clean_roll) > 20 THEN\n    RETURN jsonb_build_object('error', 'INVALID_ROLL', 'message', 'Invalid roll number format.');\n  END IF;\n\n  -- Strictly alphanumeric and hyphen characters only to prevent injection / scrapers\n  IF NOT (v_clean_roll ~ '^[A-Z0-9\\-]+$') THEN\n    RETURN jsonb_build_object('error', 'INVALID_ROLL', 'message', 'Roll number contains invalid characters.');\n  END IF;\n\n  -- 2. Anti-Scraping Rate Limiting (max 30 requests per minute per IP)\n  BEGIN\n    v_client_ip := current_setting('request.headers', true)::json->>'cf-connecting-ip';\n    IF v_client_ip IS NULL THEN\n      v_client_ip := current_setting('request.headers', true)::json->>'x-forwarded-for';\n    END IF;\n  EXCEPTION WHEN OTHERS THEN\n    v_client_ip := NULL;\n  END;\n\n  IF v_client_ip IS NULL OR v_client_ip = '' THEN\n    v_client_ip := 'client_' || md5(COALESCE(auth.uid()::text, 'anon'));\n  END IF;\n\n  -- Clean up stale entries older than 1 hour\n  DELETE FROM public.api_rate_limits WHERE last_request_at < now() - INTERVAL '1 hour';\n\n  -- Record and count requests in the rolling 1-minute window\n  INSERT INTO public.api_rate_limits (client_key, request_count, first_request_at, last_request_at)\n  VALUES (v_client_ip, 1, now(), now())\n  ON CONFLICT (client_key) DO UPDATE\n    SET request_count = CASE\n          WHEN api_rate_limits.first_request_at < now() - INTERVAL '1 minute' THEN 1\n          ELSE api_rate_limits.request_count + 1\n        END,\n        first_request_at = CASE\n          WHEN api_rate_limits.first_request_at < now() - INTERVAL '1 minute' THEN now()\n          ELSE api_rate_limits.first_request_at\n        END,\n        last_request_at = now();\n\n  SELECT request_count INTO v_req_count FROM public.api_rate_limits WHERE client_key = v_client_ip;\n  IF v_req_count > 30 THEN\n    RETURN jsonb_build_object('error', 'RATE_LIMITED', 'message', 'Too many requests. Please wait a minute before searching again.');\n  END IF;\n\n  -- 3. Fetch student info (active students only)\n  SELECT to_jsonb(s) INTO v_student\n  FROM (\n    SELECT roll_number, name, department, semester, section, regulation, status\n    FROM public.students\n    WHERE UPPER(roll_number) = v_clean_roll AND status = 'active'\n    LIMIT 1\n  ) s;\n\n  IF v_student IS NULL THEN\n    RETURN jsonb_build_object('error', 'NOT_FOUND', 'message', 'No active student found with this roll number.');\n  END IF;\n\n  -- 4. Fetch marks records ONLY for this student\n  SELECT COALESCE(jsonb_agg(to_jsonb(m)), '[]'::jsonb) INTO v_marks\n  FROM (\n    SELECT student_roll, subject_code, mid1_exam, mid1_assign, mid2_exam, mid2_assign, classes_conducted, classes_attended\n    FROM public.marks_records\n    WHERE UPPER(student_roll) = v_clean_roll\n  ) m;\n\n  -- 5. Fetch cumulative and period attendance ONLY for this student\n  SELECT COALESCE(jsonb_agg(to_jsonb(a)), '[]'::jsonb) INTO v_attendance\n  FROM (\n    SELECT student_roll, department, semester, period, classes_conducted, classes_attended\n    FROM public.class_attendance\n    WHERE UPPER(student_roll) = v_clean_roll\n  ) a;\n\n  -- 6. Fetch curriculum subjects for student's department (supports current and past semester views)\n  SELECT COALESCE(jsonb_agg(to_jsonb(sub)), '[]'::jsonb) INTO v_subjects\n  FROM (\n    SELECT code, name, department, semester, regulation, credits\n    FROM public.subjects\n    WHERE department = (v_student->>'department')\n    ORDER BY semester, code\n  ) sub;\n\n  -- Return sanitized, least-privilege payload\n  RETURN jsonb_build_object(\n    'student', v_student,\n    'marks', v_marks,\n    'attendance', v_attendance,\n    'subjects', v_subjects\n  );\nEND;\n$$;\n\nREVOKE ALL ON FUNCTION public.get_student_result(TEXT) FROM PUBLIC;\nGRANT EXECUTE ON FUNCTION public.get_student_result(TEXT) TO anon, authenticated, service_role;\n\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 10: TRUSTED PRIVATE PROVISIONING OF PRINCIPAL ACCOUNT\n-- ────────────────────────────────────────────────────────────────────\n-- TO PROVISION OR LINK YOUR PRINCIPAL ACCOUNT:\n-- 1. In Supabase Dashboard → Authentication → Users:\n--    Click \"Add user\" → \"Create user\".\n--    Enter official email (e.g. principal@mictech.ac.in) and a strong password.\n--    Toggle \"Auto Confirm User\" ON and click \"Create user\".\n-- 2. Copy the generated User ID (UUID).\n-- 3. Run the following command in SQL Editor (replace UUID and email):\n--\n--    INSERT INTO public.admin_users (id, email, role)\n--    VALUES ('<PASTE-USER-UUID-HERE>', 'principal@mictech.ac.in', 'super_admin')\n--    ON CONFLICT (email) DO UPDATE SET id = EXCLUDED.id, role = 'super_admin';\n--\n-- ────────────────────────────────────────────────────────────────────\n-- STEP 11: VERIFICATION QUERY\n-- ────────────────────────────────────────────────────────────────────\nSELECT \n  tablename, \n  rowsecurity AS rls_enabled\nFROM pg_tables \nWHERE schemaname = 'public' \nORDER BY tablename;\n";

    function CloudSyncModal({ isOpen, onClose, data, persist }) {
      const [status, setStatus] = useState(currentCloudStatus);
      const [msg, setMsg] = useState(cloudStatusMessage);
      const [url, setUrl] = useState(() => localStorage.getItem('mic_supabase_url') || SUPABASE_EMBEDDED_URL);
      const [anonKey, setAnonKey] = useState(() => localStorage.getItem('mic_supabase_key') || SUPABASE_EMBEDDED_KEY);
      const [isTesting, setIsTesting] = useState(false);
      const [isPushing, setIsPushing] = useState(false);
      const [isPulling, setIsPulling] = useState(false);
      const [copySuccess, setCopySuccess] = useState(false);

      useEffect(() => {
        const unsub = subscribeCloudStatus((st, m) => {
          setStatus(st);
          setMsg(m);
        });
        return unsub;
      }, []);

      if (!isOpen) return null;

      const handleTestConnection = async () => {
        setIsTesting(true);
        const cleanUrl = url.trim();
        const cleanKey = anonKey.trim();
        localStorage.setItem('mic_supabase_url', cleanUrl);
        localStorage.setItem('mic_supabase_key', cleanKey);
        SUPABASE_CONFIG.url = cleanUrl;
        SUPABASE_CONFIG.anonKey = cleanKey;
        supabaseClientInstance = null;

        const res = await checkSupabaseConnection();
        setIsTesting(false);
        if (res.connected) {
          showToast(res.message, 'success', 'Cloud Connected');
        } else {
          showToast(res.message, res.isPaused ? 'warning' : 'error', 'Cloud Notice');
        }
      };

      const handlePushToCloud = async () => {
        setIsPushing(true);
        try {
          await syncDataToSupabase(data);
          showToast('Successfully pushed all local marks, students & subjects to Supabase Cloud!', 'success', 'Synced');
        } catch (e) {
          showToast('Cloud Push failed: ' + e.message, 'error');
        }
        setIsPushing(false);
      };

      const handlePullFromCloud = async () => {
        setIsPulling(true);
        try {
          const fresh = await loadDataFromSupabase(data);
          if (fresh && fresh.students && fresh.students.length > 0) {
            persist(fresh);

    // ── Student Search Screen (Clean, Premium Official Portal) ──
    function StudentSearch({ data, persist }) {
      const [roll, setRoll] = useState('');
      const [result, setResult] = useState(null);
      const [error, setError] = useState('');
      const [isSearching, setIsSearching] = useState(false);
      const [lastSearchTime, setLastSearchTime] = useState(0);

      const handleSearch = async (e) => {
        if (e) e.preventDefault();
        const now = Date.now();
        if (now - lastSearchTime < 1200) {
          return; // prevent rapid button hammering
        }
        setLastSearchTime(now);

        const raw = roll.trim().toUpperCase();
        if (!raw) {
          setError('Please enter your roll number.');
          setResult(null);
          return;
        }

        // Input sanitization: alphanumeric and hyphens only
        const q = raw.replace(/[^A-Z0-9-]/g, '');
        if (q.length < 4 || q.length > 20) {
          setError('Please enter a valid roll number (e.g., 21H71A0501).');
          setResult(null);
          return;
        }
        setError('');

        // 1. Check if already loaded in local state (for staff browsing or previously fetched)
        const localStudent = (data?.students || []).find(s => s && String(s.roll || s.id || '').trim().toUpperCase() === q);
        if (localStudent) {
          setResult({ ...localStudent });
          return;
        }

        // 2. Fetch specific student record securely via Supabase RPC (get_student_result)
        setIsSearching(true);
        const client = getSupabaseClient();
        if (client) {
          try {
            const { data: resData, error: rpcErr } = await client.rpc('get_student_result', { p_roll_number: q });
            if (rpcErr) {
              console.warn('[Student Search RPC notice]', rpcErr.message);
            }
            if (resData) {
              if (resData.error === 'RATE_LIMITED') {
                setError('Too many requests. Please wait a minute before searching again.');
                setIsSearching(false);
                return;
              }
              if (resData.error === 'INVALID_ROLL') {
                setError(resData.message || 'Invalid roll number format.');
                setIsSearching(false);
                return;
              }
              if (resData.student) {
                const s = resData.student;
                const mappedStudent = {
                  id: s.roll_number,
                  roll: s.roll_number,
                  name: s.name,
                  dept: s.department,
                  semester: Number(s.semester) || 1,
                  section: s.section || 'A',
                  regulation: s.regulation || 'R20',
                  status: s.status || 'active'
                };

                const newMarks = (resData.marks || []).map(r => ({
                  studentId: r.student_roll,
                  subjectId: r.subject_code,
                  mid1Exam: r.mid1_exam,
                  mid1Assign: r.mid1_assign,
                  mid2Exam: r.mid2_exam,
                  mid2Assign: r.mid2_assign,
                  classesConducted: r.classes_conducted,
                  classesAttended: r.classes_attended
                }));

                const newAttendance = (resData.attendance || []).map(ca => ({
                  studentId: ca.student_roll,
                  dept: ca.department,
                  semester: Number(ca.semester) || 1,
                  period: ca.period || 'cumulative',
                  classesConducted: ca.classes_conducted,
                  classesAttended: ca.classes_attended
                }));

                const newSubjects = (resData.subjects || []).map(sub => ({
                  id: sub.code,
                  code: sub.code,
                  name: sub.name,
                  dept: sub.department,
                  semester: Number(sub.semester) || 1,
                  regulation: sub.regulation || 'R20',
                  credits: Number(sub.credits) || 3.0
                }));

                persist(prev => {
                  const prevStudents = (prev.students || []).filter(st => String(st.roll || st.id || '').toUpperCase() !== q);
                  const prevRecords = (prev.records || []).filter(r => String(r.studentId).toUpperCase() !== q);
                  const prevAtt = (prev.classAttendance || []).filter(a => String(a.studentId).toUpperCase() !== q);
                  const existingSubCodes = new Set((prev.subjects || []).map(sb => sb.code || sb.id));
                  const addedSubs = newSubjects.filter(sb => !existingSubCodes.has(sb.code));

                  return {
                    ...prev,
                    students: [...prevStudents, mappedStudent],
                    records: [...prevRecords, ...newMarks],
                    classAttendance: [...prevAtt, ...newAttendance],
                    subjects: [...(prev.subjects || []), ...addedSubs]
                  };
                });

                setResult(mappedStudent);
                setIsSearching(false);
                return;
              }
            }
          } catch (err) {
            console.warn('[Student Search RPC]', err);
          }
        }

        setIsSearching(false);
        setError(`No record found for "${raw}". Please check your roll number.`);
        setResult(null);
      };

      // Keep searched student synchronized if data updates
      useEffect(() => {
        if (result && result.roll) {
          const norm = String(result.roll).trim().toUpperCase();
          const fresh = (data?.students || []).find(s => s && String(s.roll || '').trim().toUpperCase() === norm);
          if (fresh) {
            setResult({ ...fresh });
          }
        }
      }, [data?.students]);

      if (result) {
        return <StudentResult student={result} data={data} persist={persist} onBack={() => { setResult(null); setRoll(''); }} />;
      }

      return (
        <div className="portal-search-page" style={{ position: 'relative', zIndex: 1, padding: '54px 20px 80px', maxWidth: 1100, margin: '0 auto' }}>
          {/* Subtle Portal Background Watermark */}
          <Watermark opacity={0.045} size={520} rotate={-10} />

          <div style={{ maxWidth: 680, margin: '0 auto', textAlign: 'center' }} className="animate-entry">

            {/* Gold Badge */}
            <div style={{
              display: 'inline-flex',
              alignItems: 'center',
              gap: 8,
              background: 'rgba(212, 175, 55, 0.12)',
              color: 'var(--accent-gold-dark)',
              padding: '6px 20px',
              borderRadius: 24,
              fontSize: 13,
              fontWeight: 800,
              marginBottom: 18,
              border: '1px solid rgba(7, 27, 139, 0.2)', borderTop: '4px solid #cf2c31',
              letterSpacing: '0.4px',

    // Student Result Card (Official Grade Memo with Watermark & Print)
    function StudentResult({ student, data, persist, onBack }) {
      // No profile photo — using initials only
      // Semester History view state: allows viewing any past semester up to current
      const [viewSem, setViewSem] = useState(student.semester || 1);

      const availableSems = useMemo(() => {
        const maxSem = Math.max(Number(student.semester) || 1, 1);
        const sems = [];
        for (let i = 1; i <= maxSem; i++) sems.push(i);
        return sems;
      }, [student.semester]);

      const studentSubjects = useMemo(() => {
        return data.subjects.filter(s => s.dept === student.dept && s.semester === Number(viewSem));
      }, [data.subjects, student.dept, viewSem]);

      const recordsMap = useMemo(() => {
        const map = {};
        (data.records || []).filter(r => r.studentId === student.id || r.studentId === student.roll).forEach(r => {
          map[r.subjectId] = r;
          const subObj = (data.subjects || []).find(sub => sub.id === r.subjectId || sub.code === r.subjectId);
          if (subObj) {
            if (subObj.code) map[subObj.code] = r;
            if (subObj.name) map[subObj.name.toLowerCase()] = r;
          }
        });
        return map;
      }, [data.records, student]);

      const stats = useMemo(() => {
        let totalConducted = 0;
        let totalAttended = 0;
        let midFinalSum = 0;
        let validSubjects = 0;

        // Priority 1: Cumulative attendance record for this student and viewSem
        const classAtt = (data.classAttendance || []).find(a =>
          (a.studentId === student.id || a.studentId === student.roll) &&
          Number(a.semester) === Number(viewSem) &&
          (!a.period || a.period === 'cumulative')
        );

        if (classAtt && classAtt.classesConducted) {
          totalConducted = Number(classAtt.classesConducted);
          totalAttended = Number(classAtt.classesAttended || 0);
        } else {
          // Priority 2: Sum over distinct 15-day periods without duplicate addition
          const periodRecs = (data.classAttendance || []).filter(a =>
            (a.studentId === student.id || a.studentId === student.roll) &&
            Number(a.semester) === Number(viewSem) &&
            a.period && a.period !== 'cumulative'
          );
          if (periodRecs.length > 0) {
            periodRecs.forEach(p => {
              totalConducted += Number(p.classesConducted || 0);
              totalAttended += Number(p.classesAttended || 0);
            });
          } else {
            // Fallback: per-subject legacy records
            studentSubjects.forEach(s => {
              const r = recordsMap[s.id];
              if (r && r.classesConducted) {
                totalConducted += Number(r.classesConducted);
                totalAttended += Number(r.classesAttended || 0);
              }
            });
          }
        }

        // Marks computation: ONLY if both mids are published!
        studentSubjects.forEach(s => {
          const r = recordsMap[s.id];
          if (r) {
            const pubKey = `${student.dept}_${viewSem}_${s.id}`;
            const pub = (data.publishSettings && data.publishSettings[pubKey]) || {};
            const isMid1Pub = !!pub.mid1;
            const isMid2Pub = !!pub.mid2;
            const bothPub = isMid1Pub && isMid2Pub;

            if (bothPub) {
              const m1 = midTotal(r.mid1Exam, r.mid1Assign);
              const m2 = midTotal(r.mid2Exam, r.mid2Assign);
              const fm = finalMid(m1, m2);
              if (!isNaN(fm) && (r.mid1Exam !== undefined || r.mid2Exam !== undefined)) {
                midFinalSum += fm;
                validSubjects++;
              }
            }
          }
        });

        const overallAttendance = totalConducted > 0 ? (totalAttended / totalConducted) * 100 : 0;
        const avgFinalMid = validSubjects > 0 ? (midFinalSum / validSubjects) : 0;
        return { overallAttendance, avgFinalMid, validSubjects, totalConducted, totalAttended };
      }, [studentSubjects, recordsMap, data.classAttendance, data.publishSettings, student.id, student.roll, student.dept, viewSem]);

      const isLowAttendance = stats.totalConducted > 0 && stats.overallAttendance < 75;

      return (
        <div className="student-result-page animate-entry" style={{ maxWidth: 1020, margin: '30px auto 80px', padding: '0 20px', position: 'relative', zIndex: 1 }}>
          {/* Action Bar */}
          <div className="no-print" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 22, flexWrap: 'wrap', gap: 12 }}>
            <button
              onClick={onBack}
              style={{
                background: '#FFF',
                border: '1.5px solid var(--border-card)',
                color: 'var(--primary-800)',
                padding: '10px 20px',
                borderRadius: 10,
                fontSize: 14,
                fontWeight: 700,
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                gap: 8,
                boxShadow: '0 2px 8px rgba(0,0,0,0.04)'
              }}
            >
              Back  Search Another Student
            </button>

            <button
              onClick={() => window.print()}
              style={{
                background: 'linear-gradient(135deg, #071b8b, #0d2295)', borderTop: '3px solid #cf2c31',
                color: '#FEF3C7',
                border: 'none',
                padding: '10px 22px',
                borderRadius: 10,
                fontSize: 14,
                fontWeight: 700,
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                gap: 8,
                boxShadow: '0 4px 14px rgba(9, 19, 38, 0.3)'
              }}
            >
              <Printer size={16} color="#FEF3C7" /> Print / Save Grade Memo
            </button>
          </div>

          {/* Official Academic Grade Memo Card */}
          <div className="print-memo interactive-panel" style={{
            background: '#FFFFFF',
            borderRadius: 20,
            border: '2px solid rgba(212, 175, 55, 0.45)',
            boxShadow: '0 24px 48px -12px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.04)',
            padding: '44px 40px',
            position: 'relative',
            overflow: 'hidden',
          }}>
            {/* OFFICIAL WATERMARK IN MEMO BACKGROUND */}
            <Watermark opacity={0.065} size={440} rotate={-10} />

            {/* Header with Official Logo Highlight */}
            <div style={{ textAlign: 'center', borderBottom: '2px double #CBD5E1', paddingBottom: 26, marginBottom: 28, position: 'relative', zIndex: 1 }}>
              <div style={{ display: 'inline-block', marginBottom: 12 }}>
                <OfficialLogoBox width={380} />
              </div>
              <p style={{ fontSize: 13, color: '#475569', fontWeight: 600, marginTop: 4 }}>
                (AUTONOMOUS) | Approved by AICTE, Affiliated to JNTUK, Kakinada | Accredited by NAAC 'A+' | NBA Accredited
              </p>
              <p style={{ fontSize: 12, color: '#64748B' }}>{COLLEGE_LOCATION}</p>
              <div style={{ display: 'inline-block', marginTop: 12, background: 'linear-gradient(135deg, #071b8b, #0d2295)', borderTop: '3px solid #cf2c31', color: '#FEF3C7', padding: '6px 24px', borderRadius: 20, fontSize: 13, fontWeight: 700, letterSpacing: '1px' }}>
                STUDENT MARKS &amp; ATTENDANCE RECORD
              </div>
            </div>

            {/* Student Profile Info Grid with Photo */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: 24,
              background: '#F8FAFC',
              border: '1px solid #E2E8F0',
              borderRadius: 14,
              padding: '20px 24px',
              marginBottom: 28,
              position: 'relative',
              zIndex: 1,
              flexWrap: 'wrap'
            }}>
              {/* Student initials avatar */}
              <div style={{
                width: 80,
                height: 88,
                borderRadius: 12,
                border: '2.5px solid var(--accent-gold)',
                background: 'linear-gradient(135deg, #071b8b, #0d2295)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                boxShadow: '0 4px 12px rgba(0,0,0,0.1)',
                flexShrink: 0,
                color: '#FEF3C7',
                fontSize: 28,
                fontWeight: 800,
                letterSpacing: 1
              }}>
                {student.name ? student.name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() : 'ST'}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 16, flex: 1, width: '100%' }}>
                <div>
                  <div style={{ fontSize: 11.5, color: 'var(--text-muted)', fontWeight: 600, textTransform: 'uppercase' }}>Student Name</div>
                  <div style={{ fontSize: 16.5, fontWeight: 800, color: 'var(--primary-950)', marginTop: 3 }}>{student.name}</div>
                </div>
                <div>
                  <div style={{ fontSize: 11.5, color: 'var(--text-muted)', fontWeight: 600, textTransform: 'uppercase' }}>Roll Number</div>
                  <div style={{ fontSize: 16.5, fontWeight: 800, color: '#2563EB', marginTop: 3, letterSpacing: '0.5px' }}>{student.roll}</div>
                </div>
                <div>
                  <div style={{ fontSize: 11.5, color: 'var(--text-muted)', fontWeight: 600, textTransform: 'uppercase' }}>Branch / Department</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--text-main)', marginTop: 3 }}>{student.dept}</div>
                </div>
                <div>
                  <div style={{ fontSize: 11.5, color: 'var(--text-muted)', fontWeight: 600, textTransform: 'uppercase' }}>Semester &amp; Section</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--text-main)', marginTop: 3 }}>Semester {student.semester} (Sec '{student.section || 'A'}')</div>
                </div>
              </div>
            </div>

            {/* Summary Highlights */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 16, marginBottom: 28, position: 'relative', zIndex: 1 }}>
              <div style={{
                background: isLowAttendance ? 'var(--crimson-bg)' : 'var(--emerald-bg)',
                border: `1.5px solid ${isLowAttendance ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)'}`,
                borderRadius: 14,
                padding: '18px 22px',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between'
              }}>
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: isLowAttendance ? 'var(--crimson)' : 'var(--emerald)', textTransform: 'uppercase' }}>Overall Attendance</div>
                  <div style={{ fontSize: 26, fontWeight: 800, color: isLowAttendance ? 'var(--crimson)' : 'var(--emerald)', marginTop: 2 }}>
                    {stats.totalConducted > 0 ? `${fmt1(stats.overallAttendance)}%` : '-'}
                  </div>
                  <div style={{ fontSize: 12, color: isLowAttendance ? 'var(--crimson)' : 'var(--emerald)' }}>
                    {stats.totalAttended} of {stats.totalConducted} classes attended
                  </div>
                </div>
                {isLowAttendance ? (
                  <span style={{ background: 'var(--crimson)', color: '#FFF', padding: '4px 12px', borderRadius: 8, fontSize: 11.5, fontWeight: 800 }}>
                    SHORTAGE
                  </span>
                ) : (
                  <span style={{ background: 'var(--emerald)', color: '#FFF', padding: '4px 12px', borderRadius: 8, fontSize: 11.5, fontWeight: 800 }}>
                    ELIGIBLE
                  </span>
                )}
              </div>


            </div>

            {/* Subject-wise Marks Table */}
            <div style={{ position: 'relative', zIndex: 1 }}>
              {/* Semester History Selector Tabs */}
              <div className="no-print" style={{
                display: 'flex',
                alignItems: 'center',
                gap: 8,
                marginBottom: 16,
                padding: '10px 14px',
                background: '#F8FAFC',
                borderRadius: 10,
                border: '1px solid #E2E8F0',
                flexWrap: 'wrap'
              }}>
                <span style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--primary-900)', display: 'flex', alignItems: 'center', gap: 6, marginRight: 4 }}>
                  <CalendarCheck size={15} color="#2563EB" /> Semester History:
                </span>
                {availableSems.map(s => (
                  <button
                    key={s}
                    type="button"
                    onClick={() => setViewSem(s)}
                    style={{
                      padding: '5px 13px',
                      borderRadius: 7,
                      fontSize: 12,
                      fontWeight: 700,
                      cursor: 'pointer',
                      border: viewSem === s ? '2px solid #2563EB' : '1px solid #CBD5E1',
                      background: viewSem === s ? 'linear-gradient(135deg, #EFF6FF, #DBEAFE)' : '#FFFFFF',
                      color: viewSem === s ? '#1E40AF' : '#475569',
                      boxShadow: viewSem === s ? '0 2px 6px rgba(37,99,235,0.15)' : 'none'
                    }}
                  >
                    Semester {s} {s === student.semester ? ' (Current)' : ''}
                  </button>
                ))}
              </div>

              <h3 style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--primary-900)', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                <ClipboardList size={18} color="#2563EB" /> Subject Evaluation Details (Semester {viewSem})
              </h3>

              {studentSubjects.length === 0 ? (
                <div style={{ padding: 32, textAlign: 'center', color: 'var(--text-muted)', background: '#F8FAFC', borderRadius: 12 }}>
                  No curriculum subjects listed for this department and semester.
                </div>
              ) : (
                <div className="mobile-scrollable-table student-search-table-wrap" style={{ overflowX: 'auto', borderRadius: 12, border: '1px solid #E2E8F0' }}>
                  <table className="mobile-table student-search-table" style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, background: '#FFF' }}>
                    <thead>
                      <tr style={{ background: 'linear-gradient(135deg, #071b8b, #0d2295)', borderTop: '3px solid #cf2c31', color: '#FEF3C7', textAlign: 'left' }}>
                        <th style={{ padding: '13px 16px', fontWeight: 600 }}>Subject Name</th>
                        <th style={{ padding: '13px 10px', textAlign: 'center' }}>M1 Exam /50</th>
                        <th style={{ padding: '13px 10px', textAlign: 'center' }}>M1 Assign /5</th>
                        <th style={{ padding: '13px 10px', textAlign: 'center', background: 'rgba(255,255,255,0.06)' }}>M1 Total</th>
                        <th style={{ padding: '13px 10px', textAlign: 'center' }}>M2 Exam /50</th>
                        <th style={{ padding: '13px 10px', textAlign: 'center' }}>M2 Assign /5</th>
                        <th style={{ padding: '13px 10px', textAlign: 'center', background: 'rgba(255,255,255,0.06)' }}>M2 Total</th>
                        <th style={{ padding: '13px 10px', textAlign: 'center', color: '#FEF3C7', fontWeight: 800 }}>Final /30</th>
                      </tr>
                    </thead>
                    <tbody>

                      {studentSubjects.map((sub, idx) => {
                        const rec = recordsMap[sub.id] || {};
                        const m1 = midTotal(rec.mid1Exam, rec.mid1Assign);
                        const m2 = midTotal(rec.mid2Exam, rec.mid2Assign);
                        const fm = finalMid(m1, m2);

                        const pubKey = `${student.dept}_${viewSem}_${sub.id}`;
                        const pub = (data.publishSettings && data.publishSettings[pubKey]) || {};
                        const isMid1Pub = !!pub.mid1;
                        const isMid2Pub = !!pub.mid2;
                        const bothPub = isMid1Pub && isMid2Pub;

                        return (
                          <tr key={sub.id} style={{ borderBottom: '1px solid #E2E8F0', background: idx % 2 === 0 ? '#FFFFFF' : '#FBFBFE' }}>
                            <td style={{ padding: '12px 16px', fontWeight: 600, color: '#1E293B' }}>{sub.name}</td>

                            {/* Mid 1 Exam */}
                            <td style={{ padding: '12px 10px', textAlign: 'center' }}>
                              {isMid1Pub ? (rec.mid1Exam != null && rec.mid1Exam !== '' ? rec.mid1Exam : '-') : <span style={{ color: '#94A3B8', fontSize: 11, fontStyle: 'italic' }}>Pending</span>}
                            </td>
                            {/* Mid 1 Assign */}
                            <td style={{ padding: '12px 10px', textAlign: 'center' }}>
                              {isMid1Pub ? (rec.mid1Assign != null && rec.mid1Assign !== '' ? rec.mid1Assign : '-') : <span style={{ color: '#94A3B8', fontSize: 11, fontStyle: 'italic' }}>Pending</span>}
                            </td>
                            {/* Mid 1 Total */}
                            <td style={{ padding: '12px 10px', textAlign: 'center', fontWeight: 600, background: 'rgba(0,0,0,0.015)' }}>
                              {isMid1Pub ? (rec.mid1Exam !== undefined && rec.mid1Exam !== '' ? fmt1(m1) : '-') : <span style={{ color: '#94A3B8', fontSize: 11, fontStyle: 'italic' }}>Pending</span>}
                            </td>

                            {/* Mid 2 Exam */}
                            <td style={{ padding: '12px 10px', textAlign: 'center' }}>
                              {isMid2Pub ? (rec.mid2Exam != null && rec.mid2Exam !== '' ? rec.mid2Exam : '-') : <span style={{ color: '#94A3B8', fontSize: 11, fontStyle: 'italic' }}>Pending</span>}
                            </td>
                            {/* Mid 2 Assign */}
                            <td style={{ padding: '12px 10px', textAlign: 'center' }}>
                              {isMid2Pub ? (rec.mid2Assign != null && rec.mid2Assign !== '' ? rec.mid2Assign : '-') : <span style={{ color: '#94A3B8', fontSize: 11, fontStyle: 'italic' }}>Pending</span>}
                            </td>
                            {/* Mid 2 Total */}
                            <td style={{ padding: '12px 10px', textAlign: 'center', fontWeight: 600, background: 'rgba(0,0,0,0.015)' }}>
                              {isMid2Pub ? (rec.mid2Exam !== undefined && rec.mid2Exam !== '' ? fmt1(m2) : '-') : <span style={{ color: '#94A3B8', fontSize: 11, fontStyle: 'italic' }}>Pending</span>}

    // -------------------------------------------------------------
    // PRODUCTION SUPABASE CLOUD MIGRATION WIZARD COMPONENT
    // -------------------------------------------------------------
    function MigrationWizard({ data, persist, currentUser }) {
      const [url, setUrl] = useState(() => localStorage.getItem('mic_supabase_url') || '');
      const [anonKey, setAnonKey] = useState(() => localStorage.getItem('mic_supabase_key') || '');
      const [isTesting, setIsTesting] = useState(false);
      const [connStatus, setConnStatus] = useState(null);
      const [isMigrating, setIsMigrating] = useState(false);
      const [migrationProgress, setMigrationProgress] = useState(0);
      const [migrationLogs, setMigrationLogs] = useState([]);
      const [activeBatchSize, setActiveBatchSize] = useState(50);
      const [isBenchmarking, setIsBenchmarking] = useState(false);
      const [benchResults, setBenchResults] = useState(null);
      const fileInputRef = useRef(null);

      const addLog = (msg, type = 'info') => {
        const time = new Date().toLocaleTimeString('en-IN', { hour12: false });
        setMigrationLogs(prev => [...prev, { time, msg, type }]);
      };

      const handleSaveCredentials = async () => {
        const cleanUrl = url.trim();
        const cleanKey = anonKey.trim();
        localStorage.setItem('mic_supabase_url', cleanUrl);
        localStorage.setItem('mic_supabase_key', cleanKey);
        SUPABASE_CONFIG.url = cleanUrl;
        SUPABASE_CONFIG.anonKey = cleanKey;
        supabaseClientInstance = null; // reset client

        if (!cleanUrl || !cleanKey) {
          showToast('Credentials cleared. Running in local cache mode.', 'info');
          setConnStatus({ connected: false, message: 'Running in offline local mode' });
          return;
        }

        setIsTesting(true);
        addLog(`Initiating connection test to ${cleanUrl}...`, 'info');
        const res = await checkSupabaseConnection();
        setIsTesting(false);
        setConnStatus(res);
        if (res.connected) {
          showToast('Connected to Supabase PostgreSQL database!', 'success', 'Connection Verified');
          addLog('Connection successful! public.departments table accessible.', 'success');
        } else {
          showToast(`Connection failed: ${res.message}`, 'error', 'Connection Error');
          addLog(`Connection failed: ${res.message}`, 'error');
        }
      };

      const handleExportBackup = () => {
        const dateStr = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const filename = `mic_portal_data_backup_${dateStr}.json`;
        downloadText(filename, JSON.stringify(data, null, 2), 'application/json');
        showToast('JSON Backup downloaded successfully!', 'success');
        addLog(`Full system backup exported to ${filename}`, 'success');
      };

      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!parsed.students || !parsed.subjects) {
              throw new Error('Invalid backup file structure: missing students or subjects');
            }
            persist(parsed);
            showToast(`Backup restored: ${parsed.students.length} students loaded!`, 'success');
            addLog(`Local dataset successfully restored from ${file.name}`, 'success');
          } catch (err) {
            showToast('Failed to import backup: ' + err.message, 'error');
            addLog('Failed to import backup: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
      };

      const handleStartMigration = async () => {
        const client = getSupabaseClient();
        if (!client) {
          showToast('Please configure and test Supabase URL & Anon Key first.', 'warning');
          return;
        }

        setIsMigrating(true);
        setMigrationProgress(5);
        setMigrationLogs([]);
        addLog('Starting full institutional dataset migration...', 'info');

        try {
          // 1. Departments
          addLog(`[Step 1/6] Ingesting ${DEPARTMENTS.length} Engineering Departments...`, 'info');
          const deptRows = DEPARTMENTS.map(d => ({ code: d.code, name: d.name, short_name: d.code }));
          const { error: deptErr } = await client.from('departments').upsert(deptRows, { onConflict: 'code' });
          if (deptErr) throw new Error('Departments sync error: ' + deptErr.message);
          setMigrationProgress(20);
          addLog('Departments synchronized successfully.', 'success');

          // 2. Subjects
          addLog(`[Step 2/6] Ingesting ${(data.subjects || []).length} Curriculum Subjects...`, 'info');
          const subjectRows = (data.subjects || []).map(s => ({
            code: s.id || ('SUB-' + s.name.slice(0, 4).toUpperCase()),
            name: s.name,
            department: s.dept,
            semester: Number(s.semester) || 1,
            regulation: 'R20',
            credits: 3.0
          }));
          if (subjectRows.length > 0) {
            const { error: subErr } = await client.from('subjects').upsert(subjectRows, { onConflict: 'code,department,semester,regulation' });
            if (subErr) console.warn('Subject upsert notice:', subErr.message);
          }
          setMigrationProgress(40);
          addLog(`${subjectRows.length} subjects processed.`, 'success');

          // 3. Students Batch Ingestion
          const students = data.students || [];
          addLog(`[Step 3/6] Ingesting ${students.length} Student Records (Batch size: ${activeBatchSize})...`, 'info');
          let studentsDone = 0;
          for (let i = 0; i < students.length; i += activeBatchSize) {
            const chunk = students.slice(i, i + activeBatchSize).map(s => ({
              roll_number: String(s.roll).trim().toUpperCase(),
              name: s.name,
              department: s.dept || 'CSE',
              semester: Number(s.semester) || 1,
              section: s.section || 'A',
              regulation: 'R20',
              status: 'active'
            }));
            const { error: chunkErr } = await client.from('students').upsert(chunk, { onConflict: 'roll_number' });
            if (chunkErr) console.warn(`Student batch ${i} notice:`, chunkErr.message);
            studentsDone += chunk.length;
            const pct = 40 + Math.floor((studentsDone / students.length) * 35);
            setMigrationProgress(pct);
            addLog(`Ingested ${studentsDone}/${students.length} students...`, 'info');
          }
          addLog('All student records synchronized.', 'success');
          setMigrationProgress(80);

          // 4. Audit Logs Ingestion
          addLog(`[Step 4/6] Synchronizing ${(data.auditLogs || []).length} Audit Logs...`, 'info');
          const logsToSync = (data.auditLogs || []).slice(0, 100).map(l => ({
            action: l.action || 'Log Entry',
            department: l.department || 'ALL',
            performed_by: l.performedBy || { name: 'System', role: 'admin' },
            target: l.target || '-',
            details: l.details || ''
          }));
          if (logsToSync.length > 0) {
            await client.from('audit_logs').insert(logsToSync);
          }
          setMigrationProgress(95);

          // 5. Completion
          addLog('[Step 5/6] Writing migration completion log...', 'info');
          await client.from('migration_logs').insert([{
            batch_id: 'batch_' + Date.now(),
            source: 'localStorage',
            total_records: students.length + (data.subjects || []).length + (data.records || []).length,
            successful_records: students.length,
            failed_records: 0,
            status: 'completed'
          }]);

          setMigrationProgress(100);
          addLog('Migration completed successfully! Portal is fully cloud-synchronized.', 'success');
          showToast(`Cloud Migration Complete: ${students.length} students & subjects synced!`, 'success', 'Migration Succeeded');
        } catch (err) {
          addLog('Migration halted with error: ' + err.message, 'error');
          showToast('Migration Error: ' + err.message, 'error', 'Sync Failed');
        } finally {
          setIsMigrating(false);
        }
      };
