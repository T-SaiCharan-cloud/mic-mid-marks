                    {isMid1Pub ? '✓ Published' : '○ Unpublished'}
                  </span>
                  {canEdit && (
                    <button
                      type="button"
                      onClick={() => handleTogglePublish('mid1')}
                      style={{
                        padding: '4px 10px',
                        borderRadius: 6,
                        fontSize: 12,
                        fontWeight: 700,
                        cursor: 'pointer',
                        border: isMid1Pub ? '1px solid #FCA5A5' : '1px solid #93C5FD',
                        background: isMid1Pub ? '#FEF2F2' : '#EFF6FF',
                        color: isMid1Pub ? '#DC2626' : '#1D4ED8'
                      }}
                    >
                      {isMid1Pub ? 'Unpublish' : 'Publish'}
                    </button>
                  )}
                </div>

                {/* Mid 2 Control */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F8FAFC', padding: '6px 12px', borderRadius: 8, border: '1px solid #E2E8F0' }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: '#334155' }}>Mid-2:</span>
                  <span style={{
                    fontSize: 11.5,
                    fontWeight: 800,
                    padding: '2px 8px',
                    borderRadius: 6,
                    background: isMid2Pub ? '#DCFCE7' : '#F1F5F9',
                    color: isMid2Pub ? '#15803D' : '#64748B',
                    border: `1px solid ${isMid2Pub ? '#86EFAC' : '#CBD5E1'}`
                  }}>
                    {isMid2Pub ? '✓ Published' : '○ Unpublished'}
                  </span>
                  {canEdit && (
                    <button
                      type="button"
                      onClick={() => handleTogglePublish('mid2')}
                      style={{
                        padding: '4px 10px',
                        borderRadius: 6,
                        fontSize: 12,
                        fontWeight: 700,
                        cursor: 'pointer',
                        border: isMid2Pub ? '1px solid #FCA5A5' : '1px solid #93C5FD',
                        background: isMid2Pub ? '#FEF2F2' : '#EFF6FF',
                        color: isMid2Pub ? '#DC2626' : '#1D4ED8'
                      }}
                    >
                      {isMid2Pub ? 'Unpublish' : 'Publish'}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Marks Entry Sheet */}
          {!subject ? (
            <div style={{ padding: 40, textAlign: 'center', background: '#FFF', borderRadius: 14, border: '1px solid var(--border-card)', color: 'var(--text-muted)' }}>
              <BookOpen size={32} color="#CBD5E1" style={{ marginBottom: 10 }} />
              <div>{currentUser?.role === 'faculty' ? 'No assigned subjects in this semester.' : `Please configure a subject for ${dept} Semester ${semester} first (go to Subjects tab).`}</div>
            </div>
          ) : sectionStudents.length === 0 ? (
            <div style={{ padding: 40, textAlign: 'center', background: '#FFF', borderRadius: 14, border: '1px solid var(--border-card)', color: 'var(--text-muted)' }}>
              <Users size={32} color="#CBD5E1" style={{ marginBottom: 10 }} />
              <div>No students in {dept} Semester {semester}{section !== 'all' ? (' (Section ' + section + ')') : ''}. Add via Students tab or Bulk Upload.</div>
            </div>
          ) : (
            <div className="mobile-scrollable-table marks-table-wrap" style={{ background: '#FFF', borderRadius: 14, border: '1px solid var(--border-card)', overflowX: 'auto', boxShadow: '0 4px 18px rgba(0,0,0,0.04)' }}>
              <table className="mobile-table marks-entry-table" style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                <thead>
                  <tr style={{ background: 'linear-gradient(90deg,#F8FAFC,#EFF6FF)', textAlign: 'left', borderBottom: '1.5px solid var(--border-card)', color: 'var(--text-muted)' }}>
                    <th style={{ padding: '13px 16px', minWidth: 180 }}>Student</th>
                    <th style={{ padding: '13px 8px', textAlign: 'center', minWidth: 70 }}>M1 Exam<br /><span style={{ fontSize: 10, fontWeight: 400 }}>/50</span></th>
                    <th style={{ padding: '13px 8px', textAlign: 'center', minWidth: 70 }}>M1 Assign<br /><span style={{ fontSize: 10, fontWeight: 400 }}>/5</span></th>
                    <th style={{ padding: '13px 8px', textAlign: 'center', minWidth: 70, background: 'rgba(212,175,55,0.06)' }}>M1 Total</th>
                    <th style={{ padding: '13px 8px', textAlign: 'center', minWidth: 70 }}>M2 Exam<br /><span style={{ fontSize: 10, fontWeight: 400 }}>/50</span></th>
                    <th style={{ padding: '13px 8px', textAlign: 'center', minWidth: 70 }}>M2 Assign<br /><span style={{ fontSize: 10, fontWeight: 400 }}>/5</span></th>
                    <th style={{ padding: '13px 8px', textAlign: 'center', minWidth: 70, background: 'rgba(212,175,55,0.06)' }}>M2 Total</th>
                    <th style={{ padding: '13px 8px', textAlign: 'center', minWidth: 80, color: '#2563EB', background: 'rgba(37,99,235,0.05)' }}>Final /30</th>
                  </tr>
                </thead>
                <tbody>
                  {visibleStudents.map((st, idx) => {
                    const draft = rowsDraft[st.id] || {};
                    const m1 = midTotal(draft.mid1Exam, draft.mid1Assign);
                    const m2 = midTotal(draft.mid2Exam, draft.mid2Assign);
                    const fm = finalMid(m1, m2);

                    return (
                      <tr key={st.id} style={{ borderBottom: '1px solid #F1F5F9', background: idx % 2 === 0 ? '#FFFFFF' : '#FAFBFC' }}
                        onMouseEnter={e => e.currentTarget.style.background = '#F0F7FF'}
                        onMouseLeave={e => e.currentTarget.style.background = idx % 2 === 0 ? '#FFFFFF' : '#FAFBFC'}>
                        <td style={{ padding: '9px 16px', fontWeight: 600, color: 'var(--primary-900)' }}>
                          <div style={{ fontWeight: 700, fontSize: 13.5 }}>{st.name}</div>
                          <div style={{ fontSize: 11, color: '#2563EB', fontWeight: 700, letterSpacing: 0.5 }}>{st.roll}</div>
                        </td>
                        <td style={{ padding: '9px 6px', textAlign: 'center' }}><input disabled={!canEdit} value={draft.mid1Exam ?? ''} onChange={e => updateCell(st.id, 'mid1Exam', e.target.value)} style={{ ...cellInput, ...(canEdit ? {} : { background: '#F1F5F9', color: '#64748B', cursor: 'not-allowed' }) }} placeholder="-" /></td>
                        <td style={{ padding: '9px 6px', textAlign: 'center' }}><input disabled={!canEdit} value={draft.mid1Assign ?? ''} onChange={e => updateCell(st.id, 'mid1Assign', e.target.value)} style={{ ...cellInput, ...(canEdit ? {} : { background: '#F1F5F9', color: '#64748B', cursor: 'not-allowed' }) }} placeholder="-" /></td>
                        <td style={{ padding: '9px 6px', textAlign: 'center', fontWeight: 700, background: 'rgba(212,175,55,0.04)', fontSize: 14 }}>{draft.mid1Exam !== '' ? fmt1(m1) : <span style={{ color: '#CBD5E1' }}>-</span>}</td>
                        <td style={{ padding: '9px 6px', textAlign: 'center' }}><input disabled={!canEdit} value={draft.mid2Exam ?? ''} onChange={e => updateCell(st.id, 'mid2Exam', e.target.value)} style={{ ...cellInput, ...(canEdit ? {} : { background: '#F1F5F9', color: '#64748B', cursor: 'not-allowed' }) }} placeholder="-" /></td>
                        <td style={{ padding: '9px 6px', textAlign: 'center' }}><input disabled={!canEdit} value={draft.mid2Assign ?? ''} onChange={e => updateCell(st.id, 'mid2Assign', e.target.value)} style={{ ...cellInput, ...(canEdit ? {} : { background: '#F1F5F9', color: '#64748B', cursor: 'not-allowed' }) }} placeholder="-" /></td>
                        <td style={{ padding: '9px 6px', textAlign: 'center', fontWeight: 700, background: 'rgba(212,175,55,0.04)', fontSize: 14 }}>{draft.mid2Exam !== '' ? fmt1(m2) : <span style={{ color: '#CBD5E1' }}>-</span>}</td>
                        <td style={{ padding: '9px 6px', textAlign: 'center', fontWeight: 800, color: '#2563EB', fontSize: 15, background: 'rgba(37,99,235,0.04)' }}>
                          {(draft.mid1Exam !== '' || draft.mid2Exam !== '') ? fmt1(fm) : <span style={{ color: '#CBD5E1' }}>-</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {students.length > MARKS_PAGE_SIZE && (
                <div style={{
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'space-between',
                  padding: '12px 18px',
                  background: '#FFFFFF',
                  borderRadius: '0 0 12px 12px',
                  borderTop: '1px solid #E2E8F0',
                  flexWrap: 'wrap',
                  gap: 12
                }}>
                  <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>
                    Showing <strong style={{ color: 'var(--primary-900)' }}>{((marksPage - 1) * MARKS_PAGE_SIZE) + 1}</strong> to <strong style={{ color: 'var(--primary-900)' }}>{Math.min(marksPage * MARKS_PAGE_SIZE, sectionStudents.length)}</strong> of <strong style={{ color: 'var(--primary-900)' }}>{sectionStudents.length}</strong> students (Zero-Lag Paged)
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <button
                      disabled={marksPage === 1}
                      onClick={() => setMarksPage(1)}
                      style={{ padding: '4px 10px', borderRadius: 6, border: '1px solid #CBD5E1', background: marksPage === 1 ? '#F1F5F9' : '#FFF', cursor: marksPage === 1 ? 'not-allowed' : 'pointer', fontSize: 12.5 }}
                    >
                      &laquo;
                    </button>
                    <button
                      disabled={marksPage === 1}
                      onClick={() => setMarksPage(p => Math.max(1, p - 1))}
                      style={{ padding: '4px 10px', borderRadius: 6, border: '1px solid #CBD5E1', background: marksPage === 1 ? '#F1F5F9' : '#FFF', cursor: marksPage === 1 ? 'not-allowed' : 'pointer', fontSize: 12.5 }}
                    >
                      &lsaquo; Prev
                    </button>
                    <span style={{ fontSize: 12.5, fontWeight: 700, padding: '0 8px', color: 'var(--primary-900)' }}>
                      Page {marksPage} of {marksTotalPages}
                    </span>
                    <button
                      disabled={marksPage === marksTotalPages}
                      onClick={() => setMarksPage(p => Math.min(marksTotalPages, p + 1))}
                      style={{ padding: '4px 10px', borderRadius: 6, border: '1px solid #CBD5E1', background: marksPage === marksTotalPages ? '#F1F5F9' : '#FFF', cursor: marksPage === marksTotalPages ? 'not-allowed' : 'pointer', fontSize: 12.5 }}
                    >
                      Next &rsaquo;
                    </button>
                    <button
                      disabled={marksPage === marksTotalPages}
                      onClick={() => setMarksPage(marksTotalPages)}
                      style={{ padding: '4px 10px', borderRadius: 6, border: '1px solid #CBD5E1', background: marksPage === marksTotalPages ? '#F1F5F9' : '#FFF', cursor: marksPage === marksTotalPages ? 'not-allowed' : 'pointer', fontSize: 12.5 }}
                    >
                      &raquo;
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }


    // Attendance Entry Tab ,  Class-Wide Mode (no subject-wise)
    // Period-wise attendance removed. Only cumulative (overall) attendance is used.
    const ATT_PERIODS = [
      { id: 'cumulative', label: 'Semester Total Attendance' }
    ];

    function AttendanceTab({ data, persist, currentUser }) {
      const isRestricted = currentUser?.role === 'hod' || currentUser?.role === 'faculty';
      const userDept = isRestricted ? currentUser.department : '';
      const [dept, setDept] = React.useState(userDept || 'CSE');
      const [semester, setSemester] = React.useState(5);
      const period = 'cumulative'; // Period-wise removed
      const setPeriod = () => {}; // noop — period is always cumulative
      const [draft, setDraft] = React.useState({});
      const [savedToast, setSavedToast] = React.useState(false);
      const [activeMode, setActiveMode] = React.useState('manual'); // 'manual' | 'paste'
      const [pasteAttText, setPasteAttText] = React.useState('');
      const [isAiLoading, setIsAiLoading] = React.useState(false);
      const [aiSuccessMsg, setAiSuccessMsg] = React.useState('');
      const [quickConducted, setQuickConducted] = React.useState('');
      const [searchQ, setSearchQ] = React.useState('');

      React.useEffect(() => {
        if (userDept && dept !== userDept) {
          setDept(userDept);
        }
      }, [userDept]);

      // Class-wide: students filtered by dept & semester
      const students = React.useMemo(() =>
        data.students.filter(s => s.dept === dept && s.semester === Number(semester)),
        [data.students, dept, semester]
      );

      const assignedInChargeId = (data.attendanceInCharges && data.attendanceInCharges[dept]) || null;
      const assignedInChargeFaculty = React.useMemo(() => {
        return (data.faculties || []).find(f => f.id === assignedInChargeId || (f.department === dept && f.isAttendanceInCharge));
      }, [data.faculties, assignedInChargeId, dept]);

      // Can edit: super_admin always; HOD for own dept; faculty ONLY if designated Attendance In-Charge
      const canEdit = React.useMemo(() => {
        if (!currentUser) return false;
        if (currentUser.role === 'super_admin') return true;
        if (currentUser.role === 'hod') {
          return currentUser.status !== 'disabled' && (!dept || dept === currentUser.department);
        }
        if (currentUser.role === 'faculty') {
          if (currentUser.status === 'disabled') return false;
          if (dept !== currentUser.department) return false;
          const isInCharge = currentUser.id === assignedInChargeId || !!currentUser.isAttendanceInCharge || !!currentUser.canEditAttendance;
          return isInCharge;
        }
        return false;
      }, [currentUser, dept, assignedInChargeId]);

      // Load draft from classAttendance for the selected dept, semester, and period
      React.useEffect(() => {
        const d = {};
        const periodRecords = new Map();
        const allPeriodRecords = {};

        (data.classAttendance || []).forEach(a => {
          if (a.dept === dept && Number(a.semester) === Number(semester)) {
            const p = a.period || 'cumulative';
            if (!allPeriodRecords[a.studentId]) allPeriodRecords[a.studentId] = {};
            allPeriodRecords[a.studentId][p] = a;
            if (p === period) {
              periodRecords.set(a.studentId, a);
            }
          }
        });

        students.forEach(st => {
          let cond = '';
          let att = '';
          const rec = periodRecords.get(st.id);
          if (rec) {
            cond = rec.classesConducted != null ? String(rec.classesConducted) : '';
            att = rec.classesAttended != null ? String(rec.classesAttended) : '';
          } else if (period === 'cumulative') {
            // If viewing cumulative and individual 15-day periods exist, sum them up
            const pMap = allPeriodRecords[st.id];
            if (pMap) {
              let sumC = 0, sumA = 0, hasP = false;
              ['p1', 'p2', 'p3', 'p4', 'p5', 'p6'].forEach(pk => {
                if (pMap[pk] && pMap[pk].classesConducted != null && pMap[pk].classesConducted !== '') {
                  sumC += Number(pMap[pk].classesConducted) || 0;
                  sumA += Number(pMap[pk].classesAttended) || 0;
                  hasP = true;
                }
              });
              if (hasP) {
                cond = String(sumC);
                att = String(sumA);
              }
            }
          }
          d[st.id] = { classesConducted: cond, classesAttended: att };
        });
        setDraft(d);
      }, [students, data.classAttendance, dept, semester, period]);

      // Pagination + search
      const ATT_PAGE_SIZE = 50;
      const [attPage, setAttPage] = React.useState(1);
      React.useEffect(() => { setAttPage(1); }, [dept, semester, searchQ]);

      const filteredStudents = React.useMemo(() => {
        if (!searchQ.trim()) return students;
        const q = searchQ.trim().toLowerCase();
        return students.filter(s =>
          s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q)
        );
      }, [students, searchQ]);

      const attTotalPages = Math.max(1, Math.ceil(filteredStudents.length / ATT_PAGE_SIZE));
      const visibleAttStudents = React.useMemo(() => {
        const start = (attPage - 1) * ATT_PAGE_SIZE;
        return filteredStudents.slice(start, start + ATT_PAGE_SIZE);
      }, [filteredStudents, attPage]);

      const updateCell = (sid, field, value) => {
        if (!canEdit) return;
        setDraft(prev => ({ ...prev, [sid]: { ...prev[sid], [field]: value } }));
      };

      const handleApplyQuickConducted = () => {
        if (!canEdit) { showToast('Access Denied: Only Attendance In-Charge or HOD can edit.', 'error'); return; }
        if (!quickConducted) return;
        const val = Number(quickConducted);
        if (isNaN(val) || val < 0) return;
        setDraft(prev => {
          const next = { ...prev };
          students.forEach(st => {
            next[st.id] = { ...(next[st.id] || {}), classesConducted: String(val) };
          });
          return next;
        });
        setAiSuccessMsg(`Applied ${val} classes conducted to all ${students.length} students (Semester Cumulative)!`);
        setTimeout(() => setAiSuccessMsg(''), 3000);
      };

      const handleSave = () => {
        if (!canEdit) { showToast('Permission Denied: Only Attendance In-Charge or HOD can save.', 'error'); return; }
        // Validate: classes attended must not exceed classes conducted
        const valErrors = [];
        students.forEach(st => {
          const d = draft[st.id];
          if (d && d.classesConducted && d.classesAttended) {
            const c = Number(d.classesConducted), a = Number(d.classesAttended);
            if (!isNaN(c) && !isNaN(a) && a > c)
              valErrors.push(`${st.roll}: Classes Attended (${a}) > Classes Conducted (${c})`);
          }
        });
        if (valErrors.length > 0) {
          showToast(valErrors.slice(0, 2).join(' | ') + (valErrors.length > 2 ? ` (+${valErrors.length - 2} more)` : ''), 'error', 'Classes Attended exceeds Classes Conducted');
          return;
        }

        const toVal = v => (v === '' || v === undefined) ? undefined : Number(v);

        persist(prev => {
          // Use composite key studentId|semester|period to guarantee no duplicates and protect history
          const attMap = new Map();
          (prev.classAttendance || []).forEach(a => {
            const key = `${a.studentId}|${a.semester}|${a.period || 'cumulative'}`;
            attMap.set(key, a);
          });

          // Save entries for active period
          students.forEach(st => {
            const d = draft[st.id] || {};
            const key = `${st.id}|${semester}|${period}`;
            const existing = attMap.get(key) || { studentId: st.id, dept, semester: Number(semester), period };
            attMap.set(key, {
              ...existing,
              studentId: st.id,
              dept,
              semester: Number(semester),
              period,
              classesConducted: toVal(d.classesConducted),
              classesAttended: toVal(d.classesAttended),
              updatedAt: new Date().toISOString(),
            });
          });

          // Period auto-sum removed — only cumulative saves supported

          return { ...prev, classAttendance: Array.from(attMap.values()) };
        });

        // Real-time synchronization to Supabase Cloud
        supabaseSaveAttendanceBatch(
          students.map(st => {
            const d = draft[st.id] || {};
            return {
              student_roll: st.roll || st.id,
              department: dept,
              semester: Number(semester),
              classes_conducted: toVal(d.classesConducted) || 0,
              classes_attended: toVal(d.classesAttended) || 0
            };
          })
        );

          // currentPeriodLabel removed — period-wise attendance disabled
        addAuditLog(persist, {
          action: 'Class Attendance Saved',
          department: dept,
          performedBy: currentUser,
          target: `${dept} — Semester ${semester} (Overall Cumulative)`,
          details: `Saved overall attendance for ${students.length} students`
        });
        setSavedToast(true);
        showToast(`Attendance saved for ${students.length} students!`, 'success', 'Attendance Saved');
        setTimeout(() => setSavedToast(false), 2400);
      };

      const handlePasteAttendanceFill = async () => {
        if (!pasteAttText.trim()) return;
        if (!canEdit) { alert('Access Denied.'); return; }
        setIsAiLoading(true);
        try {
          const studentRefs = students.map(s => ({ roll: s.roll, name: s.name }));
          let aiMatches = await callAiAttendanceExtraction({
            text: pasteAttText, students: studentRefs,
            defaultConducted: Number(quickConducted) || 90
          });
          if (!aiMatches || aiMatches.length === 0) {
            const lines = pasteAttText.split(/\r?\n/);
            aiMatches = [];
            lines.forEach(line => {
              const tokens = line.split(/\s{2,}|\t|,|\|/).map(t => t.trim()).filter(Boolean);
              if (tokens.length >= 2) {
                const rollCand = tokens.find(t => /^[0-9]{2}[A-Za-z0-9]{8,10}$/.test(t)) || tokens[0];
                const nums = tokens.filter(t => t !== rollCand && !isNaN(Number(t))).map(Number);
                aiMatches.push({ roll: rollCand, classesConducted: nums[0] ?? (Number(quickConducted) || 90), classesAttended: nums[1] ?? nums[0] });
              }
            });
          }
          let matched = 0;
          const newDraft = { ...draft };
          aiMatches.forEach(item => {
            if (!item || !item.roll) return;
            const rollStr = String(item.roll).trim().toLowerCase();
            const st = students.find(s => s.roll.toLowerCase() === rollStr || s.name.toLowerCase().includes(rollStr));
            if (st) {
              newDraft[st.id] = { ...newDraft[st.id] };
              if (item.classesConducted != null && item.classesConducted !== '') newDraft[st.id].classesConducted = String(item.classesConducted);
              if (item.classesAttended != null && item.classesAttended !== '') newDraft[st.id].classesAttended = String(item.classesAttended);
              matched++;
            }
          });
          if (matched > 0) {
            setDraft(newDraft);
            setAiSuccessMsg(`✓ AI filled attendance for ${matched} students!`);
            setTimeout(() => setAiSuccessMsg(''), 3500);
            setActiveMode('manual');
            setPasteAttText('');
          } else {
