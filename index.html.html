    function UploadTab({ data, persist, currentUser }) {
      const fileRef = useRef(null);
      // photoRef2 removed

      const [uploadMode, setUploadMode] = useState('file'); // 'file' | 'paste'
      const [aiStage, setAiStage] = useState('idle'); // 'idle' | 'processing' | 'ready'
      const [aiProgress, setAiProgress] = useState(0);
      const [aiStatusText, setAiStatusText] = useState('');

      const [fileName, setFileName] = useState('');
      const [rows, setRows] = useState([]);
      const [columnMappings, setColumnMappings] = useState([]);
      const [summary, setSummary] = useState({ total: 0, valid: 0, warnings: 0, errors: 0, duplicates: 0, ignoredColumns: 0 });
      const [activeFilter, setActiveFilter] = useState('all'); // 'all' | 'valid' | 'issues' | 'duplicates'
      const [showMappingPanel, setShowMappingPanel] = useState(false);
      const [updateDuplicates, setUpdateDuplicates] = useState(true);

      const [importResult, setImportResult] = useState(null);
      const [unrelatedNotice, setUnrelatedNotice] = useState(null);

      // OCR & Paste state
      const [ocrProgress, setOcrProgress] = useState(0);
      const [ocrStatus, setOcrStatus] = useState(''); // '' | 'scanning' | 'done' | 'error'

      const [pasteText, setPasteText] = useState('');

      // Existing DB keys for fast duplicate lookup
      const existingDbKeys = useMemo(() => {
        const set = new Set();
        if (data && data.students && data.records && data.subjects) {
          const sMap = new Map(data.students.map(s => [s.id, s.roll.toLowerCase()]));
          const subMap = new Map(data.subjects.map(s => [s.id, s.name.toLowerCase()]));
          data.records.forEach(r => {
            const roll = sMap.get(r.studentId);
            const sub = subMap.get(r.subjectId);
            if (roll && sub) set.add(`${roll}|${sub}`);
          });
        }
        return set;
      }, [data]);

      const downloadTemplate = () => {
        downloadText('mic-marks-upload-template.csv', Papa.unparse([
          TEMPLATE_COLUMNS
        ]));
      };

      const handleParsedResult = (res, name) => {
        setFileName(name);
        setImportResult(null);
        setUnrelatedNotice(null);

        if (!res || res.length === 0 || res.isUnrelated) {
          setAiStage('idle');
          setUnrelatedNotice('Unrelated file detected: The uploaded file contains no student roll numbers or tabular marks data. Please ensure you upload an academic marksheet or register.');
          setRows([]);
          setColumnMappings([]);
          setSummary({ total: 0, valid: 0, warnings: 0, errors: 0, duplicates: 0, ignoredColumns: 0 });
          return;
        }

        const mappings = res.columnMappings || [];
        const sum = res.summary || {
          total: res.length,
          valid: res.filter(r => r._status === 'VALID').length,
          warnings: res.filter(r => r._status === 'WARNING').length,
          errors: res.filter(r => r._status === 'ERROR').length,
          duplicates: res.filter(r => r._isDuplicate).length,
          ignoredColumns: mappings.filter(m => m.isIgnored).length
        };

        setColumnMappings(mappings);
        setSummary(sum);
        setRows(res);
        setAiStage('ready');
        setActiveFilter('all');
      };

      const handleFile = file => {
        if (!file) return;
        setAiStage('processing');
        setAiProgress(15);
        setAiStatusText('Uploading & inspecting file...');
        setUnrelatedNotice(null);

        parseDataFile(
          file,
          (pct, msg) => {
            setAiProgress(pct);
            setAiStatusText(msg);
          },
          parsed => {
            setAiProgress(100);
            setAiStatusText('AI detection complete!');
            setTimeout(() => {
              handleParsedResult(parsed, file.name);
            }, 250);
          },
          err => {
            setAiStage('idle');
            setUnrelatedNotice(err || 'Failed to process file.');
          }
        );
      };

      // Photo / OCR upload
      // handlePhotoUpload removed — photo scan feature removed
      const handlePhotoUpload_REMOVED = async (file) => {
        if (!file) return;
        setOcrStatus('scanning');
        setOcrProgress(0);
        setOcrText('');
        setAiStage('processing');
        setAiProgress(20);
        setAiStatusText('Scanning image with AI OCR...');
        setUnrelatedNotice(null);

        try {
          const text = await runOCR(file, p => {
            setOcrProgress(p);
            setAiProgress(20 + Math.round(p * 0.6));
            setAiStatusText(`OCR recognizing characters (${p}%)...`);
          });
          setOcrText(text);
          setOcrStatus('done');
          setAiProgress(90);
          setAiStatusText('Reconstructing table columns...');

          const ocrRows = parseOcrText(text);
          if (ocrRows.length >= 2) {
            const parsed = await processGridWithAiOrHeuristic(ocrRows, { name: file.name || 'Photo Scan (OCR)' }, existingDbKeys, (pct, msg) => {
              setAiProgress(pct);
              setAiStatusText(msg);
            });
            handleParsedResult(parsed, 'Photo Scan (OCR)');
          } else {
            setOcrStatus('error');
            setAiStage('idle');
            setUnrelatedNotice('Could not recognize tabular student marks from this photo. Please ensure good lighting and clear orientation.');
          }
        } catch (e) {
          setOcrStatus('error');
          setAiStage('idle');
          setUnrelatedNotice('OCR failed: ' + (e.message || e));
        }
      };

      // Paste text parser
      const handlePasteParse = () => {
        if (!pasteText.trim()) return;
        setAiStage('processing');
        setAiProgress(30);
        setAiStatusText('Analyzing pasted data structure with AI...');
        setUnrelatedNotice(null);

        setTimeout(async () => {
          let grid = [];
          const parsed = Papa.parse(pasteText.trim(), { skipEmptyLines: 'greedy' });
          if (parsed.data && parsed.data.length >= 2) {
            grid = parsed.data;
          } else {
            const lines = pasteText.trim().split('\n').filter(Boolean);
            grid = lines.map(line => line.split(/\t|\|{1}|  +/).map(c => c.trim()).filter(Boolean)).filter(r => r.length >= 2);
          }

          if (grid.length >= 2) {
            const res = await processGridWithAiOrHeuristic(grid, { name: 'Clipboard Table' }, existingDbKeys, (pct, msg) => {
              setAiProgress(pct);
              setAiStatusText(msg);
            });
            handleParsedResult(res, `Pasted Data (${res.length} rows)`);
          } else {
            setAiStage('idle');
            setUnrelatedNotice('Could not parse pasted data. Please paste comma-separated, tab-separated, or table rows containing student Roll Numbers.');
          }
        }, 150);
      };

      // User column remap
      const handleRemapColumn = (colIdx, newFieldId) => {
        const updated = columnMappings.map(m => {
          if (m.colIdx === colIdx) {
            if (newFieldId === 'IGNORED') {
              return { ...m, fieldId: 'IGNORED', targetKey: null, fieldName: 'Ignored Column', isIgnored: true, confidence: 100, confidenceLevel: 'HIGH', reason: 'User marked as ignored' };
            }
            const def = SMART_SCHEMA[newFieldId];
            return { ...m, fieldId: def.id, targetKey: def.key, fieldName: def.name, isIgnored: false, confidence: 100, confidenceLevel: 'HIGH', reason: 'User confirmed mapping' };
          }
          return m;
        });

        setColumnMappings(updated);

        // Re-normalize and re-validate all rows with new mappings
        const seenRollsInFile = new Set();
        const reParsed = rows.map(r => {
          const rec = normalizeSmartRecord(r, updated);
          const val = validateSmartRow(rec, seenRollsInFile, existingDbKeys);
          rec._errors = val.errors;
          rec._warnings = val.warnings;
          rec._status = val.status;
          rec._isDuplicate = val.isDuplicate;
          return rec;
        });

        const sum = {
          total: reParsed.length,
          valid: reParsed.filter(r => r._status === 'VALID').length,
          warnings: reParsed.filter(r => r._status === 'WARNING').length,
          errors: reParsed.filter(r => r._status === 'ERROR').length,
          duplicates: reParsed.filter(r => r._isDuplicate).length,
          ignoredColumns: updated.filter(m => m.isIgnored).length
        };

        setRows(reParsed);
        setSummary(sum);
      };

      // Filtered rows for the preview table
      const filteredRows = useMemo(() => {
        if (activeFilter === 'valid') return rows.filter(r => r._status === 'VALID');
        if (activeFilter === 'issues') return rows.filter(r => r._status === 'ERROR' || r._status === 'WARNING');
        if (activeFilter === 'duplicates') return rows.filter(r => r._isDuplicate);
        return rows;
      }, [rows, activeFilter]);

      const validRowsToImport = useMemo(() => {
        return rows.filter(r => r._status !== 'ERROR');
      }, [rows]);

      const handleImport = () => {
        if (validRowsToImport.length === 0) {
          alert('There are no valid records to import. Please review and resolve row errors first.');
          return;
        }

        persist(prev => {
          const studentMap = new Map();
          prev.students.forEach(s => studentMap.set(s.roll.toLowerCase(), { ...s }));
          const subjectMap = new Map();
          prev.subjects.forEach(s => subjectMap.set(`${s.name.toLowerCase()}|${s.dept}|${s.semester}`, { ...s }));
          const recordMap = new Map();
          prev.records.forEach(r => recordMap.set(`${r.studentId}|${r.subjectId}`, { ...r }));

          let importedCount = 0;
          let updatedCount = 0;

          validRowsToImport.forEach(r => {
            const roll = String(r['Roll Number'] || '').trim().toUpperCase();
            const name = String(r['Student Name'] || '').trim();
            let dept = String(r['Department'] || '').trim().toUpperCase() || 'CSE';
            if (currentUser?.role === 'hod') {
              dept = currentUser.department;
            }
            const semester = Number(r['Semester']) || 1;
            const section = String(r['Section'] || '').trim().toUpperCase() || 'A';
            const subjectName = String(r['Subject'] || '').trim() || 'Academic Subject';

            if (!roll || !name) return;

            let student = studentMap.get(roll.toLowerCase());
            if (!student) {
              student = { id: roll, name, roll, dept, section, semester };
              studentMap.set(roll.toLowerCase(), student);
            } else {
              if (updateDuplicates) {
                // Safe non-destructive update: never overwrite existing with placeholders
                student = {
                  ...student,
                  name: (name && !name.startsWith('Student ') && name !== roll) ? name : student.name,
                  dept: (dept && dept !== 'CSE') ? dept : student.dept,
                  section: section || student.section,
                  semester: (semester && semester > 1) ? semester : student.semester
                };
                studentMap.set(roll.toLowerCase(), student);
              }
            }

            const subKey = `${subjectName.toLowerCase()}|${dept}|${semester}`;
            let subject = subjectMap.get(subKey);
            if (!subject) {
              subject = { id: uid(), name: subjectName, dept, semester };
              subjectMap.set(subKey, subject);
            }

            const gn = key => (r[key] === '' || r[key] === undefined || r[key] === null) ? undefined : Number(r[key]);

            const recKey = `${student.id}|${subject.id}`;
            const existing = recordMap.get(recKey);

            if (existing) {
              if (updateDuplicates) {
                recordMap.set(recKey, {
                  studentId: student.id,
                  subjectId: subject.id,
                  mid1Exam: gn('Mid-1 Exam Mark /50') ?? existing.mid1Exam,
                  mid1Assign: gn('Mid-1 Assignment Mark /5') ?? existing.mid1Assign,
                  mid2Exam: gn('Mid-2 Exam Mark /50') ?? existing.mid2Exam,
                  mid2Assign: gn('Mid-2 Assignment Mark /5') ?? existing.mid2Assign,
                  classesConducted: gn('Classes Conducted') ?? existing.classesConducted,
                  classesAttended: gn('Classes Attended') ?? existing.classesAttended,
                });
                updatedCount++;
              }
            } else {
              recordMap.set(recKey, {
                studentId: student.id,
                subjectId: subject.id,
                mid1Exam: gn('Mid-1 Exam Mark /50'),
                mid1Assign: gn('Mid-1 Assignment Mark /5'),
                mid2Exam: gn('Mid-2 Exam Mark /50'),
                mid2Assign: gn('Mid-2 Assignment Mark /5'),
                classesConducted: gn('Classes Conducted'),
                classesAttended: gn('Classes Attended'),
              });
              importedCount++;
            }
          });

          return {
            ...prev,
            students: Array.from(studentMap.values()),
            subjects: Array.from(subjectMap.values()),
            records: Array.from(recordMap.values())
          };
        });

        setImportResult({
          success: validRowsToImport.length,
          failed: rows.length - validRowsToImport.length
        });

        addAuditLog(persist, {
          action: 'Bulk Data Imported',
          department: currentUser?.department || 'ALL',
          performedBy: currentUser,
          target: `${fileName || 'Bulk Upload'} (${validRowsToImport.length} rows)`,
          details: `Imported ${validRowsToImport.length} records into portal database.`
        });

        // Reset inputs
        setRows([]);
        setFileName('');
        setColumnMappings([]);
        setAiStage('idle');
        if (fileRef.current) fileRef.current.value = '';
        setPasteText('');
        setOcrText('');
        setOcrStatus('');
      };

      const handleCancel = () => {
        setRows([]);
        setFileName('');
        setColumnMappings([]);
        setAiStage('idle');
        setUnrelatedNotice(null);
        setImportResult(null);
        if (fileRef.current) fileRef.current.value = '';
        setPasteText('');
        setOcrText('');
        setOcrStatus('');
      };

      const modeBtnStyle = (id) => ({
        padding: '10px 20px', borderRadius: 10, fontWeight: 700, fontSize: 13.5,
        border: uploadMode === id ? '2px solid var(--accent-gold)' : '2px solid var(--border-card)',
        background: uploadMode === id ? 'linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.04))' : '#FFF',
        color: uploadMode === id ? 'var(--accent-gold-dark)' : 'var(--text-muted)',
        cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8,
        boxShadow: uploadMode === id ? '0 2px 12px rgba(212,175,55,0.18)' : 'none',
        transition: 'all 0.22s',
      });

      return (
        <div className="animate-entry">
          {/* Header */}
          <div style={{ marginBottom: 22, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 12 }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                <h1 style={{ fontFamily: 'var(--font-crest)', fontSize: 24, fontWeight: 800, color: 'var(--primary-900)', margin: 0 }}>
                  Smart Data Import
                </h1>

              </div>
              <p style={{ color: 'var(--text-muted)', fontSize: 14, margin: 0 }}>
                Automatic multi-format ingestion for Excel, CSV, PDF, Word &amp; photos. Extracts only required portal fields with AI anomaly detection.
              </p>
            </div>
            <button onClick={downloadTemplate} style={{ ...btnSecondary, fontSize: 12.5, padding: '8px 14px' }}>
              <Download size={13} /> Sample Template
            </button>
          </div>

          {/* Mode Switcher */}
          <div style={{ display: 'flex', gap: 10, marginBottom: 22, flexWrap: 'wrap' }}>
            <button style={modeBtnStyle('file')} onClick={() => { setUploadMode('file'); setUnrelatedNotice(null); }}>
              <FileSpreadsheet size={16} /> File Upload
              <span style={{ fontSize: 11, fontWeight: 500, opacity: 0.7 }}>(Excel / CSV / PDF / Word)</span>
            </button>
            
            <button style={modeBtnStyle('paste')} onClick={() => { setUploadMode('paste'); setUnrelatedNotice(null); }}>
              <FileText size={16} /> Paste Data
              <span style={{ fontSize: 11, fontWeight: 500, opacity: 0.7 }}>(Clipboard Grid)</span>
            </button>
          </div>

          {/* AI PROCESSING PROGRESS BAR */}
          {aiStage === 'processing' && (
            <div style={{ background: '#FFF', borderRadius: 16, border: '1.5px solid var(--accent-gold)', padding: '22px 28px', marginBottom: 22, boxShadow: '0 4px 20px rgba(212,175,55,0.14)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 22, height: 22, border: '3px solid rgba(212,175,55,0.3)', borderTop: '3px solid var(--accent-gold)', borderRadius: '50%', animation: 'spinFast 0.7s linear infinite', flexShrink: 0 }} />
                  <span style={{ fontWeight: 800, color: 'var(--primary-900)', fontSize: 14.5 }}>{aiStatusText || 'Analyzing data structure...'}</span>
                </div>
                <span style={{ fontWeight: 800, color: 'var(--accent-gold-dark)', fontSize: 14 }}>{aiProgress}%</span>
              </div>
              <div style={{ background: '#F1F5F9', borderRadius: 10, height: 9, overflow: 'hidden' }}>
                <div style={{ width: `${aiProgress}%`, height: '100%', background: 'linear-gradient(90deg, #2563EB, var(--accent-gold), var(--accent-gold-glow))', borderRadius: 10, transition: 'width 0.25s ease' }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11.5, color: 'var(--text-muted)', marginTop: 8 }}>
                <span>UPLOAD</span>
                <span>ANALYZE</span>
                <span>DETECT HEADERS</span>
                <span>EXTRACT FIELDS</span>
                <span>VALIDATE</span>
              </div>
            </div>
          )}

          {/* UNRELATED / ERROR BANNER */}
          {unrelatedNotice && (
            <div style={{ padding: '16px 20px', borderRadius: 14, background: 'var(--crimson-bg)', border: '1.5px solid rgba(239,68,68,0.3)', color: 'var(--crimson)', fontSize: 14, fontWeight: 700, marginBottom: 22, display: 'flex', alignItems: 'center', gap: 12 }}>
              <AlertTriangle size={24} style={{ flexShrink: 0 }} />
              <div style={{ flex: 1 }}>{unrelatedNotice}</div>
              <button onClick={() => setUnrelatedNotice(null)} style={{ background: 'transparent', border: 'none', color: 'var(--crimson)', cursor: 'pointer', fontWeight: 800 }}>✕</button>
            </div>
          )}

          {/* FILE UPLOAD PANEL */}
          {uploadMode === 'file' && (
            <div className="animate-entry interactive-panel" style={{
              background: '#FFFFFF', borderRadius: 18, border: '2px dashed #CBD5E1',
              padding: 38, textAlign: 'center', marginBottom: 22, transition: 'all 0.2s',
            }}
              onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--accent-gold)'; e.currentTarget.style.background = '#FFFDF0'; }}
              onDragLeave={e => { e.preventDefault(); e.currentTarget.style.borderColor = '#CBD5E1'; e.currentTarget.style.background = '#FFFFFF'; }}
              onDrop={e => {
                e.preventDefault();
                e.currentTarget.style.borderColor = '#CBD5E1'; e.currentTarget.style.background = '#FFFFFF';
                if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
              }}>
              <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05))', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px', boxShadow: '0 4px 16px rgba(212,175,55,0.2)' }}>
                <FileSpreadsheet size={30} color="var(--accent-gold-dark)" />
              </div>
              <h3 style={{ fontSize: 18, fontWeight: 800, color: 'var(--primary-900)', marginBottom: 8 }}>Drop Master Sheet or Document Here</h3>
              <p style={{ fontSize: 13.5, color: 'var(--text-muted)', maxWidth: 520, margin: '0 auto 18px' }}>
                Drag &amp; drop or browse for any student marksheet. AI will automatically inspect the columns, map fields, ignore extra data, and check marks validity.
              </p>

              <div style={{ display: 'flex', justifyContent: 'center', gap: 12, flexWrap: 'wrap' }}>
                <button onClick={downloadTemplate} style={btnSecondary}><Download size={14} /> Sample Template</button>
                <label style={{ ...btnPrimary, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                  <Upload size={14} /> Choose File
                  <input ref={fileRef} type="file" accept=".csv,.tsv,.xlsx,.xls,.pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style={{ display: 'none' }} onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
                </label>
              </div>
              {fileName && <div style={{ marginTop: 16, fontSize: 14, fontWeight: 700, color: '#2563EB' }}>📄 {fileName} ,  {rows.length} records analyzed</div>}
            </div>
          )}

          {/* Photo scan panel (UploadTab) removed */}

          {/* PASTE DATA PANEL */}
          {uploadMode === 'paste' && (
            <div className="animate-entry" style={{ background: '#FFF', borderRadius: 18, border: '1px solid var(--border-card)', padding: 28, marginBottom: 22, boxShadow: '0 4px 18px rgba(0,0,0,0.04)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
                <div style={{ width: 48, height: 48, borderRadius: '50%', background: 'linear-gradient(135deg, #EFF6FF, #DBEAFE)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <FileText size={22} color="#2563EB" />
                </div>
                <div>
                  <div style={{ fontWeight: 800, fontSize: 15, color: 'var(--primary-900)' }}>Paste from Excel / Google Sheets</div>
                  <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>Copy rows from spreadsheet software and paste below. Headers can be in any common format.</div>
                </div>
              </div>
              <div style={{ marginBottom: 12 }}>
                <textarea
                  value={pasteText}
                  onChange={e => setPasteText(e.target.value)}
                  placeholder="Paste table, CSV, or tab-separated data here (Roll Number, Name, Department, Marks/Attendance)..."
                  style={{ width: '100%', minHeight: 180, padding: '14px 16px', borderRadius: 12, border: '1.5px solid var(--border-card)', fontFamily: 'monospace', fontSize: 12.5, color: 'var(--text-main)', outline: 'none', resize: 'vertical', lineHeight: 1.6, background: '#FAFBFC' }}
                  onFocus={e => e.target.style.borderColor = 'var(--accent-gold)'}
                  onBlur={e => e.target.style.borderColor = 'var(--border-card)'}
                />
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={handlePasteParse} style={{ ...btnPrimary, display: 'flex', alignItems: 'center', gap: 7 }}>
                  <FileCheck size={15} /> Parse Pasted Data with AI
                </button>
                {pasteText && <button onClick={() => { setPasteText(''); setRows([]); setFileName(''); }} style={btnSecondary}>Clear</button>}
              </div>
            </div>
          )}

          {/* SUCCESS BANNER */}
          {importResult && (
            <div style={{ padding: '16px 22px', borderRadius: 14, background: 'var(--emerald-bg)', border: '1px solid rgba(16,185,129,0.35)', color: 'var(--emerald)', fontSize: 14.5, fontWeight: 800, marginBottom: 22, display: 'flex', alignItems: 'center', gap: 10, boxShadow: '0 4px 16px rgba(16,185,129,0.1)' }}>
              <CheckCircle2 size={20} />
              <span>{importResult.success} records imported &amp; saved to institutional database!</span>
              {importResult.failed > 0 && <span style={{ fontWeight: 600, color: 'var(--crimson)', marginLeft: 12 }}>({importResult.failed} invalid rows excluded)</span>}
            </div>
          )}

          {/* SMART PREVIEW & REVIEW LAYER */}
          {rows.length > 0 && (
            <div className="animate-entry" style={{ background: '#FFF', borderRadius: 18, border: '1px solid var(--border-card)', padding: '24px 22px', boxShadow: '0 4px 20px rgba(0,0,0,0.05)', marginBottom: 30 }}>

              {/* Top AI Summary Bar */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 14, marginBottom: 18, paddingBottom: 16, borderBottom: '1.5px solid #F1F5F9' }}>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4, flexWrap: 'wrap' }}>
                    <span style={{ fontSize: 18, fontWeight: 800, color: 'var(--primary-900)' }}>
                      AI Detection Preview
                    </span>
                    <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>({fileName})</span>
                    <span style={{ background: 'linear-gradient(135deg, rgba(37,99,235,0.08), rgba(212,175,55,0.12))', color: '#1E40AF', border: '1px solid rgba(37,99,235,0.22)', padding: '2px 9px', borderRadius: 6, fontSize: 11, fontWeight: 800, display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                      <Sparkles size={11} color="var(--accent-gold-dark)" /> {rows.aiSource ? `Engine: ${rows.aiSource}` : 'AI Engine Active'}
                    </span>
                  </div>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    <span style={{ background: '#ECFDF5', color: '#047857', border: '1px solid #A7F3D0', padding: '3px 10px', borderRadius: 6, fontSize: 12, fontWeight: 800 }}>
                      ✓ {summary.valid} Valid Records
                    </span>
                    {(summary.errors > 0 || summary.warnings > 0) && (
                      <span style={{ background: summary.errors > 0 ? '#FEF2F2' : '#FFFBEB', color: summary.errors > 0 ? '#DC2626' : '#B45309', border: `1px solid ${summary.errors > 0 ? '#FECACA' : '#FDE68A'}`, padding: '3px 10px', borderRadius: 6, fontSize: 12, fontWeight: 800 }}>
                        ⚠️  {summary.errors} Errors  |  {summary.warnings} Warnings
                      </span>
                    )}
                    {summary.duplicates > 0 && (
                      <span style={{ background: '#EFF6FF', color: '#1D4ED8', border: '1px solid #BFDBFE', padding: '3px 10px', borderRadius: 6, fontSize: 12, fontWeight: 800 }}>
                        🔍   {summary.duplicates} Duplicates
                      </span>
                    )}
                    {summary.ignoredColumns > 0 && (
                      <span style={{ background: '#F8FAFC', color: '#64748B', border: '1px solid #E2E8F0', padding: '3px 10px', borderRadius: 6, fontSize: 12, fontWeight: 700 }}>
                        ⊘ {summary.ignoredColumns} Ignored Columns
                      </span>
                    )}
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <button
                    onClick={() => setShowMappingPanel(prev => !prev)}
                    style={{ ...btnSecondary, fontSize: 12.5, padding: '7px 14px', display: 'flex', alignItems: 'center', gap: 6, borderColor: showMappingPanel ? 'var(--accent-gold)' : 'var(--border-card)' }}>
                    <Sparkles size={13} color="var(--accent-gold-dark)" />
                    {showMappingPanel ? 'Hide Field Mappings' : 'Review Field Mappings'}
                  </button>
                </div>
              </div>

              {/* Expandable Column Mapping & Confidence Panel */}
              {showMappingPanel && (
                <div style={{ background: '#F8FAFC', borderRadius: 14, border: '1px solid var(--border-card)', padding: 18, marginBottom: 20 }}>
                  <div style={{ fontWeight: 800, fontSize: 14, color: 'var(--primary-900)', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 8 }}>
                    <Sparkles size={16} color="var(--accent-gold-dark)" />
                    AI Detected Field Mappings &amp; Confidence
                  </div>
                  <p style={{ fontSize: 12.5, color: 'var(--text-muted)', marginBottom: 14 }}>
                    The AI examined column headers and cell values. Unneeded fields are automatically ignored. You can change any mapping using the dropdowns below:
                  </p>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 10 }}>
                    {columnMappings.map(m => {
                      const badgeColor = m.isIgnored
                        ? { bg: '#F1F5F9', text: '#64748B', border: '#CBD5E1' }
                        : m.confidenceLevel === 'HIGH'
                          ? { bg: '#ECFDF5', text: '#047857', border: '#A7F3D0' }
                          : m.confidenceLevel === 'MEDIUM'
                            ? { bg: '#FFFBEB', text: '#B45309', border: '#FDE68A' }
                            : { bg: '#FEF2F2', text: '#DC2626', border: '#FECACA' };

                      return (
                        <div key={m.colIdx} style={{ background: '#FFF', borderRadius: 10, border: '1px solid var(--border-card)', padding: '10px 14px' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                            <span style={{ fontWeight: 700, fontSize: 12.5, color: 'var(--primary-900)', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }} title={m.originalHeader}>
                              {m.originalHeader}
                            </span>
                            <span style={{ background: badgeColor.bg, color: badgeColor.text, border: `1px solid ${badgeColor.border}`, padding: '2px 7px', borderRadius: 4, fontSize: 10.5, fontWeight: 800 }}>
                              {m.isIgnored ? 'IGNORED' : `${m.confidenceLevel} ${m.confidence}%`}
                            </span>
                          </div>
                          <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 6 }}>{m.reason}</div>
                          <select
                            value={m.fieldId}
                            onChange={e => handleRemapColumn(m.colIdx, e.target.value)}
                            style={{ width: '100%', padding: '5px 8px', borderRadius: 6, border: '1px solid var(--border-card)', fontSize: 12, fontWeight: 600, color: m.isIgnored ? '#64748B' : '#1D4ED8', outline: 'none', background: '#FAFAFA' }}>
                            <option value="IGNORED">⛔ Ignore Column (Do not import)</option>
                            <optgroup label="Required Portal Fields">
                              <option value="roll">Roll Number *</option>
                              <option value="name">Student Name *</option>
                            </optgroup>
                            <optgroup label="Academic Meta">
                              <option value="dept">Department</option>
                              <option value="semester">Semester</option>
                              <option value="section">Section</option>
                              <option value="subject">Subject Name</option>
                            </optgroup>
                            <optgroup label="Examination Marks">
                              <option value="mid1Exam">Mid-1 Exam Mark (/50)</option>
                              <option value="mid1Assign">Mid-1 Assignment (/5)</option>
                              <option value="mid2Exam">Mid-2 Exam Mark (/50)</option>
                              <option value="mid2Assign">Mid-2 Assignment (/5)</option>
                            </optgroup>
                            <optgroup label="Attendance">
                              <option value="classesConducted">Classes Conducted</option>
                              <option value="classesAttended">Classes Attended</option>
                            </optgroup>
                          </select>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Filter Tabs & Duplicate Options */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12, marginBottom: 14 }}>
                <div style={{ display: 'flex', gap: 6 }}>
                  {[
                    ['all', `All (${rows.length})`],
                    ['valid', `Valid Only (${summary.valid})`],
                    ['issues', `Issues / Errors (${summary.errors + summary.warnings})`],
                    ['duplicates', `Duplicates (${summary.duplicates})`]
                  ].map(([f, label]) => (
                    <button
                      key={f}
                      onClick={() => setActiveFilter(f)}
                      style={{
                        padding: '6px 14px', borderRadius: 8, fontSize: 12.5, fontWeight: 700,
                        background: activeFilter === f ? 'var(--primary-900)' : '#F1F5F9',
                        color: activeFilter === f ? '#FFF' : 'var(--text-muted)',
                        border: 'none', cursor: 'pointer', transition: 'all 0.15s'
                      }}>
                      {label}
                    </button>
                  ))}
                </div>

                <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, fontWeight: 600, color: 'var(--primary-900)', cursor: 'pointer' }}>
                  <input
                    type="checkbox"
                    checked={updateDuplicates}
                    onChange={e => setUpdateDuplicates(e.target.checked)}
                    style={{ accentColor: '#2563EB', cursor: 'pointer' }}
                  />
                  Update existing student records on duplicate match
                </label>
              </div>

              {/* Data Table */}
              <div style={{ overflowX: 'auto', maxHeight: 420, overflowY: 'auto', border: '1px solid var(--border-card)', borderRadius: 12 }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12.5 }}>
                  <thead style={{ position: 'sticky', top: 0, background: '#F8FAFC', zIndex: 2 }}>
                    <tr style={{ textAlign: 'left', borderBottom: '1.5px solid var(--border-card)', color: 'var(--text-muted)' }}>
                      <th style={{ padding: '11px 16px', fontWeight: 700, width: 80 }}>Status</th>
                      <th style={{ padding: '11px 16px', fontWeight: 700, minWidth: 120 }}>Roll No</th>
                      <th style={{ padding: '11px 16px', fontWeight: 700, minWidth: 160 }}>Student Name</th>
                      <th style={{ padding: '11px 12px', fontWeight: 700 }}>Dept / Sem</th>
                      <th style={{ padding: '11px 16px', fontWeight: 700 }}>Subject</th>
                      <th style={{ padding: '11px 12px', textAlign: 'center', fontWeight: 700 }}>M1 Exam</th>
                      <th style={{ padding: '11px 12px', textAlign: 'center', fontWeight: 700 }}>M1 Assign</th>
                      <th style={{ padding: '11px 12px', textAlign: 'center', fontWeight: 700 }}>M2 Exam</th>
                      <th style={{ padding: '11px 12px', textAlign: 'center', fontWeight: 700 }}>M2 Assign</th>
                      <th style={{ padding: '11px 14px', textAlign: 'center', fontWeight: 700 }}>Attendance</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredRows.length === 0 ? (
                      <tr>
                        <td colSpan={10} style={{ padding: 32, textAlign: 'center', color: 'var(--text-muted)' }}>
                          No records match the selected filter.
                        </td>
                      </tr>
                    ) : (
                      filteredRows.slice(0, 200).map((r, i) => {
                        const hasErr = r._errors && r._errors.length > 0;
                        const hasWarn = r._warnings && r._warnings.length > 0;
                        const rowBg = hasErr ? 'var(--crimson-bg)' : hasWarn ? '#FFFDF5' : i % 2 === 0 ? '#FFF' : '#FAFBFC';

                        return (
                          <tr
                            key={i}
                            style={{ borderBottom: '1px solid #F1F5F9', background: rowBg }}
                            onMouseEnter={e => e.currentTarget.style.background = '#F0F7FF'}
                            onMouseLeave={e => e.currentTarget.style.background = rowBg}>
                            <td style={{ padding: '9px 16px' }}>
                              {hasErr ? (
                                <span style={{ color: 'var(--crimson)', fontWeight: 800, fontSize: 11.5, display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                                  ⛔ Error
                                </span>
                              ) : hasWarn ? (
                                <span style={{ color: '#D97706', fontWeight: 800, fontSize: 11.5, display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                                  ⚠️  Notice
                                </span>
                              ) : (
                                <span style={{ color: 'var(--emerald)', fontWeight: 800, fontSize: 11.5, display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                                  ✓ OK
                                </span>
                              )}
                            </td>
                            <td style={{ padding: '9px 16px', fontWeight: 700, color: '#2563EB', whiteSpace: 'nowrap' }}>
                              {r['Roll Number'] || <span style={{ color: 'var(--crimson)', fontStyle: 'italic' }}>Missing</span>}
                            </td>
                            <td style={{ padding: '9px 16px', fontWeight: 600 }}>
                              <div>{r['Student Name'] || <span style={{ color: 'var(--crimson)', fontStyle: 'italic' }}>Missing Name</span>}</div>
                              {(hasErr || hasWarn) && (
                                <div style={{ marginTop: 2 }}>
                                  {r._errors && r._errors.map((err, ei) => (
                                    <span key={ei} style={{ fontSize: 10.5, color: 'var(--crimson)', fontWeight: 700, display: 'inline-block', marginRight: 6 }}>
                                      |  {err}
                                    </span>
                                  ))}
                                  {r._warnings && r._warnings.map((w, wi) => (
                                    <span key={wi} style={{ fontSize: 10.5, color: '#B45309', fontWeight: 600, display: 'inline-block', marginRight: 6 }}>
                                      |  {w}
                                    </span>
                                  ))}
                                </div>
                              )}
                            </td>
                            <td style={{ padding: '9px 12px', whiteSpace: 'nowrap', color: 'var(--text-muted)' }}>
                              {r['Department']} - Sem {r['Semester']} ({r['Section']})
                            </td>
                            <td style={{ padding: '9px 16px', color: 'var(--text-main)', maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                              {r['Subject']}
                            </td>
                            <td style={{ padding: '9px 12px', textAlign: 'center', fontWeight: r['Mid-1 Exam Mark /50'] !== '' ? 700 : 400 }}>
                              {r['Mid-1 Exam Mark /50'] !== '' ? r['Mid-1 Exam Mark /50'] : ', '}
                            </td>
                            <td style={{ padding: '9px 12px', textAlign: 'center', fontWeight: r['Mid-1 Assignment Mark /5'] !== '' ? 700 : 400 }}>
                              {r['Mid-1 Assignment Mark /5'] !== '' ? r['Mid-1 Assignment Mark /5'] : ', '}
                            </td>
                            <td style={{ padding: '9px 12px', textAlign: 'center', fontWeight: r['Mid-2 Exam Mark /50'] !== '' ? 700 : 400 }}>
                              {r['Mid-2 Exam Mark /50'] !== '' ? r['Mid-2 Exam Mark /50'] : ', '}
                            </td>
                            <td style={{ padding: '9px 12px', textAlign: 'center', fontWeight: r['Mid-2 Assignment Mark /5'] !== '' ? 700 : 400 }}>
                              {r['Mid-2 Assignment Mark /5'] !== '' ? r['Mid-2 Assignment Mark /5'] : ', '}
                            </td>
                            <td style={{ padding: '9px 14px', textAlign: 'center' }}>
                              {r['Classes Conducted'] !== '' ? `${r['ClassesAttended'] ?? r['Classes Attended'] ?? 0}/${r['Classes Conducted']}` : ', '}
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>

              {filteredRows.length > 200 && (
                <div style={{ padding: '10px 14px 2px', fontSize: 12, color: 'var(--text-muted)' }}>
                  Showing first 200 of {filteredRows.length} rows. All valid records will be imported.
                </div>
              )}

              {/* ACTION TOOLBAR: [Import Data] [Review Issues] [Cancel] */}
              <div style={{ marginTop: 22, paddingTop: 18, borderTop: '1px solid #F1F5F9', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>
                  Ready to import <strong>{validRowsToImport.length}</strong> valid records out of {rows.length} total.
                </div>
                <div style={{ display: 'flex', gap: 10 }}>
                  <button onClick={handleCancel} style={btnSecondary}>
                    Cancel
                  </button>
                  {(summary.errors > 0 || summary.warnings > 0) && (
                    <button
                      onClick={() => setActiveFilter(activeFilter === 'issues' ? 'all' : 'issues')}
                      style={{
                        padding: '10px 18px', borderRadius: 10, fontWeight: 700, fontSize: 13.5,
                        border: '1.5px solid #F59E0B', background: activeFilter === 'issues' ? '#FEF3C7' : '#FFFDF0',
                        color: '#B45309', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6
                      }}>
                      <AlertTriangle size={15} />
                      {activeFilter === 'issues' ? 'Show All Rows' : `Review Issues (${summary.errors + summary.warnings})`}
                    </button>
                  )}
                  <button
                    onClick={handleImport}
                    disabled={validRowsToImport.length === 0}
                    style={{
                      ...btnPrimary,
                      background: 'linear-gradient(135deg, #059669, #047857)',
                      boxShadow: '0 4px 14px rgba(5,150,105,0.3)',
                      opacity: validRowsToImport.length === 0 ? 0.6 : 1,
                      cursor: validRowsToImport.length === 0 ? 'not-allowed' : 'pointer',
                      display: 'flex', alignItems: 'center', gap: 8
                    }}>
                    <FileCheck size={16} /> Import Data ({validRowsToImport.length} records)
                  </button>
                </div>
              </div>

            </div>
          )}
        </div>
      );
    }



    // Multi-Role Login ,  Super Admin / HOD / Faculty tabs

    // ══════════════════════════════════════════════════════════════
    //  FORGOT PASSWORD MODAL
    //  Works fully offline. Uses registered email to identify user.
    //  Super Admin resets the password; a toast shows the new temp pass.
    // ══════════════════════════════════════════════════════════════
    function MultiRoleLogin({ data, persist, defaultRole, onSuccess, onBack }) {
      const ROLES = [
        { id: 'faculty', label: 'Faculty', icon: LogIn },
        { id: 'hod', label: 'HOD', icon: Shield },
        { id: 'super_admin', label: 'Principal', icon: Settings },
      ];

      const [activeRole, setActiveRole] = useState(defaultRole || 'faculty');
      const [u, setU] = useState('');
      const [p, setP] = useState('');
      const [err, setErr] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      // Forgot Password states (Principal & HOD 3-step Direct 6-Digit OTP flow)
      const [forgotMode, setForgotMode] = useState(false);
      const [forgotStep, setForgotStep] = useState(1); // 1 = Email, 2 = OTP, 3 = New Password
      const [email, setEmail] = useState('');
      const [otpCode, setOtpCode] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loadingOtp, setLoadingOtp] = useState(false);

      // Switch tab ,  clear fields & messages
      const switchRole = (r) => {
        setActiveRole(r);
        setU(''); setP(''); setErr(''); setSuccessMsg('');
        setEmail(''); setOtpCode(''); setGeneratedOtp(''); setNewPassword(''); setConfirmPassword('');
        setForgotMode(false); setForgotStep(1); setLoadingOtp(false);
      };

      // Step 1: Send 6-Digit OTP Code via Supabase to email
      const handleSendOtp = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        setErr(''); setSuccessMsg('');
        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail || !cleanEmail.includes('@') || !cleanEmail.includes('.')) {
          setErr('Please enter a valid email address.');
          return;
        }

        // Validate registered email for Principal or HOD
        if (activeRole === 'super_admin') {
          const principalEmail = (localStorage.getItem('mic_principal_email_verified') || SUPER_ADMIN_ACCOUNT.email || '').trim().toLowerCase();
          if (cleanEmail !== principalEmail) {
            setErr('This email is not registered as Principal.');
            return;
          }
        } else if (activeRole === 'hod') {
          const hods = data.hods || DEFAULT_HODS;
          const match = hods.find(h => (h.email || '').trim().toLowerCase() === cleanEmail);
          if (!match) {
            setErr('No HOD account found with that email. Contact Principal.');
            return;
          }
        }

        setLoadingOtp(true);
        try {
          const result = await sendOtpViaSupabase(cleanEmail);
          if (result.success) {
            setGeneratedOtp(''); // No local code ,  Supabase manages the token
            setSuccessMsg(`A 6-digit verification code has been sent to ${cleanEmail}. Check your inbox (and spam/junk folder) and enter the 6-digit code below.`);
            setForgotStep(2);
          } else if (result.error === 'OTP_SIGNUP_DISABLED') {
            setErr(`⚠️  One-time setup needed: In your Supabase Dashboard → Authentication → Settings → Enable email signups → turn ON → Save. Then try again.`);
          } else {
            setErr(result.error || 'Failed to send OTP. Please try again.');
          }
        } catch (err) {
          setErr('Failed to send OTP. Check your internet connection and try again.');
        } finally {
          setLoadingOtp(false);
        }
      };

      // Step 2: Verify 6-digit OTP via Supabase
      const handleVerifyOtp = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        setErr(''); setSuccessMsg('');
        const cleanEmail = email.trim().toLowerCase();
        const cleanOtp = otpCode.trim().replace(/\s/g, '');
        if (!cleanOtp || cleanOtp.length !== 6 || !/^\d{6}$/.test(cleanOtp)) {
          setErr('Please enter the 6-digit numeric code from your email.');
          return;
        }

        setLoadingOtp(true);
        let verified = false;

        try {
          const client = getSupabaseClient();
          if (client && client.auth) {
            const { data: authData, error } = await client.auth.verifyOtp({
              email: cleanEmail,
              token: cleanOtp,
              type: 'email'
            });
            if (!error && authData) {
              verified = true;
              // Sign out immediately ,  we only need the verification, not a session
              await client.auth.signOut().catch(e => { if (e) console.warn('[Sync Warning]', e.message || e); });
            }
          }
        } catch (err) {
          console.warn('[OTP Verify]', err);
        }

        setLoadingOtp(false);

        if (!verified) {
          setErr('Incorrect or expired OTP code. Please check your email and enter the 6-digit code exactly as shown. Codes expire after 60 minutes.');
          return;
        }

        setSuccessMsg('OTP verified! Now set your new password.');
        setForgotStep(3);
      };

      // Step 3: Set New Password
      const handleSetNewPassword = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        setErr(''); setSuccessMsg('');
        const p1 = newPassword.trim();
        const p2 = confirmPassword.trim();

        const strengthErr = validatePasswordStrength(p1);
        if (strengthErr) {
          setErr(strengthErr);
          return;
        }
        if (p1 !== p2) {
          setErr('Passwords do not match.');
          return;
        }

        setLoadingOtp(true);
        try {
          const client = getSupabaseClient();

          if (activeRole === 'super_admin') {
            if (!client || !client.auth) throw new Error('Supabase Auth connection required.');
            // Update password securely on Supabase Auth server (bcrypt/argon2)
            const { error: pwdErr } = await client.auth.updateUser({ password: p1 });
            if (pwdErr) throw new Error('Supabase Auth error: ' + pwdErr.message);
            await client.auth.signOut().catch(() => {});
            localStorage.removeItem('mic_principal_password_hash');
          } else if (activeRole === 'hod') {
            const hashedPass = await hashPassword(p1);
            const cleanEmail = email.trim().toLowerCase();
            const hods = data.hods || DEFAULT_HODS;
            const updatedHods = hods.map(h => {
              if ((h.email || '').trim().toLowerCase() === cleanEmail) {
                return { ...h, password: hashedPass };
              }
              return h;
            });
            persist({ ...data, hods: updatedHods });
            if (client && client.auth) {
              await client.auth.signOut().catch(() => {});
            }
          }

          setSuccessMsg('Password updated successfully! Please sign in with your new password.');
          setForgotMode(false);
          setForgotStep(1);
          setEmail('');
          setOtpCode('');
          setGeneratedOtp('');
          setNewPassword('');
          setConfirmPassword('');
          setP('');
        } catch (err) {
          setErr(err?.message || 'Failed to update password. Please try again.');
        } finally {
          setLoadingOtp(false);
        }
      };

      // Normal Login Submit (all 3 roles)
      const handleSubmit = async (e) => {
        e.preventDefault();
        setErr(''); setSuccessMsg('');
        const username = u.trim();
        const password = p.trim();

        if (activeRole === 'super_admin') {
          const client = getSupabaseClient();
          if (!client || !client.auth) {
            setErr('Database authentication service is offline. Live connection to Supabase required for Principal login.');
            return;
          }

          // Determine target email for Supabase Auth
          let targetEmail = username.toLowerCase();
          if (!targetEmail.includes('@')) {
            const regEmail = (localStorage.getItem('mic_principal_email_verified') || SUPER_ADMIN_ACCOUNT.email || '').trim().toLowerCase();
            targetEmail = regEmail || `${username.toLowerCase()}@mictech.ac.in`;
          }

          // Authenticate against Supabase Auth (server-side bcrypt/argon2 validation)
          const { data: authData, error: authErr } = await client.auth.signInWithPassword({
            email: targetEmail,
            password: password
          });

          if (authErr) {
            const msg = (authErr.message || '').toLowerCase();
            if (msg.includes('invalid login credentials') || msg.includes('invalid credentials')) {
              setErr('Invalid Principal credentials. Please verify your email/username and password.');
            } else if (msg.includes('email not confirmed')) {
              setErr('Email address not confirmed in Supabase Auth. Please confirm your email in Supabase Dashboard.');
            } else {
              setErr('Authentication failed: ' + authErr.message);
            }
            return;
          }

          if (!authData || !authData.user) {
            setErr('Authentication failed. No user identity returned by server.');
            return;
          }

          // Server-side Authorization: Verify authenticated user UUID against public.admin_users table (NEVER trust localStorage!)
          const { data: adminRecord, error: adminErr } = await client
            .from('admin_users')
            .select('id, role')
            .eq('id', authData.user.id)
            .eq('role', 'super_admin')
            .maybeSingle();

          if (adminErr || !adminRecord) {
            await client.auth.signOut().catch(() => {});
            setErr('Access Denied: This authenticated account (' + authData.user.email + ') is not provisioned as Principal in the database admin_users table.');
            return;
          }

          localStorage.setItem('mic_principal_email_verified', authData.user.email.toLowerCase());
          SUPER_ADMIN_ACCOUNT.email = authData.user.email.toLowerCase();

          const authenticatedPrincipal = {
            id: authData.user.id,
            role: 'super_admin',
            name: 'System Administrator (SAI)',
            username: username.includes('@') ? (SUPER_ADMIN_ACCOUNT.username || 'SAI') : username,
            email: authData.user.email,
            authSession: true
          };

          saveSession(authenticatedPrincipal);
          showToast('Principal verified via Supabase Auth!', 'success', 'Authenticated');
          onSuccess(authenticatedPrincipal);
          return;
        }

        if (activeRole === 'hod') {
          const hods = data.hods || DEFAULT_HODS;
          if (!hods || hods.length === 0) {
            setErr('No HOD accounts configured yet. Please ask the Principal to set up your department account in the Principal Console.');
            return;
          }
          let found = null;
          for (const h of hods) {
            if (h.username === username && await verifyPassword(password, h.password)) {
              found = h; break;
            }
          }
          if (!found) { setErr('Invalid HOD username or password.'); return; }
          if (found.status === 'disabled') { setErr('Your HOD account is disabled. Contact Principal.'); return; }

          // Attempt database Supabase Auth session if user has a provisioned email
          const client = getSupabaseClient();
          if (client && client.auth && found.email) {
            try {
              await client.auth.signInWithPassword({ email: found.email, password: password });
            } catch (e) {
              console.log('[Auth] HOD local sign-in active (cloud unlinked)');
            }
          }

          const user = { ...found, role: 'hod' };
          saveSession(user);
          onSuccess(user);
          return;
        }

        if (activeRole === 'faculty') {
          const faculties = data.faculties || DEFAULT_FACULTIES;
          if (!faculties || faculties.length === 0) {
            setErr('No faculty accounts configured yet. Please ask your Head of Department to add your account.');
            return;
          }
          let found = null;
          for (const f of faculties) {
            if (f.username === username && await verifyPassword(password, f.password)) {
              found = f; break;
            }
          }
          if (!found) { setErr('Invalid faculty username or password.'); return; }
          if (found.status === 'disabled') { setErr('Your faculty account is disabled. Contact your HOD.'); return; }

          // Attempt database Supabase Auth session if user has a provisioned email
          const client = getSupabaseClient();
          if (client && client.auth && found.email) {
            try {
              await client.auth.signInWithPassword({ email: found.email, password: password });
            } catch (e) {
              console.log('[Auth] Faculty local sign-in active (cloud unlinked)');
            }
          }

          const user = { ...found, role: 'faculty' };
          saveSession(user);
          onSuccess(user);
          return;
        }
      };

      const roleLabels = {
        faculty: { heading: 'Faculty Sign In', sub: 'Marks & Attendance Management', placeholder_u: 'Faculty username', placeholder_p: 'Faculty password', hint: 'Enter your assigned faculty credentials' },
        hod: { heading: 'HOD Portal Sign In', sub: 'Department Head Administration', placeholder_u: 'HOD username', placeholder_p: 'HOD password', hint: 'Enter your department HOD credentials' },
        super_admin: { heading: 'Principal Console', sub: 'System-Level Administration', placeholder_u: 'Principal email or username', placeholder_p: 'Principal password', hint: 'Authorized Principal credentials validated via Supabase Auth' },
      };
      const rl = roleLabels[activeRole];

      return (
        <>
          <div className={`login-page login-${activeRole}`} style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, position: 'relative', background: 'var(--bg-canvas)' }}>
            <Watermark opacity={0.045} size={500} />
            <div className="search-card-animated interactive-panel animate-entry login-card" style={{
              width: '100%', maxWidth: 460,
              background: '#FFFFFF',
              borderRadius: 22,
              border: '1px solid rgba(7, 27, 139, 0.2)', borderTop: '4px solid #cf2c31',
              boxShadow: '0 24px 56px -12px rgba(9, 19, 38, 0.22)',
              overflow: 'hidden',
              position: 'relative', zIndex: 1
            }}>

              {/* Header */}
              <div className="login-header" style={{ background: 'linear-gradient(135deg, #071b8b 0%, #0d2295 100%)', borderTop: '4px solid #cf2c31', padding: '28px 32px 22px', textAlign: 'center' }}>
                <div className="login-logo" style={{ display: 'inline-block', marginBottom: 12 }}>
                  <OfficialLogoBox width={240} />
                </div>
                <div className="login-college-name">DVR &amp; Dr. HS MIC College of Technology</div>
                <h2 style={{ fontFamily: 'var(--font-crest)', fontSize: 18, fontWeight: 800, color: '#FEF3C7', marginTop: 6 }}>
                  {forgotMode
                    ? `Reset ${activeRole === 'super_admin' ? 'Principal' : 'HOD'} Password`
                    : rl.heading}
                </h2>
                <p style={{ fontSize: 12, color: '#94A3B8', marginTop: 3 }}>
                  {forgotMode
                    ? `Step ${forgotStep} of 3: ${forgotStep === 1 ? 'Enter Registered Email' : forgotStep === 2 ? 'Enter 6-Digit Mail OTP' : 'Set New Password'}`
                    : rl.sub}
                </p>
              </div>

              {/* Role Tabs */}
              <div className="login-role-tabs" style={{ display: 'flex', borderBottom: '1px solid #E2E8F0', background: '#F8FAFC' }}>
                {ROLES.map(r => {
                  const Ic = r.icon;
                  const active = activeRole === r.id;
                  return (
                    <button
                      key={r.id}
                      className={active ? 'login-role-tab is-active' : 'login-role-tab'}
                      onClick={() => switchRole(r.id)}
                      style={{
                        flex: 1, border: 'none', background: 'none',
                        padding: '11px 0', cursor: 'pointer',
                        fontSize: 12.5, fontWeight: active ? 700 : 500,
                        color: active ? '#091326' : '#94A3B8',
                        borderBottom: active ? '2.5px solid #D4AF37' : '2.5px solid transparent',
                        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5,
                        transition: 'all 0.18s'
                      }}
                    >
                      <Ic size={13} color={active ? '#D4AF37' : '#CBD5E1'} />
                      {r.label}
                    </button>
                  );
                })}
              </div>

              {/* Form Body */}
              <div className="login-form-body" style={{ padding: '28px 32px' }}>
                {successMsg && (
                  <div style={{ padding: '10px 14px', borderRadius: 8, background: '#ECFDF5', color: '#065F46', fontSize: 13, fontWeight: 600, marginBottom: 18, border: '1px solid #D1FAE5' }}>
                    {successMsg}
                  </div>
                )}
                {err && (
                  <div style={{ padding: '10px 14px', borderRadius: 8, background: '#FEF2F2', color: '#DC2626', fontSize: 13, fontWeight: 600, marginBottom: 18, border: '1px solid #FECACA' }}>
                    {err}
                  </div>
                )}

                {forgotMode ? (
                  <>
                    {forgotStep === 1 && (
                      <form onSubmit={handleSendOtp}>
                        <div style={{ marginBottom: 14 }}>
                          <label style={labelStyle}>Registered Email (Personal or Official)</label>
                          <input
                            type="email"
                            value={email}
                            onChange={e => setEmail(e.target.value)}
                            placeholder={activeRole === 'super_admin' ? 'e.g. yourname@gmail.com or college mail' : 'e.g. hod.dept@gmail.com or college mail'}
                            style={inputStyle}
                            autoFocus
                            autoComplete="email"
                            required
                          />
                        </div>
                        <div style={{ marginBottom: 18, fontSize: 11.5, color: '#94A3B8' }}>
                          Enter your registered personal email (e.g. Gmail, Outlook) or college email to receive a secure 6-digit OTP code directly to your inbox.
                        </div>

                        <button
                          className="login-submit"
                          type="submit"
                          disabled={loadingOtp}
                          style={{ ...btnPrimary, width: '100%', padding: '12px', fontSize: 14.5, fontWeight: 700, cursor: loadingOtp ? 'not-allowed' : 'pointer', opacity: loadingOtp ? 0.75 : 1 }}
                        >
                          {loadingOtp ? 'Sending OTP Code...' : 'Send OTP Code'}
                        </button>

                        <button
                          type="button"
                          onClick={() => { setForgotMode(false); setForgotStep(1); setErr(''); setSuccessMsg(''); }}
                          style={{ background: 'none', border: 'none', color: '#2563EB', width: '100%', marginTop: 14, fontSize: 13, cursor: 'pointer', fontWeight: 600 }}
                        >
                          ←  Back to Sign In
                        </button>
                      </form>
                    )}

                    {forgotStep === 2 && (
                      <form onSubmit={handleVerifyOtp}>
                        <div style={{ marginBottom: 14 }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                            <label style={{ ...labelStyle, marginBottom: 0 }}>6-Digit OTP Code</label>
                            <button
                              type="button"
                              onClick={() => { setForgotStep(1); setOtpCode(''); setErr(''); setSuccessMsg(''); }}
                              style={{ background: 'none', border: 'none', color: '#2563EB', fontSize: 12, cursor: 'pointer', padding: 0, fontWeight: 600, textDecoration: 'underline' }}
                            >
                              Change Email
                            </button>
                          </div>
                          <input
                            type="text"
                            maxLength={6}
                            value={otpCode}
                            onChange={e => setOtpCode(e.target.value.replace(/\D/g, ''))}
                            placeholder="123456"
                            style={{ ...inputStyle, textAlign: 'center', letterSpacing: '6px', fontSize: 22, fontWeight: 800 }}
                            autoFocus
                            autoComplete="one-time-code"
                            required
                          />
                        </div>

                        <div style={{ background: '#F0FDF4', border: '1px solid #BBF7D0', borderRadius: 10, padding: '10px 14px', marginBottom: 16 }}>
                          <div style={{ fontSize: 12, color: '#166534', fontWeight: 600, marginBottom: 4 }}>
                            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}><Mail size={15} color="#2563EB" /> OTP Code sent to: <strong>{email}</strong></span>
                          </div>
                          <div style={{ fontSize: 11.5, color: '#15803D' }}>
                            Please check your email inbox (and spam folder) for the 6-digit verification code and enter it below.
                          </div>
                        </div>

                        <div style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', marginBottom: 18 }}>
                          <button
                            type="button"
                            onClick={handleSendOtp}
                            disabled={loadingOtp}
                            style={{
                              background: 'none', border: 'none', cursor: loadingOtp ? 'not-allowed' : 'pointer',
                              color: '#2563EB', fontSize: 12.5, fontWeight: 600,
                              textDecoration: 'underline', padding: 0
                            }}
                          >
                            {loadingOtp ? 'Resending...' : 'Resend Code'}
                          </button>
                        </div>

                        <button
                          className="login-submit"
                          type="submit"
                          disabled={loadingOtp}
                          style={{ ...btnPrimary, width: '100%', padding: '12px', fontSize: 14.5, fontWeight: 700, cursor: loadingOtp ? 'not-allowed' : 'pointer', opacity: loadingOtp ? 0.75 : 1 }}
                        >
                          {loadingOtp ? 'Verifying...' : 'Verify Code'}
                        </button>

                        <button
                          type="button"
                          onClick={() => { setForgotMode(false); setForgotStep(1); setErr(''); setSuccessMsg(''); }}
                          style={{ background: 'none', border: 'none', color: '#2563EB', width: '100%', marginTop: 14, fontSize: 13, cursor: 'pointer', fontWeight: 600 }}
                        >
                          ←  Back to Sign In
                        </button>
                      </form>
                    )}

                    {forgotStep === 3 && (
                      <form onSubmit={handleSetNewPassword}>
                        <div style={{ marginBottom: 14 }}>
                          <label style={labelStyle}>New Password</label>
                          <input
                            type="password"
                            value={newPassword}
                            onChange={e => setNewPassword(e.target.value)}
                            placeholder="Enter new password (min 4 characters)"
                            style={inputStyle}
                            autoFocus
                            autoComplete="new-password"
                            required
                          />
                        </div>
                        <div style={{ marginBottom: 18 }}>
                          <label style={labelStyle}>Confirm Password</label>
                          <input
                            type="password"
                            value={confirmPassword}
                            onChange={e => setConfirmPassword(e.target.value)}
                            placeholder="Confirm new password"
                            style={inputStyle}
                            autoComplete="new-password"
                            required
                          />
                        </div>

                        <button
                          className="login-submit"
                          type="submit"
                          disabled={loadingOtp}
                          style={{ ...btnPrimary, width: '100%', padding: '12px', fontSize: 14.5, fontWeight: 700, cursor: loadingOtp ? 'not-allowed' : 'pointer', opacity: loadingOtp ? 0.75 : 1 }}
                        >
                          {loadingOtp ? 'Updating Password...' : 'Set New Password'}
                        </button>

                        <button
                          type="button"
                          onClick={() => { setForgotMode(false); setForgotStep(1); setErr(''); setSuccessMsg(''); }}
                          style={{ background: 'none', border: 'none', color: '#2563EB', width: '100%', marginTop: 14, fontSize: 13, cursor: 'pointer', fontWeight: 600 }}
                        >
                          ←  Back to Sign In
                        </button>
                      </form>
                    )}
                  </>
                ) : (
                  <form onSubmit={handleSubmit}>
                    <div style={{ marginBottom: 14 }}>
                      <label style={labelStyle}>Username</label>
                      <input
                        key={activeRole + '-u'}
                        value={u}
                        onChange={e => setU(e.target.value)}
                        placeholder={rl.placeholder_u}
                        style={inputStyle}
                        autoFocus
                        autoComplete="username"
                      />
                    </div>
                    <div style={{ marginBottom: 8 }}>
                      <label style={labelStyle}>Password</label>
                      <input
                        key={activeRole + '-p'}
                        type="password"
                        value={p}
                        onChange={e => setP(e.target.value)}
                        placeholder={rl.placeholder_p}
                        style={inputStyle}
                        autoComplete="current-password"
                      />
                    </div>
                    <div style={{ marginBottom: 10, fontSize: 11.5, color: '#94A3B8' }}>{rl.hint}</div>

                    {activeRole === 'super_admin' && (
                      <div style={{ textAlign: 'right', marginBottom: 18 }}>
                        <button
                          type="button"
                          onClick={() => {
                            setForgotMode(true);
                            setForgotStep(1);
                            setErr('');
                            setSuccessMsg('');
                            setEmail('');
                            setOtpCode('');
                            setGeneratedOtp('');
                            setNewPassword('');
                            setConfirmPassword('');
                          }}
                          style={{
                            background: 'none', border: 'none', cursor: 'pointer',
                            color: '#64748B', fontSize: 12, fontWeight: 600,
                            textDecoration: 'underline', padding: 0
                          }}
                        >
                          Forgot Password?
                        </button>
                      </div>
                    )}

                    {activeRole === 'hod' && (
                      <div style={{ textAlign: 'right', marginBottom: 18 }}>
                        <button
                          type="button"
                          onClick={() => {
                            setForgotMode(true);
                            setForgotStep(1);
                            setErr('');
                            setSuccessMsg('');
                            setEmail('');
                            setOtpCode('');
                            setGeneratedOtp('');
                            setNewPassword('');
                            setConfirmPassword('');
                          }}
                          style={{
                            background: 'none', border: 'none', cursor: 'pointer',
                            color: '#2563EB', fontSize: 12.5, fontWeight: 600,
                            textDecoration: 'underline', padding: 0
                          }}
                        >
                          Forgot Password?
                        </button>
                      </div>
                    )}

                    <button className="login-submit" type="submit" style={{ ...btnPrimary, width: '100%', padding: '12px', fontSize: 14.5, fontWeight: 700 }}>
                      Sign In
                    </button>

                    <button
                      type="button"
                      onClick={onBack}
                      style={{ background: 'none', border: 'none', color: 'var(--text-muted)', width: '100%', marginTop: 16, fontSize: 13, cursor: 'pointer', fontWeight: 600 }}
                    >
                      ←  Back to Student Portal
                    </button>
                  </form>
                )}
              </div>
            </div>
          </div>
        </>
      );
    }


    // Generic Viewport-Centered Modal (using React Portal)
    function Modal({ title, children, onClose, maxWidth = 480 }) {
      React.useEffect(() => {
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          document.body.style.overflow = prevOverflow;
        };
      }, []);

      const modalContent = (
        <div style={{
          position: 'fixed',
          top: 0,
          left: 0,
          right: 0,
          bottom: 0,
          width: '100vw',
          height: '100vh',
          background: 'rgba(9, 19, 38, 0.75)',
          backdropFilter: 'blur(6px)',
          WebkitBackdropFilter: 'blur(6px)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 99999,
          padding: 16,
          boxSizing: 'border-box'
        }} onClick={onClose}>
          <div style={{
            background: '#FFFFFF',
            borderRadius: 18,
            maxWidth: maxWidth,
            width: '100%',
            maxHeight: '90vh',
            overflowY: 'auto',
            padding: 28,
            boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.35)',
            position: 'relative',
            margin: 'auto'
          }} onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
              <h3 style={{ fontFamily: 'var(--font-crest)', fontSize: 18, fontWeight: 800, color: 'var(--primary-900)', margin: 0 }}>{title}</h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', padding: 4, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <X size={18} />
              </button>
            </div>
            {children}
          </div>
        </div>
      );

      return ReactDOM.createPortal(modalContent, document.body);
    }

    // Shared UI styling constants
    const inputStyle = {
      width: '100%',
      padding: '11px 14px',
      borderRadius: 10,
      border: '1.5px solid var(--border-card)',
      fontSize: 14,
      outline: 'none',
      background: '#FAFAFC',
      color: '#0F172A',
    };
    const cellInput = {
      width: 58,
      padding: '6px',
      borderRadius: 6,
      border: '1px solid #CBD5E1',
      fontSize: 13,
      textAlign: 'center',
      outline: 'none'
    };
    const btnPrimary = {
      background: 'linear-gradient(135deg, #071b8b 0%, #0d2295 100%)', borderTop: '4px solid #cf2c31',
      color: '#FEF3C7',
      border: 'none',
      borderRadius: 10,
      padding: '11px 22px',
      fontSize: 14,
      fontWeight: 700,
      cursor: 'pointer',
      boxShadow: '0 4px 14px rgba(9, 19, 38, 0.25)'
    };
    const btnSecondary = {
      background: '#FFFFFF',
      color: 'var(--primary-900)',
      border: '1.5px solid var(--border-card)',
      borderRadius: 10,
      padding: '10px 18px',
      fontSize: 13.5,
      fontWeight: 600,
      cursor: 'pointer',
      boxShadow: '0 2px 6px rgba(0,0,0,0.03)'
    };
    const iconActionBtn = {
      background: '#F1F5F9',
      border: 'none',
      borderRadius: 8,
      width: 32,
      height: 32,
      display: 'inline-flex',
      alignItems: 'center',

    };
    const labelStyle = {
      display: 'block',
      fontSize: 13,

    };
    const badgeDept = {
      background: 'rgba(37, 99, 235, 0.1)',
      color: '#2563EB',
