    // Helper function for parsing pasted bulk student text (Excel, Sheets, CSV, Word, WhatsApp, TSV)
    function parsePastedStudentRow(line, defaultDept, defaultSec, defaultSem) {
      let text = String(line || '').trim();
      if (!text) return null;

      // Strip leading serial numbering (e.g. "1.", "1)", "[1]", "#1 ")
      text = text.replace(/^#?\d+[\.\)\:\-\]]\s*/, '').trim();

      // Skip obvious header rows
      const lower = text.toLowerCase();
      if (
        lower.includes('roll number') ||
        lower.includes('hall ticket') ||
        (lower.includes('roll') && lower.includes('name')) ||
        lower.includes('student name')
      ) {
        return null;
      }

      let parts = [];
      if (text.includes('\t')) {
        parts = text.split('\t').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      } else if (text.includes(',')) {
        parts = text.split(',').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      } else if (text.includes(';')) {
        parts = text.split(';').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      } else if (text.includes('|')) {
        parts = text.split('|').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      } else if (text.includes(' - ')) {
        parts = text.split(' - ').map(s => s.trim()).filter(Boolean);
      } else if (/\s{2,}/.test(text)) {
        parts = text.split(/\s{2,}/).map(s => s.trim()).filter(Boolean);
      } else {
        const spaceParts = text.split(' ').map(s => s.trim()).filter(Boolean);
        const isRollToken = t => /^[0-9A-Za-z]{6,12}$/i.test(t) && /\d/.test(t) && /[A-Za-z]/i.test(t);
        if (spaceParts.length >= 2 && isRollToken(spaceParts[0])) {
          parts = [spaceParts[0], spaceParts.slice(1).join(' ')];
        } else if (spaceParts.length >= 2 && isRollToken(spaceParts[spaceParts.length - 1])) {
          parts = [spaceParts.slice(0, -1).join(' '), spaceParts[spaceParts.length - 1]];
        } else {
          parts = spaceParts;
        }
      }

      if (parts.length === 0) return null;
      if (/^\d{1,4}$/.test(parts[0]) && parts.length > 2) parts.shift();

      let roll = '';
      let name = '';
      let dept = '';
      let section = '';
      let semester = null;
      let rollIdx = -1;

      for (let i = 0; i < parts.length; i++) {
        const p = parts[i].toUpperCase();
        if (/^[0-9]{2}[A-Z0-9]{6,10}$/.test(p) || (p.length >= 6 && p.length <= 15 && /\d/.test(p) && /[A-Z]/.test(p))) {
          roll = p;
          rollIdx = i;
          break;
        }
      }

      if (!roll) {
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          if (/^[A-Z0-9]{5,15}$/i.test(p)) {
            roll = p.toUpperCase();
            rollIdx = i;
            break;
          }
        }
      }

      const deptRegex = /^(CSE|AIML|AIDS|IT|ECE|EEE|MECH|CIVIL)$/i;
      let deptIdx = -1;
      for (let i = 0; i < parts.length; i++) {
        if (i === rollIdx) continue;
        if (deptRegex.test(parts[i].trim())) {
          dept = parts[i].trim().toUpperCase();
          deptIdx = i;
          break;
        }
      }

      let secIdx = -1;
      for (let i = 0; i < parts.length; i++) {
        if (i === rollIdx || i === deptIdx) continue;
        const clean = parts[i].trim().toUpperCase().replace(/^SEC(TION)?\s*/i, '');
        if (/^[A-D]$/.test(clean)) {
          section = clean;
          secIdx = i;
          break;
        }
      }

      let semIdx = -1;
      for (let i = 0; i < parts.length; i++) {
        if (i === rollIdx || i === deptIdx || i === secIdx) continue;
        const clean = parts[i].trim().toUpperCase().replace(/^SEM(ESTER)?\s*/i, '');
        const num = parseInt(clean, 10);
        if (!isNaN(num) && num >= 1 && num <= 8) {
          semester = num;
          semIdx = i;
          break;
        }
      }

      const nameParts = [];
      for (let i = 0; i < parts.length; i++) {
        if (i === rollIdx || i === deptIdx || i === secIdx || i === semIdx) continue;
        nameParts.push(parts[i]);
      }
      name = nameParts.join(' ').trim();

      if (!roll && parts.length >= 2) {
        if (/\d/.test(parts[0])) {
          roll = parts[0].toUpperCase();
          name = parts.slice(1).join(' ');
        } else {
          name = parts[0];
          roll = parts.slice(1).join(' ').toUpperCase();
        }
      }

      if (!roll && !name) return null;
      if (!name && roll) name = "Student " + roll;
      name = cleanStudentName(name);

      const autoDept = detectDeptFromRoll(roll);
      const autoSem = detectSemFromRoll(roll);

      return {
        roll: roll.toUpperCase(),
        name: name,
        dept: dept || autoDept || defaultDept || 'CSE',
        section: section || defaultSec || 'A',
        semester: semester || autoSem || defaultSem || 1
      };
    }

    // Students Tab (with bulk import, selection & bulk deletion)
    function StudentsTab({ data, persist, currentUser }) {
      const isRestricted = currentUser?.role === 'hod' || currentUser?.role === 'faculty';
      const userDept = isRestricted ? currentUser.department : '';
      const [modal, setModal] = useState(null);
      const [errors, setErrors] = useState({});
      const [filterDept, setFilterDept] = useState(userDept);
      const [q, setQ] = useState('');
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [selectedIds, setSelectedIds] = useState([]);
      const [confirmBulkDelete, setConfirmBulkDelete] = useState(false);
      const [confirmDeleteAllFiltered, setConfirmDeleteAllFiltered] = useState(false);
      const [quickAdd, setQuickAdd] = useState({ name: '', roll: '', dept: userDept || 'CSE', section: 'A', semester: 1 });
      const [bulkPasteModal, setBulkPasteModal] = useState(false);
      const [pasteText, setPasteText] = useState('');
      const [pasteDefaultDept, setPasteDefaultDept] = useState(userDept || 'CSE');
      const [pasteDefaultSec, setPasteDefaultSec] = useState('A');
      const [pasteDefaultSem, setPasteDefaultSem] = useState(1);
      const [pasteUpdateExisting, setPasteUpdateExisting] = useState(true);
      const [isAiFormatting, setIsAiFormatting] = useState(false);

      // Safe Environment Snapshot System
      const [safetySnapshot, setSafetySnapshot] = useState(() => {
        try { return JSON.parse(localStorage.getItem('mic-safety-snapshot')); } catch (e) { return null; }
      });

      const createSafetySnapshot = (label) => {
        try {
          const snap = {
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
            date: new Date().toLocaleDateString(),
            label: label || 'Safety Snapshot',
            count: (data?.students || []).length,
            students: JSON.parse(JSON.stringify(data?.students || []))
          };
          localStorage.setItem('mic-safety-snapshot', JSON.stringify(snap));
          setSafetySnapshot(snap);
        } catch (e) { }
      };

      const handleRestoreSnapshot = () => {
        if (!safetySnapshot || !safetySnapshot.students) {
          alert('No previous safety snapshot available to restore.');
          return;
        }
        if (window.confirm(`Safe Revert: Restore student directory to the snapshot taken at ${safetySnapshot.time} (${safetySnapshot.count} students)?`)) {
          persist(prev => ({
            ...prev,
            students: safetySnapshot.students
          }));
          showToast(`Directory successfully restored to snapshot from ${safetySnapshot.time}!`, 'success', 'Safe Revert');
        }
      };

      const handleExportStudentsCsv = () => {
        const listToExport = filtered.length > 0 ? filtered : (data?.students || []);
        if (listToExport.length === 0) {
          alert('No student records to export.');
          return;
        }
        const csvRows = [
          ['Roll Number', 'Student Name', 'Department', 'Section', 'Semester', 'Status']
        ];
        listToExport.forEach(s => {
          csvRows.push([s.roll || '', s.name || '', s.dept || '', s.section || '', s.semester || '', s.status || 'Active']);
        });
        downloadText(`mic-students-directory-${filterDept || 'all'}.csv`, Papa.unparse(csvRows));
        showToast(`Exported ${listToExport.length} student records to CSV!`, 'success', 'Export Complete');
      };

      const parsedPasteList = useMemo(() => {
        if (!pasteText.trim()) return [];
        const lines = pasteText.split(/\r?\n/);
        const list = [];
        const seenRolls = new Set();
        const existingMap = new Map();
        (data?.students || []).forEach(s => {
          if (s && s.roll) existingMap.set(String(s.roll).trim().toUpperCase(), s);
        });

        for (let i = 0; i < lines.length; i++) {
          const item = parsePastedStudentRow(lines[i], pasteDefaultDept, pasteDefaultSec, pasteDefaultSem);
          if (!item) continue;

          const isDuplicateInBatch = seenRolls.has(item.roll);
          seenRolls.add(item.roll);
          const isExisting = existingMap.has(item.roll);

          list.push({
            ...item,
            lineNum: i + 1,
            isDuplicateInBatch,
            isExisting
          });
        }
        return list;
      }, [pasteText, pasteDefaultDept, pasteDefaultSec, pasteDefaultSem, data?.students]);

      const handleImportPastedStudents = () => {
        if (parsedPasteList.length === 0) return;

        // Auto snapshot for safe rollback
        createSafetySnapshot('Pre-Paste Import');

        persist(prev => {
          const studentMap = new Map();
          (prev.students || []).forEach(s => studentMap.set(String(s.roll || '').toUpperCase(), s));

          let addedCount = 0;
          let updatedCount = 0;

          parsedPasteList.forEach(item => {
            const existing = studentMap.get(item.roll);
            if (existing) {
              if (pasteUpdateExisting) {
                studentMap.set(item.roll, {
                  ...existing,
                  name: item.name || existing.name,
                  dept: item.dept || existing.dept,
                  section: item.section || existing.section,
                  semester: item.semester || existing.semester
                });
                updatedCount++;
              }
            } else {
              studentMap.set(item.roll, {
                id: uid(),
                name: item.name,
                roll: item.roll,
                dept: item.dept,
                section: item.section,
                semester: item.semester
              });
              addedCount++;
            }
          });

          return {
            ...prev,
            students: Array.from(studentMap.values())
          };
        });

        setImportResult({
          success: parsedPasteList.length,
          failed: 0
        });
        showToast(`Imported ${parsedPasteList.length} students into directory with safety snapshot!`, 'success', 'Roster Imported');
        setBulkPasteModal(false);
        setPasteText('');
      };

      const handleQuickAdd = () => {
        const name = String(quickAdd.name || '').trim();
        const roll = String(quickAdd.roll || '').trim().toUpperCase();
        if (!name || !roll) {
          alert('Please enter both Student Name and Roll Number.');
          return;
        }
        const s = {
          id: uid(),
          name,
          roll,
          dept: quickAdd.dept || 'CSE',
          section: String(quickAdd.section || 'A').trim().toUpperCase() || 'A',
          semester: Number(quickAdd.semester) || 1
        };
        persist(prev => ({
          ...prev,
          students: [s, ...(prev.students || [])]
        }));
        setQuickAdd({ name: '', roll: '', dept: quickAdd.dept, section: 'A', semester: quickAdd.semester });
      };

      const importRef = useRef(null);
      const [importRows, setImportRows] = useState([]);
      const [importFileName, setImportFileName] = useState('');
      const [importResult, setImportResult] = useState(null);
      const [importModalOpen, setImportModalOpen] = useState(false);
      const [importPreviewStudents, setImportPreviewStudents] = useState([]);
      const [importDefaultDept, setImportDefaultDept] = useState(userDept || 'CSE');
      const [importDefaultSec, setImportDefaultSec] = useState('A');
      const [importDefaultSem, setImportDefaultSem] = useState(1);
      const [importUpdateExisting, setImportUpdateExisting] = useState(true);

      const filtered = useMemo(() => {
        const studentList = Array.isArray(data?.students) ? data.students : [];
        return studentList.filter(s => {
          if (!s || typeof s !== 'object') return false;
          const sName = String(s.name || '').toLowerCase();
          const sRoll = String(s.roll || '').toLowerCase();
          const searchQ = String(q || '').trim().toLowerCase();
          if (filterDept && s.dept !== filterDept) return false;
          if (searchQ && !(sName.includes(searchQ) || sRoll.includes(searchQ))) return false;
          return true;
        });
      }, [data?.students, filterDept, q]);

      const selectedIdSet = useMemo(() => new Set(selectedIds), [selectedIds]);

      const isAllSelected = useMemo(() => {
        if (filtered.length === 0) return false;
        return filtered.every(s => selectedIdSet.has(s.id));
      }, [filtered, selectedIdSet]);

      // High-Scale Pagination State (50,000+ Students Support)
      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize, setPageSize] = useState(50);

      useEffect(() => {
        setCurrentPage(1);
      }, [filterDept, q]);

      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      const paginatedStudents = useMemo(() => {
        if (pageSize === 0) return filtered;
        const start = (currentPage - 1) * pageSize;
        return filtered.slice(start, start + pageSize);
      }, [filtered, currentPage, pageSize]);

      const toggleSelectAll = () => {
        if (isAllSelected) {
          const filteredIds = new Set(filtered.map(s => s.id));
          setSelectedIds(prev => prev.filter(id => !filteredIds.has(id)));
        } else {
          const set = new Set([...selectedIds, ...filtered.map(s => s.id)]);
          setSelectedIds(Array.from(set));
        }
      };

      const toggleSelectOne = id => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const handleSave = () => {
        if (!modal) return;
        const nameVal = String(modal.name || '').trim();
        const rollVal = String(modal.roll || '').trim().toUpperCase();
        const sectionVal = String(modal.section || '').trim().toUpperCase() || 'A';
        const deptVal = modal.dept || 'CSE';
        const semVal = Number(modal.semester) || 1;

        const errs = {};
        if (!nameVal) errs.name = 'Name is required';
        if (!rollVal) errs.roll = 'Roll number is required';

        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        const s = {
          ...modal,
          id: modal.id || uid(),
          name: nameVal,
          roll: rollVal,
          section: sectionVal,
          dept: deptVal,
          semester: semVal,
        };

        persist(prev => {
          const studentsList = prev.students || [];
          const normRoll = String(s.roll).trim().toUpperCase();
          const exists = studentsList.some(x => (x.id && x.id === s.id) || String(x.roll || '').trim().toUpperCase() === normRoll);
          return {
            ...prev,
            students: exists
              ? studentsList.map(x => ((x.id && x.id === s.id) || String(x.roll || '').trim().toUpperCase() === normRoll) ? { ...x, ...s } : x)
              : [s, ...studentsList]
          };
        });
        // Immediately sync added/edited student to Supabase
        supabaseSaveStudent(s);
        showToast('Student record saved successfully!', 'success', 'Saved');
        setModal(null);
        setErrors({});
      };

      const handleDelete = id => {
        const studentObj = (data.students || []).find(s => s.id === id);
        const rollToDelete = studentObj ? studentObj.roll : id;

        persist(prev => ({
          ...prev,
          students: prev.students.filter(s => s.id !== id && s.roll !== rollToDelete),
          records: prev.records.filter(r => r.studentId !== id && r.studentId !== rollToDelete)
        }));
        setSelectedIds(prev => prev.filter(x => x !== id));
        setConfirmDelete(null);

        // Permanently delete from Supabase cloud database
        supabaseDeleteStudent(rollToDelete);
        showToast(`Student ${rollToDelete} permanently deleted from Supabase cloud.`, 'info', 'Cloud Sync');
      };

      const handleBulkDelete = () => {
        const deleteSet = new Set(selectedIds);
        const toDeleteList = (data.students || []).filter(s => deleteSet.has(s.id));
        const rollsToDelete = toDeleteList.map(s => s.roll);

        persist(prev => ({
          ...prev,
          students: prev.students.filter(s => !deleteSet.has(s.id)),
          records: prev.records.filter(r => !deleteSet.has(r.studentId) && !rollsToDelete.includes(r.studentId))
        }));
        setSelectedIds([]);
        setConfirmBulkDelete(false);

        // Permanently delete from Supabase cloud database
        supabaseBulkDeleteStudents(rollsToDelete);
        showToast(`${rollsToDelete.length} students permanently deleted from Supabase cloud.`, 'info', 'Cloud Sync');
      };

      const handleDeleteAllFiltered = () => {
        const deleteSet = new Set(filtered.map(s => s.id));
        const rollsToDelete = filtered.map(s => s.roll);

        persist(prev => ({
          ...prev,
          students: prev.students.filter(s => !deleteSet.has(s.id)),
          records: prev.records.filter(r => !deleteSet.has(r.studentId) && !rollsToDelete.includes(r.studentId))
        }));
        setSelectedIds(prev => prev.filter(id => !deleteSet.has(id)));
        setConfirmDeleteAllFiltered(false);

        // Permanently delete from Supabase cloud database
        supabaseBulkDeleteStudents(rollsToDelete);
        showToast(`${rollsToDelete.length} filtered students permanently deleted from Supabase cloud.`, 'info', 'Cloud Sync');
      };

      const parseStudentsFromRoster = (rawItems, baseDept, baseSem, baseSec) => {
        if (!Array.isArray(rawItems) || rawItems.length === 0) return [];
        const extracted = [];
        const seen = new Set();
        for (const item of rawItems) {
          const st = extractStudentFromAnyRow(item, baseDept || 'CSE', baseSem || 1, baseSec || 'A');
          if (st && st.roll && !seen.has(st.roll)) {
            seen.add(st.roll);
            extracted.push(st);
          }
        }
        return extracted;
      };

      const handleImportFile = async file => {
        if (!file) return;
        setImportFileName(file.name);
        const curDept = filterDept || userDept || 'CSE';
        setImportDefaultDept(curDept);
        const ext = (file.name || '').split('.').pop().toLowerCase();

        try {
          if (ext === 'csv' || ext === 'tsv' || ext === 'txt') {
            Papa.parse(file, {
              header: true,
              skipEmptyLines: 'greedy',
              complete: results => {
                let found = parseStudentsFromRoster(results.data || [], curDept, importDefaultSem, importDefaultSec);
                if (found.length === 0) {
                  Papa.parse(file, {
                    header: false,
                    skipEmptyLines: 'greedy',
                    complete: res2 => {
                      found = parseStudentsFromRoster(res2.data || [], curDept, importDefaultSem, importDefaultSec);
                      if (found.length > 0) {
                        setImportPreviewStudents(found);
                        setImportModalOpen(true);
                      } else {
                        alert(`No valid student roll numbers found in "${file.name}". Please ensure the file contains valid student Roll Numbers and Names.`);
                      }
                    }
                  });
                } else {
                  setImportPreviewStudents(found);
                  setImportModalOpen(true);
                }
              },
              error: err => alert('Error parsing CSV file: ' + (err.message || err))
            });
          } else if (ext === 'xlsx' || ext === 'xls') {
            const reader = new FileReader();
            reader.onload = e => {
              try {
                const dataBuffer = e.target.result;
                const wb = XLSX.read(dataBuffer, { type: 'array' });
                if (!wb || !wb.SheetNames || wb.SheetNames.length === 0) {
                  alert('Excel file contains no readable sheets.');
                  return;
                }
                let allFound = [];
                for (const sName of wb.SheetNames) {
                  const sheet = wb.Sheets[sName];
                  const objRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                  let found = parseStudentsFromRoster(objRows, curDept, importDefaultSem, importDefaultSec);
                  if (found.length === 0) {
                    const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    found = parseStudentsFromRoster(rawRows, curDept, importDefaultSem, importDefaultSec);
                  }
                  if (found.length > 0) {
                    allFound = found;
                    break;
                  }
                }
                if (allFound.length > 0) {
                  setImportPreviewStudents(allFound);
                  setImportModalOpen(true);
                } else {
                  alert(`No valid student roll numbers found in "${file.name}". Please ensure the Excel sheet contains valid student Roll Numbers and Names.`);
                }
              } catch (xlsxErr) {
                alert('Failed to read Excel file: ' + (xlsxErr.message || xlsxErr));
              }
            };
            reader.readAsArrayBuffer(file);
          } else {
            // PDF or Word fallback
            parseDataFile(
              file,
              (pct, msg) => { },
              parsed => {
                const found = parseStudentsFromRoster(parsed || [], curDept, importDefaultSem, importDefaultSec);
                if (found.length > 0) {
                  setImportPreviewStudents(found);
                  setImportModalOpen(true);
                } else {
                  alert(`No student records detected in "${file.name}".`);
                }
              },
              err => alert(err || 'Failed to parse file.')
            );
          }
        } catch (ex) {
          alert('Upload failed: ' + (ex.message || ex));
        }
      };

      const handleConfirmStudentImport = () => {
        if (!importPreviewStudents || importPreviewStudents.length === 0) return;

        // Auto snapshot for safe rollback
        createSafetySnapshot('Pre-File Import: ' + (importFileName || 'Roster'));

        const finalStudents = importPreviewStudents.map(s => ({
          ...s,
          dept: s.dept || importDefaultDept,
          section: s.section || importDefaultSec,
          semester: s.semester || importDefaultSem
        }));

        persist(prev => {
          const studentMap = new Map();
          (prev.students || []).forEach(s => {
            if (s && s.roll) studentMap.set(String(s.roll).trim().toUpperCase(), s);
          });

          finalStudents.forEach(s => {
            const key = String(s.roll).trim().toUpperCase();
            const existing = studentMap.get(key);
            if (existing) {
              if (importUpdateExisting) {
                studentMap.set(key, { ...existing, ...s });
              }
            } else {
              studentMap.set(key, s);
            }
          });

          return { ...prev, students: Array.from(studentMap.values()) };
        });

        // Sync directly to Supabase cloud database
        supabaseBulkSaveStudents(finalStudents);

        setImportResult({ success: finalStudents.length, failed: 0 });
        showToast(`Successfully imported ${finalStudents.length} student records into directory!`, 'success', 'Roster Imported');
        setImportModalOpen(false);
        setImportPreviewStudents([]);
        setImportFileName('');
        if (importRef.current) importRef.current.value = '';
      };

      const downloadStudentTemplate = () => {
        downloadText('mic-students-upload-template.csv', Papa.unparse([
          ['Student Name', 'Roll Number', 'Department', 'Section', 'Semester']
        ]));
        showToast('Downloaded official H7 roster template (CSV)!', 'info', 'Template Downloaded');
      };

      return (
        <div className="animate-entry">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 14 }}>
            <div>
              <h1 style={{ fontFamily: 'var(--font-crest)', fontSize: 24, fontWeight: 800, color: 'var(--primary-900)', margin: '0 0 4px' }}>
                Student Directory ({data.students.length})
              </h1>
              <p style={{ color: 'var(--text-muted)', fontSize: 13.5, margin: 0 }}>
                Manage student records, batch import rosters, export directories, or safely rollback changes.
              </p>
            </div>
            <div style={{ display: 'flex', gap: 9, flexWrap: 'wrap', alignItems: 'center' }}>
              {selectedIds.length > 0 && (
                <button onClick={() => setConfirmBulkDelete(true)} style={{ ...btnPrimary, background: '#EF4444', display: 'flex', alignItems: 'center', gap: 6 }}>
                  <Trash2 size={14} /> Bulk Delete Selected ({selectedIds.length})
                </button>
              )}
              {filtered.length > 0 && (
                <button onClick={() => setConfirmDeleteAllFiltered(true)} style={{ ...btnSecondary, color: '#EF4444', borderColor: '#FCA5A5', display: 'flex', alignItems: 'center', gap: 6 }}>
                  <Trash2 size={14} /> Delete All {filtered.length} Displayed
                </button>
              )}
              {safetySnapshot && (
                <button
                  onClick={handleRestoreSnapshot}
                  style={{
                    ...btnSecondary,
                    color: '#B45309',
                    borderColor: '#FCD34D',
                    background: '#FFFBEB',
                    display: 'flex',
                    alignItems: 'center',
                    gap: 6
                  }}
                  title={`Restore directory state from safety snapshot at ${safetySnapshot.time} (${safetySnapshot.count} students)`}
                >
                  <RotateCcw size={14} color="#B45309" /> Undo Last Change ({safetySnapshot.time})
                </button>
              )}
              <button onClick={handleExportStudentsCsv} style={{ ...btnSecondary, display: 'flex', alignItems: 'center', gap: 6 }}>
                <FileSpreadsheet size={14} /> Export Directory (CSV)
              </button>
              <button onClick={downloadStudentTemplate} style={{ ...btnSecondary, display: 'flex', alignItems: 'center', gap: 6 }}>
                <Download size={14} /> Download Template
              </button>
              <label style={{ ...btnSecondary, display: 'inline-flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                <Upload size={14} /> Bulk Import (Excel/CSV/PDF)
                <input ref={importRef} type="file" accept=".csv,.xlsx,.xls,.pdf,application/pdf" style={{ display: 'none' }} onChange={e => { if (e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]); e.target.value = ''; }} />
              </label>
              <button
                onClick={() => {
                  setPasteDefaultDept(filterDept || 'CSE');
                  setBulkPasteModal(true);
                }}
                style={{
                  ...btnPrimary,
                  background: 'linear-gradient(135deg, #059669 0%, #10B981 100%)',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 6
                }}
                title="Copy and paste student names and roll numbers in bulk directly from Excel or Sheets"
              >
                <ClipboardList size={15} color="#FEF3C7" /> Copy &amp; Paste Bulk
              </button>
              <button onClick={() => setModal({ name: '', roll: '', dept: 'CSE', section: 'A', semester: 1 })} style={{ ...btnPrimary, display: 'flex', alignItems: 'center', gap: 6 }}>
                <Plus size={15} /> Add Student
              </button>
            </div>
          </div>

          {/* Safe Working Environment Reassurance Banner */}
          <div style={{
            padding: '10px 16px',
            borderRadius: 10,
            background: 'linear-gradient(135deg, #F0FDF4 0%, #ECFDF5 100%)',
            border: '1px solid #A7F3D0',
            color: '#065F46',
            fontSize: 12.5,
            fontWeight: 600,
            marginBottom: 18,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            flexWrap: 'wrap',
            gap: 10
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <ShieldCheck size={17} color="#059669" />
              <span><strong>Safe Work Environment Active:</strong> Automatic JNTUK H7 branch routing, smart deduplication, and pre-import safety rollback snapshots protect institutional data.</span>
            </div>
            <div style={{ fontSize: 11.5, color: '#047857', fontWeight: 700 }}>
              🛡️  Zero Data Loss Protocol Active
            </div>
          </div>

          {/* Selection Banner */}

    // -------------------------------------------------------------
    // OCR Helpers (Tesseract.js)
    // -------------------------------------------------------------
    async function runOCR(imageFile, onProgress) {
      if (!window.Tesseract) throw new Error('Tesseract.js not loaded');
      const result = await window.Tesseract.recognize(imageFile, 'eng', {
        logger: m => { if (onProgress && m.status === 'recognizing text') onProgress(Math.round(m.progress * 100)); }
      });
      return result.data.text;
    }

    // Parse CSV/Excel-like text from OCR output into rows
    function parseOcrText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      return lines.map(line => {
        // Split by tabs, pipes, or multiple spaces
        const cells = line.split(/\t|\|{1}|  +/).map(c => c.trim()).filter(Boolean);
        return cells;
      }).filter(r => r.length >= 2);
    }

          return currentUser.status !== 'disabled' && (!dept || dept === currentUser.department);
        }
        if (currentUser.role === 'faculty') {
          if (currentUser.status === 'disabled') return false;
          if (dept !== currentUser.department) return false;
          const assignment = (currentUser.assignedSubjects || []).find(a => a.subjectId === subjectId);
          return !!(assignment && assignment.canEdit);
        }
        return false;
      }, [currentUser, dept, subjectId]);

      useEffect(() => {
        if (availableSubjects.length > 0 && !availableSubjects.some(s => s.id === subjectId)) {
          setSubjectId(availableSubjects[0].id);
        }
      }, [availableSubjects]);

      useEffect(() => {
        if (!subjectId) { setRowsDraft({}); return; }
        const draft = {};
        // O(n+m) fast lookup: build a Map keyed by "studentId|subjectId" first
        // Fast lookup: build Map keyed by studentId and roll
        const recMap = new Map();
        (data.records || []).forEach(r => {
          recMap.set(`${r.studentId}|${subjectId}`, r);
          const stMatch = (data.students || []).find(s => s.id === r.studentId || s.roll === r.studentId);
          if (stMatch) {
            recMap.set(`${stMatch.id}|${subjectId}`, r);
            recMap.set(`${stMatch.roll}|${subjectId}`, r);
          }
        });
        students.forEach(st => {
          const rec = recMap.get(`${st.id}|${subjectId}`) || recMap.get(`${st.roll}|${subjectId}`);
          draft[st.id] = {
            mid1Exam: rec?.mid1Exam ?? '',
            mid1Assign: rec?.mid1Assign ?? '',
            mid2Exam: rec?.mid2Exam ?? '',
            mid2Assign: rec?.mid2Assign ?? '',
          };
        });
        setRowsDraft(draft);
      }, [subjectId, students, data.records]);

      // Marks table pagination state (handles 10,000+ students without lag)
      const MARKS_PAGE_SIZE = 50;
      const [marksPage, setMarksPage] = useState(1);
      useEffect(() => { setMarksPage(1); }, [dept, semester, subjectId, section]);
      const marksTotalPages = Math.max(1, Math.ceil(sectionStudents.length / MARKS_PAGE_SIZE));
      const visibleStudents = useMemo(() => {
        const start = (marksPage - 1) * MARKS_PAGE_SIZE;
        return sectionStudents.slice(start, start + MARKS_PAGE_SIZE);
      }, [sectionStudents, marksPage]);

      const updateCell = (sid, field, value) => {
        if (!canEdit) return;
        setRowsDraft(prev => ({
          ...prev,
          [sid]: { ...prev[sid], [field]: value }
        }));
      };

      // --- APPLY ALL ASSIGNMENT MARKS HANDLER ---
      const handleApplyAll = () => {
        if (!canEdit) { showToast('You do not have edit permission.', 'error', 'Permission Denied'); return; }
        if (!subjectId) { showToast('Please select a subject first.', 'error', 'No Subject'); return; }
        const assignField = selectedMid === 'mid1' ? 'mid1Assign' : 'mid2Assign';
        const markVal = String(bulkAssignMark[selectedMid] != null ? bulkAssignMark[selectedMid] : '').trim();
        if (markVal === '') { showToast('Please enter an assignment mark (0-5) to apply.', 'error', 'Empty Mark'); return; }
        const num = Number(markVal);
        if (isNaN(num) || num < 0 || num > 5) {
          showToast('Assignment marks must be between 0 and 5.', 'error', 'Invalid Mark');
          return;
        }
        const targetStudents = section === 'all' ? students : students.filter(function (s) { return (s.section || 'A') === section; });
        const midLabel = selectedMid === 'mid1' ? 'Mid-1' : 'Mid-2';
        const secLabel = section === 'all' ? 'all sections' : 'Section ' + section;
        const subjectName = (data.subjects.find(function (s) { return s.id === subjectId; }) || {}).name || subjectId;
        const confirmed = window.confirm('Apply Assignment Mark = ' + num + '/5 for ' + midLabel + ' to ' + targetStudents.length + ' students\nin ' + dept + ' Sem-' + semester + ' (' + secLabel + ')\nSubject: ' + subjectName + '\n\nThis updates the draft. Click Save All to persist.');
        if (!confirmed) return;
        setRowsDraft(function (prev) {
          const next = Object.assign({}, prev);
          targetStudents.forEach(function (st) {
            next[st.id] = Object.assign({}, next[st.id] || {});
            next[st.id][assignField] = String(num);
          });
          return next;
        });
        showToast(midLabel + ' Assignment = ' + num + ' applied to ' + targetStudents.length + ' students. Click Save All to persist.', 'success', 'Apply All Done');
      };

      // --- SEPARATE MID-1 & MID-2 PUBLISH CONTROLS ---
      const pubKey = `${dept}_${semester}_${subjectId}`;
      const currentPub = (data.publishSettings && data.publishSettings[pubKey]) || { mid1: false, mid2: false };
      const isMid1Pub = !!currentPub.mid1;
      const isMid2Pub = !!currentPub.mid2;

      const handleTogglePublish = (midKey) => {
        if (!subjectId) return;
        if (!canEdit && currentUser?.role !== 'super_admin' && currentUser?.role !== 'hod') {
          showToast('Permission Denied: Only HOD, Admin, or authorized Faculty can publish marks.', 'error');
          return;
        }
        const currentVal = !!(currentPub[midKey]);
        const newVal = !currentVal;
        const midLabel = midKey === 'mid1' ? 'Mid-1' : 'Mid-2';
        persist(prev => {
          const nextPub = { ...(prev.publishSettings || {}) };
          nextPub[pubKey] = { ...(nextPub[pubKey] || {}), [midKey]: newVal };
          return { ...prev, publishSettings: nextPub };
        });
        addAuditLog(persist, {
          action: newVal ? 'Marks Published' : 'Marks Unpublished',
          department: dept,
          performedBy: currentUser,
          target: `${subject?.name || subjectId} (${midLabel})`,
          details: `${midLabel} marks ${newVal ? 'published to students' : 'unpublished'} for Sem ${semester}`
        });
        showToast(`${midLabel} marks ${newVal ? 'published to students' : 'unpublished (hidden from students)'}!`, newVal ? 'success' : 'info');
      };

      const handleSaveAll = () => {
        if (!subjectId) return;
        const permCheck = verifyEditPermission(currentUser, 'save_marks', { dept, subjectId }, data);
        if (!permCheck.allowed) {
          showToast(permCheck.reason, 'error', 'Permission Denied');
          return;
        }

        // Production Input Validation
        const valErrors = [];
        students.forEach(st => {
          const d = rowsDraft[st.id];
          if (d) {
            const errs = validateMarksInput(d);
            if (errs.length > 0) valErrors.push(`${st.roll}: ${errs.join('; ')}`);
          }
        });
        if (valErrors.length > 0) {
          showToast(valErrors.slice(0, 2).join(' | ') + (valErrors.length > 2 ? ` (+${valErrors.length - 2} more)` : ''), 'error', 'Invalid Marks');
          return;
        }
        persist(prev => {
          const recordMap = new Map();
          prev.records.forEach(r => recordMap.set(`${r.studentId}|${r.subjectId}`, r));
          students.forEach(st => {
            const draft = rowsDraft[st.id] || {};
            const key = `${st.id}|${subjectId}`;
            const existing = recordMap.get(key) || { studentId: st.id, subjectId };
            const toVal = v => (v === '' || v === undefined) ? undefined : Number(v);
            recordMap.set(key, {
              ...existing,
              studentId: st.id,
              subjectId,
              mid1Exam: toVal(draft.mid1Exam),
              mid1Assign: toVal(draft.mid1Assign),
              mid2Exam: toVal(draft.mid2Exam),
              mid2Assign: toVal(draft.mid2Assign),
            });
          });
          return { ...prev, records: Array.from(recordMap.values()) };
        });
        // Real-time synchronization to Supabase Cloud
        supabaseSaveMarksBatch(
          students.map(st => {
            const d = rowsDraft[st.id] || {};
            const toVal = v => (v === '' || v === undefined) ? undefined : Number(v);
            return {
              studentId: st.roll || st.id,
              subjectId,
              mid1Exam: toVal(d.mid1Exam),
              mid1Assign: toVal(d.mid1Assign),
              mid2Exam: toVal(d.mid2Exam),
              mid2Assign: toVal(d.mid2Assign),
            };
          }),
          students
        );
        addAuditLog(persist, {
          action: 'Marks Updated',
          department: dept,
          performedBy: currentUser,
          target: `${subject?.name || subjectId} (Sem ${semester})`,
          details: `Saved mid marks for ${students.length} students`
        });
        setSavedToast(true);
        showToast(`Mid marks saved for ${students.length} students!`, 'success', 'Marks Saved');
        setTimeout(() => setSavedToast(false), 2400);
      };

      const handlePhotoScan = async (file) => {
        if (!file) return;
        if (!canEdit) {
          alert('Access Denied: You do not have EDIT permission for this subject.');
          return;
        }
        setOcrStatus('scanning');
        setOcrProgress(20);
        setOcrPreview('');
        try {
          // 1. Try Multimodal AI Vision
          const studentRefs = students.map(s => ({ roll: s.roll, name: s.name }));
          const aiMatches = await callAiMarksheetExtraction({
            file,
            students: studentRefs,
            subject: subject?.name,
            dept,
            semester
          });

          if (aiMatches && aiMatches.length > 0) {
            let matched = 0;
            const newDraft = { ...rowsDraft };
            aiMatches.forEach(item => {
              if (!item || !item.roll) return;
              const rollStr = String(item.roll).trim().toLowerCase();
              const st = students.find(s => s.roll.toLowerCase() === rollStr || s.name.toLowerCase().includes(rollStr));
              if (st) {
                newDraft[st.id] = { ...newDraft[st.id] };
                if (item.mid1Exam !== undefined && item.mid1Exam !== null && item.mid1Exam !== '') newDraft[st.id].mid1Exam = String(item.mid1Exam);
                if (item.mid1Assign !== undefined && item.mid1Assign !== null && item.mid1Assign !== '') newDraft[st.id].mid1Assign = String(item.mid1Assign);
                if (item.mid2Exam !== undefined && item.mid2Exam !== null && item.mid2Exam !== '') newDraft[st.id].mid2Exam = String(item.mid2Exam);
                if (item.mid2Assign !== undefined && item.mid2Assign !== null && item.mid2Assign !== '') newDraft[st.id].mid2Assign = String(item.mid2Assign);
                matched++;
              }
            });
            if (matched > 0) {
              setRowsDraft(newDraft);
              setOcrStatus('done');
              setOcrPreview(`AI accurately matched and filled marks for ${matched} students!`);
              setAiSuccessMsg(`✓ AI filled marks for ${matched} students!`);
              setTimeout(() => setAiSuccessMsg(''), 3500);
              return;
            }
          }

          // Fallback to client OCR
          setOcrProgress(50);
          const text = await runOCR(file, p => setOcrProgress(50 + Math.round(p * 0.45)));
          setOcrPreview(text);
          setOcrStatus('done');
          const rows = parseOcrText(text);
          let matched = 0;
          const newDraft = { ...rowsDraft };
          rows.forEach(cells => {
            const rollLike = cells[0];
            const st = students.find(s => s.roll.toLowerCase() === rollLike.toLowerCase() || s.name.toLowerCase().includes(rollLike.toLowerCase()));
            if (st && cells.length >= 2) {
              const nums = cells.slice(1).map(Number).filter(n => !isNaN(n));
              if (nums.length > 0) {
                newDraft[st.id] = { ...newDraft[st.id] };
                if (nums[0] !== undefined) newDraft[st.id].mid1Exam = String(nums[0]);
                if (nums[1] !== undefined) newDraft[st.id].mid1Assign = String(nums[1]);
                if (nums[2] !== undefined) newDraft[st.id].mid2Exam = String(nums[2]);
                if (nums[3] !== undefined) newDraft[st.id].mid2Assign = String(nums[3]);
                matched++;
              }
            }
          });
          if (matched > 0) {
            setRowsDraft(newDraft);
            setAiSuccessMsg(`✓ OCR matched and filled marks for ${matched} students!`);
            setTimeout(() => setAiSuccessMsg(''), 3500);
          }
        } catch (e) {
          setOcrStatus('error');
        }
      };

      const handlePasteMarksFill = async () => {
        if (!pasteMarksText.trim()) return;
        if (!canEdit) {
          alert('Access Denied: You do not have EDIT permission for this subject.');
          return;
        }
        setIsAiLoading(true);
        try {
          const studentRefs = students.map(s => ({ roll: s.roll, name: s.name }));
          let aiMatches = await callAiMarksheetExtraction({
            text: pasteMarksText,
            students: studentRefs,
            subject: subject?.name,
            dept,
            semester
          });

          // Fallback heuristic if offline
          if (!aiMatches || aiMatches.length === 0) {
            const lines = pasteMarksText.split(/\r?\n/);
            aiMatches = [];
            lines.forEach(line => {
              const tokens = line.split(/\s{2,}|\t|,|\|/).map(t => t.trim()).filter(Boolean);
              if (tokens.length >= 2) {
                const rollCand = tokens.find(t => /^[0-9]{2}[A-Za-z0-9]{8,10}$/.test(t)) || tokens[0];
                const nums = tokens.filter(t => t !== rollCand && !isNaN(Number(t))).map(Number);
                aiMatches.push({
                  roll: rollCand,
                  mid1Exam: nums[0],
                  mid1Assign: nums[1],
                  mid2Exam: nums[2],
                  mid2Assign: nums[3]
                });
              }
            });
          }

          let matched = 0;
          const newDraft = { ...rowsDraft };
          aiMatches.forEach(item => {
            if (!item || !item.roll) return;
            const rollStr = String(item.roll).trim().toLowerCase();
            const st = students.find(s => s.roll.toLowerCase() === rollStr || s.name.toLowerCase().includes(rollStr));
            if (st) {
              newDraft[st.id] = { ...newDraft[st.id] };
              if (item.mid1Exam !== undefined && item.mid1Exam !== null && item.mid1Exam !== '') newDraft[st.id].mid1Exam = String(item.mid1Exam);
              if (item.mid1Assign !== undefined && item.mid1Assign !== null && item.mid1Assign !== '') newDraft[st.id].mid1Assign = String(item.mid1Assign);
              if (item.mid2Exam !== undefined && item.mid2Exam !== null && item.mid2Exam !== '') newDraft[st.id].mid2Exam = String(item.mid2Exam);
              if (item.mid2Assign !== undefined && item.mid2Assign !== null && item.mid2Assign !== '') newDraft[st.id].mid2Assign = String(item.mid2Assign);
              matched++;
            }
          });

          if (matched > 0) {
            setRowsDraft(newDraft);
            setAiSuccessMsg(`✓ AI filled marks for ${matched} students!`);
            setTimeout(() => setAiSuccessMsg(''), 3500);
            setActiveMode('manual');
          } else {
            alert('Could not match any students with the pasted marks. Please verify roll numbers match the selected class.');
          }
        } catch (err) {
          alert('Error parsing pasted marks: ' + err.message);
        } finally {
          setIsAiLoading(false);
        }
      };

      const modeBtn = (id, label, icon) => (
        <button
          onClick={() => setActiveMode(id)}
          style={{
            padding: '8px 16px', borderRadius: 8, fontWeight: 700, fontSize: 13,
            border: activeMode === id ? '2px solid var(--accent-gold)' : '1px solid var(--border-card)',
            background: activeMode === id ? 'linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.06))' : '#FFF',
            color: activeMode === id ? 'var(--accent-gold-dark)' : 'var(--text-muted)',
            cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 7, transition: 'all 0.2s',
          }}
        >{icon} {label}</button>
      );

      return (
        <div className="animate-entry">
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20, flexWrap: 'wrap', gap: 14 }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <h1 style={{ fontFamily: 'var(--font-crest)', fontSize: 24, fontWeight: 800, color: 'var(--primary-900)', margin: '0 0 4px' }}>
                  Mid Marks Entry
                </h1>
                <span style={{ background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.3)', color: '#059669', padding: '2px 9px', borderRadius: 12, fontSize: 11, fontWeight: 800, display: 'flex', alignItems: 'center', gap: 4 }}>
                  <Sparkles size={11} color="#059669" /> AI Enabled
                </span>
              </div>
              <p style={{ color: 'var(--text-muted)', fontSize: 14, margin: 0 }}>
                Enter Mid-1 and Mid-2 marks manually, scan printed marksheets with AI Vision, or paste from spreadsheets.
              </p>
            </div>
            <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
              {modeBtn('manual', 'Manual Entry', <Pencil size={14} />)}
              {/* Photo scan removed */}
              {canEdit && modeBtn('paste', 'AI Paste Marks', <FileSpreadsheet size={14} />)}
              <button
                onClick={handleSaveAll}
                disabled={!canEdit}
                style={{
                  ...btnPrimary,
                  background: canEdit ? 'linear-gradient(135deg, #059669, #047857)' : '#94A3B8',
                  cursor: canEdit ? 'pointer' : 'not-allowed',
                  opacity: canEdit ? 1 : 0.7,
                  display: 'flex',
                  alignItems: 'center',
                  gap: 8
                }}
              >
                <Save size={15} /> {canEdit ? 'Save All' : 'Read-Only (Locked)'}
              </button>
            </div>
          </div>

          {/* Filter Bar */}
          <div style={{ display: 'flex', gap: 12, marginBottom: 18, flexWrap: 'wrap', alignItems: 'center', background: '#F8FAFC', borderRadius: 12, padding: '12px 16px', border: '1px solid var(--border-card)' }}>
            {isRestricted ? (
              <div style={{ background: '#EFF6FF', border: '1.5px solid #BFDBFE', borderRadius: 8, padding: '7px 14px', fontWeight: 700, color: '#1E40AF', fontSize: 13, display: 'flex', alignItems: 'center', gap: 6 }}>
                🔒 Department: {userDept}
              </div>
            ) : (
              <select value={dept} onChange={e => setDept(e.target.value)} style={{ ...inputStyle, maxWidth: 160, marginBottom: 0 }}>
                {DEPARTMENTS.map(d => <option key={d.code} value={d.code}>{d.code} - {d.name.split(' ').slice(0, 2).join(' ')}</option>)}
              </select>
            )}
            <select value={semester} onChange={e => setSemester(Number(e.target.value))} style={{ ...inputStyle, maxWidth: 140, marginBottom: 0 }}>
              {SEMESTERS.map(s => <option key={s} value={s}>Semester {s}</option>)}
            </select>
            <select value={subjectId} onChange={e => setSubjectId(e.target.value)} style={{ ...inputStyle, maxWidth: 300, marginBottom: 0 }}>
              {availableSubjects.length === 0 ? <option value=''>- No subjects available -</option> : availableSubjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <select value={section} onChange={e => setSection(e.target.value)} style={{ ...inputStyle, maxWidth: 130, marginBottom: 0 }} title='Filter by Section'>
              {availableSections.map(sec => <option key={sec} value={sec}>{sec === 'all' ? 'All Sections' : 'Section ' + sec}</option>)}
            </select>
            {savedToast && (
              <span style={{ color: 'var(--emerald)', fontWeight: 700, fontSize: 13, display: 'flex', alignItems: 'center', gap: 5, animation: 'fadeInUp 0.3s ease' }}>
                <CheckCircle2 size={15} /> Saved!
              </span>
            )}
            {aiSuccessMsg && (
              <span style={{ color: '#059669', background: '#ECFDF5', padding: '4px 12px', borderRadius: 8, fontWeight: 700, fontSize: 13, display: 'flex', alignItems: 'center', gap: 6 }}>
                <Sparkles size={14} color="#059669" /> {aiSuccessMsg}
              </span>
            )}
          </div>

          {/* Read-Only Warning Banner */}
          {subject && !canEdit && (
            <div style={{ background: '#FEF3C7', border: '1px solid #FCD34D', borderRadius: 10, padding: '12px 18px', color: '#92400E', fontWeight: 600, fontSize: 13.5, marginBottom: 18, display: 'flex', alignItems: 'center', gap: 10, boxShadow: '0 2px 8px rgba(245,158,11,0.08)' }}>
              <span style={{ fontSize: 18 }}>🔒</span>
              <div>
                <strong>Read-Only Mode:</strong> {currentUser?.role === 'faculty' ? `You do not have EDIT permission for '${subject.name}'. You can view marks, but changes cannot be saved. Contact your HOD to grant EDIT permission.` : 'Your account does not have permission to edit marks for this department.'}
              </div>
            </div>
          )}

          {/* Photo scan panel removed */}

          {/* AI Paste Marks Panel */}
          {activeMode === 'paste' && canEdit && (
            <div className="animate-entry" style={{ background: '#FFF', borderRadius: 16, border: '1.5px solid #CBD5E1', padding: 24, marginBottom: 20, boxShadow: '0 4px 18px rgba(0,0,0,0.05)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
                <div style={{ width: 44, height: 44, borderRadius: '50%', background: 'rgba(37,99,235,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <FileSpreadsheet size={22} color="#2563EB" />
                </div>
                <div>
                  <div style={{ fontWeight: 800, fontSize: 15, color: 'var(--primary-900)' }}>AI Paste Marks Entry</div>
                  <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>Paste rows copied from Excel, Google Sheets, WhatsApp, or Word table. Columns can be in any order.</div>
                </div>
              </div>
              <textarea
                rows={6}
                value={pasteMarksText}
                onChange={e => setPasteMarksText(e.target.value)}
                placeholder="Paste marks data here (Roll, Name, Mid-1, Assignment-1, Mid-2, Assignment-2)..."
                style={{ ...inputStyle, fontFamily: 'monospace', fontSize: 12.5, width: '100%', marginBottom: 12, resize: 'vertical' }}
              />
              <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                <button
                  onClick={handlePasteMarksFill}
                  disabled={isAiLoading || !pasteMarksText.trim()}
                  style={{ ...btnPrimary, background: 'linear-gradient(135deg, #2563EB, #1D4ED8)', display: 'flex', alignItems: 'center', gap: 8, opacity: isAiLoading ? 0.7 : 1 }}
                >
                  <Sparkles size={15} /> {isAiLoading ? 'AI Mapping & Parsing...' : 'AI Fill Marks Table'}
                </button>
                <button onClick={() => { setPasteMarksText(''); setActiveMode('manual'); }} style={{ ...btnSecondary, fontSize: 13 }}>
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* Apply All Assignment Marks Panel */}
          {subject && canEdit && (
            <div style={{ background: 'linear-gradient(135deg, #EFF6FF, #F0FDF4)', border: '1.5px solid #BFDBFE', borderRadius: 12, padding: '14px 18px', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap', boxShadow: '0 2px 10px rgba(37,99,235,0.07)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontWeight: 700, fontSize: 13, color: '#1E40AF', minWidth: 140 }}>
                <span style={{ fontSize: 16 }}>📋</span> Assignment Marks
              </div>
              <select
                value={selectedMid}
                onChange={e => setSelectedMid(e.target.value)}
                style={{ padding: '6px 10px', borderRadius: 7, border: '1.5px solid #93C5FD', fontSize: 13, fontWeight: 600, background: '#FFF', color: '#1E40AF', cursor: 'pointer' }}
                title='Select which Mid exam assignment to bulk-fill'
              >
                <option value='mid1'>Mid-1 Assignment (/5)</option>
                <option value='mid2'>Mid-2 Assignment (/5)</option>
              </select>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <label style={{ fontSize: 12.5, color: '#475569', fontWeight: 600 }}>Mark (0-5):</label>
                <input
                  type='number'
                  min='0'
                  max='5'
                  step='1'
                  value={bulkAssignMark[selectedMid] != null ? bulkAssignMark[selectedMid] : ''}
                  onChange={e => setBulkAssignMark(function (prev) { const n = Object.assign({}, prev); n[selectedMid] = e.target.value; return n; })}
                  onBlur={e => {
                    const v = e.target.value;
                    if (v !== '' && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > 5)) {
                      showToast('Assignment mark must be between 0 and 5.', 'error', 'Invalid');
                      setBulkAssignMark(function (prev) { const n = Object.assign({}, prev); n[selectedMid] = ''; return n; });
                    }
                  }}
                  placeholder='0-5'
                  style={{ width: 68, padding: '6px 10px', borderRadius: 7, border: '1.5px solid #93C5FD', fontSize: 13.5, fontWeight: 700, textAlign: 'center', background: '#FFF' }}
                />
              </div>
              <button
                onClick={handleApplyAll}
                style={{ background: 'linear-gradient(135deg, #2563EB, #1D4ED8)', color: '#FFF', border: 'none', borderRadius: 8, padding: '7px 18px', fontWeight: 700, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 7, boxShadow: '0 2px 8px rgba(37,99,235,0.3)' }}
              >
                &#10003; Apply All
              </button>
              <span style={{ fontSize: 12, color: '#64748B', fontStyle: 'italic' }}>
                Applies to {section === 'all' ? students.length : sectionStudents.length} students{section !== 'all' ? (' in Section ' + section) : ''}  |  Edit individually below  |  Click Save All to persist
              </span>
            </div>
          )}

          {/* Separate Mid-1 & Mid-2 Publish / Unpublish Controls */}
          {subject && (
            <div style={{
              background: '#FFFFFF',
              border: '1.5px solid #E2E8F0',
              borderRadius: 12,
              padding: '12px 18px',
              marginBottom: 16,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              flexWrap: 'wrap',
              gap: 12,
              boxShadow: '0 2px 10px rgba(0,0,0,0.03)'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ width: 34, height: 34, borderRadius: 8, background: '#EFF6FF', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <Globe size={18} color="#2563EB" />
                </div>
                <div>
                  <div style={{ fontWeight: 800, fontSize: 13.5, color: 'var(--primary-900)' }}>
                    Student Portal Publish Status
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                    Students see published marks only. Final marks become visible once both Mid-1 and Mid-2 are published.
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
                {/* Mid 1 Control */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F8FAFC', padding: '6px 12px', borderRadius: 8, border: '1px solid #E2E8F0' }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: '#334155' }}>Mid-1:</span>
                  <span style={{
                    fontSize: 11.5,
                    fontWeight: 800,
                    padding: '2px 8px',
                    borderRadius: 6,
                    background: isMid1Pub ? '#DCFCE7' : '#F1F5F9',
                    color: isMid1Pub ? '#15803D' : '#64748B',
                    border: `1px solid ${isMid1Pub ? '#86EFAC' : '#CBD5E1'}`
