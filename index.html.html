<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style id="official-loader-critical-css">
    /* ══════════════════════════════════════════════════════════════════
       PRESTIGIOUS INSTITUTIONAL WHITE ANIMATED LOADER
       ══════════════════════════════════════════════════════════════════ */
    .official-startup-loader {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      z-index: 99999999 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      background: #F4F7FB !important;
      background-image: radial-gradient(circle at 50% 40%, #FFFFFF 0%, #F1F5F9 60%, #E2E8F0 100%) !important;
      margin: 0 !important;
      padding: 24px 16px !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      user-select: none !important;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease !important;
    }

    .official-startup-loader.loader-dismissing {
      opacity: 0 !important;
      transform: scale(1.03) !important;
      filter: blur(8px) !important;
      pointer-events: none !important;
    }

    /* Floating White Institutional Card with Subtle Breath */
    .clean-loader-card {
      width: 100% !important;
      max-width: 490px !important;
      background: #FFFFFF !important;
      border-radius: 24px !important;
      box-shadow: 0 24px 64px -12px rgba(13, 34, 149, 0.16), 0 0 0 1.5px rgba(212, 175, 55, 0.35) !important;
      padding: 38px 32px 30px !important;
      text-align: center !important;
      position: relative !important;
      z-index: 2 !important;
      animation: loaderCardPop 0.65s cubic-bezier(0.16, 1, 0.3, 1) both, cardFloat 4s ease-in-out infinite 0.65s !important;
    }

    /* College Emblem Container with Dual Animated Rings */
    .clean-loader-emblem-wrap {
      position: relative !important;
      width: 112px !important;
      height: 112px !important;
      margin: 0 auto 16px auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 50% !important;
      background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #F8FAFC 70%, #EFF6FF 100%) !important;
      border: 3.5px solid #D4AF37 !important;
      box-shadow: 0 10px 28px rgba(13, 34, 149, 0.15), 0 0 24px rgba(212, 175, 55, 0.3) !important;
      animation: emblemPulse 3.5s ease-in-out infinite !important;
    }

    /* Outer rotating gold dashed orbit */
    .clean-loader-emblem-wrap::before {
      content: '' !important;
      position: absolute !important;
      inset: -12px !important;
      border-radius: 50% !important;
      border: 2px dashed rgba(212, 175, 55, 0.65) !important;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.25) !important;
      animation: spinClockwise 16s linear infinite !important;
    }

    /* Middle counter-rotating sapphire ring */
    .clean-loader-emblem-wrap::after {
      content: '' !important;
      position: absolute !important;
      inset: -6px !important;
      border-radius: 50% !important;
      border: 1.5px dotted rgba(45, 165, 235, 0.7) !important;
      animation: spinCounterClockwise 11s linear infinite !important;
    }

    .clean-loader-logo {
      width: 86px !important;
      height: 86px !important;
      object-fit: contain !important;
      display: block !important;
      margin: 0 auto !important;
      position: relative !important;
      z-index: 2 !important;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.12)) !important;
    }

    /* Autonomous Badge with Gold Sheen */
    .clean-loader-pill {
      display: inline-flex !important;
      align-items: center !important;
      gap: 7px !important;
      background: linear-gradient(135deg, #0d2295 0%, #17329E 100%) !important;
      color: #FFFFFF !important;
      padding: 5px 18px !important;
      border-radius: 99px !important;
      font-size: 11.5px !important;
      font-weight: 800 !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase !important;
      box-shadow: 0 4px 14px rgba(13, 34, 149, 0.28), 0 0 0 1px rgba(212, 175, 55, 0.3) !important;
      margin-bottom: 14px !important;
      animation: pillFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both 0.1s !important;
    }

    /* College Title on White Background */
    .clean-loader-title {
      font-family: var(--font-crest), 'Cinzel', serif !important;
      font-size: clamp(20px, 4.4vw, 25px) !important;
      font-weight: 800 !important;
      color: #0d2295 !important;
      line-height: 1.3 !important;
      margin: 0 0 6px 0 !important;
      padding: 0 !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08) !important;
      animation: pillFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both 0.18s !important;
    }

    .clean-loader-sub {
      color: #64748B !important;
      font-size: 12.5px !important;
      font-weight: 600 !important;
      line-height: 1.45 !important;
      margin: 0 0 14px 0 !important;
      animation: pillFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both 0.25s !important;
    }

    /* Accreditation Badges */
    .clean-loader-badges {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 7px !important;
      flex-wrap: wrap !important;
      margin-bottom: 22px !important;
      animation: pillFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both 0.32s !important;
    }

    .clean-badge {
      font-size: 11px !important;
      font-weight: 700 !important;
      padding: 3px 11px !important;
      border-radius: 99px !important;
      letter-spacing: 0.3px !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04) !important;
      transition: transform 0.2s ease !important;
    }

    .clean-badge:hover {
      transform: translateY(-2px);
    }

    .clean-badge-gold {
      background: #FEF3C7 !important;
      color: #92400E !important;
      border: 1px solid #FDE68A !important;
    }

    .clean-badge-blue {
      background: #EFF6FF !important;
      color: #1E40AF !important;
      border: 1px solid #DBEAFE !important;
    }

    .clean-badge-green {
      background: #ECFDF5 !important;
      color: #065F46 !important;
      border: 1px solid #D1FAE5 !important;
    }

    /* Progress Bar Console */
    .clean-loader-progress-box {
      background: #F8FAFC !important;
      border: 1px solid #E2E8F0 !important;
      border-radius: 14px !important;
      padding: 12px 14px !important;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03) !important;
      animation: pillFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both 0.4s !important;
    }

    .clean-loader-status-row {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      margin-bottom: 8px !important;
      font-size: 12px !important;
    }

    .clean-loader-status-text {
      color: #334155 !important;
      font-weight: 700 !important;
      display: flex !important;
      align-items: center !important;
      gap: 7px !important;
    }

    .pulse-live-dot {
      width: 7px !important;
      height: 7px !important;
      border-radius: 50% !important;
      background: #10B981 !important;
      box-shadow: 0 0 8px #10B981 !important;
      display: inline-block !important;
      animation: beaconPulse 1.6s infinite !important;
    }

    .clean-loader-pct {
      color: #0d2295 !important;
      font-weight: 800 !important;
      font-family: 'JetBrains Mono', Consolas, monospace !important;
      font-size: 13px !important;
    }

    .clean-loader-track {
      width: 100% !important;
      height: 7px !important;
      background: #E2E8F0 !important;
      border-radius: 99px !important;
      overflow: hidden !important;
      position: relative !important;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06) !important;
    }

    .clean-loader-fill {
      width: 0% !important;
      height: 100% !important;
      border-radius: inherit !important;
      background: linear-gradient(90deg, #0d2295 0%, #2da5eb 60%, #D4AF37 100%) !important;
      box-shadow: 0 0 10px rgba(45, 165, 235, 0.6) !important;
      position: relative !important;
      overflow: hidden !important;
      transition: width 0.12s linear !important;
    }

    /* Animated light sheen sweep across progress bar */
    .clean-loader-fill::after {
      content: '' !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      bottom: 0 !important;
      width: 40px !important;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent) !important;
      animation: progressSheen 1.5s infinite !important;
    }

    /* Keyframe Animations */
    @keyframes loaderCardPop {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(16px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes cardFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes spinClockwise {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinCounterClockwise {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes emblemPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.035);
      }
    }

    @keyframes beaconPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    @keyframes progressSheen {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(500%);
      }
    }

    @keyframes pillFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <style>
    :root {
      --primary-950: #050B17;
      --primary-900: #071b8b;
      --primary-800: #0d2295;
      --primary-700: #17329E;
      --accent-gold: #D4AF37;
      --accent-gold-glow: #F59E0B;
      --accent-gold-light: #FEF3C7;
      --accent-gold-dark: #B45309;
      --accent-blue: #2563EB;
      --accent-cyan: #06B6D4;
      --emerald: #10B981;
      --emerald-bg: #ECFDF5;
      --crimson: #EF4444;
      --crimson-bg: #FEF2F2;
      --bg-canvas: #F8FAFC;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-card: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-crest: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body), 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif !important;
      background-color: #F4F7FB;
      color: #0F172A;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }



    /* Enhanced Mobile & Desktop Responsiveness */
    .sticky-col-roll {
      position: sticky;
      left: 0;
      background: #FFFFFF !important;
      z-index: 5;
      box-shadow: 2px 0 6px rgba(0, 0, 0, 0.06);
    }

    .sticky-header-th {
      position: sticky;
      top: 0;
      z-index: 6;
      background: #F8FAFC !important;
    }

    .touch-scroll-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .cloud-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .cloud-status-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .cloud-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    @keyframes pulseLive {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      70% {
        transform: scale(1.1);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .pulse-live {
      animation: pulseLive 2s infinite;
    }

    /* Ambient animated mesh glowing lights */
    .light-1 {
      display: none !important;
    }

    /* Clean Official Search Card */
    .search-card-animated {
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(212, 175, 55, 0.25);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .search-card-animated:focus-within {
      box-shadow: 0 14px 32px -6px rgba(15, 23, 42, 0.1), 0 0 0 2px #D4AF37;
    }

    /* Floating Element Animation */
    @keyframes floatSoft {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .floating-badge {
      display: inline-flex;
    }

    /* Pulse Glow Indicator with Radar Ripple */
    @keyframes pulseDot {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.25);
        opacity: 0.75;
      }
    }

    @keyframes radarRipple {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }

      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .pulse-indicator-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 12px;
      height: 12px;
    }

    .pulse-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      position: relative;
      z-index: 2;
    }

    .pulse-ripple {
      display: none;
    }

    /* Staggered entry animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-entry {
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Interactive button sheen */
    .btn-shine {
      position: relative;
      overflow: hidden;
    }

    .btn-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -80%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: rotate(25deg);
      transition: all 0.6s ease;
    }

    .btn-shine:hover::after {
      left: 160%;
    }

    /* Interactive micro-effects */
    button,
    input,
    select,
    .interactive-panel {
      transition: transform 0.22s ease, box-shadow 0.22s ease !important;
    }

    .interactive-panel:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.10) !important;
    }

    @media print {
      body {
        background: #FFF !important;
      }

      .no-print {
        display: none !important;
      }

      .print-memo {
        box-shadow: none !important;
        border: 1px solid #94A3B8 !important;
      }

    }

    /* Premium Modal & Page Animations */
    @keyframes modalFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes modalScaleIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-modal-backdrop {
      animation: modalFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-modal-card {
      animation: modalScaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes tabFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-entry {
      animation: tabFadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    button,
    input,
    select {
      transition: transform 0.16s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.16s ease, background-color 0.16s ease, border-color 0.16s ease !important;
    }

    button:hover {
      transform: translateY(-1.5px);
    }

    button:active {
      transform: translateY(0.5px);
    }

    tr {
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    /* --- ENHANCED PRODUCTION DESIGN TOKENS --- */
    :root {
      --shadow-card: 0 4px 24px -4px rgba(15, 23, 42, 0.08), 0 1px 4px rgba(15, 23, 42, 0.04);
      --radius-card: 16px;
      --transition-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .skeleton-box {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes pulseSoft {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.6;
        transform: scale(0.97);
      }
    }

    .cloud-pulse {
      animation: pulseSoft 2.2s infinite ease-in-out;
    }

    /* Production Toast Notification System */

      right: 24px;
      z-index: 999999;

      gap: 10px;
      max-width: 440px;

    @keyframes buttonPress {
      0% {
        transform: translateY(-1px) scale(1);
      }

      45% {
        transform: translateY(1px) scale(0.96);
      }

      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes buttonGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.34);
      }

      100% {
        box-shadow: 0 0 0 12px rgba(37, 99, 235, 0);
      }

    button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
    }

    button::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      background: currentColor;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: -1;
    }

    button:active {
      animation: buttonPress 0.28s var(--transition-spring);
    }

    button:active::after {
      animation: buttonGlow 0.42s ease-out;
    }

    button:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.32);
      outline-offset: 3px;
    }

    .btn-shine::after {
      z-index: 1;
      opacity: 0.8;

    .btn-shine>* {
      position: relative;
      z-index: 2;
    }

    .portal-search-form button:active {

    }

    /* ══════ MIC OFFICIAL THEME ,  matching mictech.edu.in ══════ */
    :root {
      --mic-blue: #2da5eb;
      --mic-navy: #0d2295;
      --mic-dark: #172f41;
    }

    /* Marquee scrolling announcement */
    @keyframes marqueeScroll {
      0% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(-120%);
      }
    }

    .mic-marquee-text {
      display: inline-block;
      white-space: nowrap;
      animation: marqueeScroll 30s linear infinite;
    }

    .mic-marquee-text:hover {
      animation-play-state: paused;
      cursor: default;
    }

    /* Header animate in on load */
    @keyframes headerSlideDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .mic-header-anim {
      animation: headerSlideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Logo glowing pulse */
    @keyframes logoPulseGlow {

      0%,
      100% {
        filter: drop-shadow(0 0 0px #2da5eb);
      }

      50% {
        filter: drop-shadow(0 0 14px rgba(45, 165, 235, 0.6));
      }
    }

    .mic-logo-glow {
      animation: logoPulseGlow 3.5s ease-in-out infinite;
    }

    /* Badge float */
    @keyframes badgeFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .mic-badge-float {
      animation: badgeFloat 3s ease-in-out infinite;
    }

    /* Stat card fly-up */
    @keyframes statFlyUp {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.92);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .stat-card {
      animation: statFlyUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .stat-card:nth-child(1) {
      animation-delay: 0.05s;
    }

    .stat-card:nth-child(2) {
      animation-delay: 0.18s;
    }

    .stat-card:nth-child(3) {
      animation-delay: 0.31s;
    }

    .stat-card:nth-child(4) {
      animation-delay: 0.44s;
    }

    @keyframes heroGlow {

      }

        text-shadow: 0 3px 30px rgba(45, 165, 235, 0.3);

      animation: accrShimmer 2.5s infinite;
    }

    /* Dot grid hero background */
    .hero-dot-grid {
      background-image: radial-gradient(circle, rgba(45, 165, 235, 0.2) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* MIC official header */
    .mic-main-header {
      background: #ffffff;
      border-bottom: 3px solid var(--mic-blue);
    }

    .mic-header-logo-wrap {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .mic-header-logo-wrap:hover {
      opacity: 0.88;
    }

    /* ══════ MIND-BLOWING INTRO & MANAGEMENT ANIMATIONS ══════ */
    @keyframes pulseRing {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(45, 165, 235, 0.7);
      }

      70% {
        transform: scale(1);
        box-shadow: 0 0 0 14px rgba(45, 165, 235, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(45, 165, 235, 0);
      }
    }

    .mgmt-pulse-ring {
      animation: pulseRing 3s infinite cubic-bezier(0.45, 0, 0.55, 1);
    }

    @keyframes beamSweep {
      0% {
        transform: translateX(-150%) rotate(25deg);
      }

      100% {
        transform: translateX(250%) rotate(25deg);
      }
    }

    .beam-sweep {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
      animation: beamSweep 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes badgePulse {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(45, 165, 235, 0.3));
      }

      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 12px rgba(45, 165, 235, 0.7));
      }
    }

    .intro-badge-pulse {
      animation: badgePulse 2.5s ease-in-out infinite;
    }

    @keyframes floatGentle {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .float-gentle {
      animation: floatGentle 4s ease-in-out infinite;
    }

    .mgmt-card {
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #E2E8F0;
      box-shadow: 0 8px 30px rgba(13, 34, 149, 0.07);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .mgmt-card:hover {
      transform: translateY(-8px);
      border-color: var(--mic-blue);
      box-shadow: 0 20px 48px rgba(13, 34, 149, 0.16);
    }

    .mgmt-tab-btn {
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .mgmt-tab-btn:hover {
      transform: translateY(-2px);
    }

    @keyframes modalScaleIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(16px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-scale-in {
      animation: modalScaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pill-active-glow {
      box-shadow: 0 4px 18px rgba(45, 165, 235, 0.45);
    }


    /* ══════ MOBILE TABLES OPTIMIZATION (< 480px) ══════ */
    @media (max-width: 480px) {

      /* Horizontal scrolling for wide tables without squeezing or overlapping */
      .mobile-scrollable-table,
      .student-search-table-wrap,
      .marks-table-wrap,
      .attendance-table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        width: 100% !important;
        max-width: 100% !important;
        display: block !important;
      }

      .mobile-table,
      .student-search-table,
      .marks-entry-table,
      .attendance-marking-table {
        min-width: 680px !important;
        border-collapse: collapse !important;
      }

      .mobile-table th,
      .mobile-table td,
      .student-search-table th,
      .student-search-table td,
      .marks-entry-table th,
      .marks-entry-table td,
      .attendance-marking-table th,
      .attendance-marking-table td {
        white-space: nowrap !important;
        padding: 10px 12px !important;
      }

      /* Tap targets: minimum ~40px touch height/spacing so inputs/buttons do not overlap */
      .mobile-table input[type="text"],
      .mobile-table input[type="number"],
      .marks-entry-table input,
      .attendance-marking-table input {
        min-height: 40px !important;
        min-width: 56px !important;
        font-size: 14px !important;
        padding: 8px 10px !important;
        border-radius: 6px !important;
        box-sizing: border-box !important;
      }

      .mobile-table button,
      .marks-table-wrap button,
      .attendance-table-wrap button {
        min-height: 40px !important;
        min-width: 40px !important;
        padding: 8px 12px !important;
        font-size: 13px !important;
        box-sizing: border-box !important;
      }

      .mobile-table input[type="checkbox"],
      .mobile-table input[type="radio"] {
        min-height: 24px !important;
        min-width: 24px !important;
        margin: 8px !important;
      }
    }
  </style>

</head>

  <script>
    (function () {
      var loader = document.getElementById('official-startup-loader');
      var bar = document.getElementById('clean-progress-bar');
      var pct = document.getElementById('clean-pct-text');
      var status = document.getElementById('clean-status-text');
      if (!loader || !bar || !pct || !status) return;

      var messages = [
        { at: 0, text: "Loading Portal..." },
        { at: 45, text: "Preparing Dashboard..." },
        { at: 90, text: "Portal Ready" }
      ];

      var currentPct = 0;
      var isReady = false;
      var dismissed = false;
      var startTime = performance.now();
      var DURATION = 2000; // Exactly 2 seconds

      function updateUI(p) {
        bar.style.width = p + '%';
        pct.textContent = p + '%';
        for (var i = messages.length - 1; i >= 0; i--) {
          if (p >= messages[i].at) {
            status.innerHTML = '<span class="pulse-live-dot"></span> ' + messages[i].text;
            break;
          }
        }
      }
      updateUI(0);

      // Smooth animation exactly across 2 seconds
      var simInterval = setInterval(function () {
        if (dismissed) return;
        var elapsed = performance.now() - startTime;
        var progress = Math.min(100, Math.floor((elapsed / DURATION) * 100));
        if (progress > currentPct) {
          currentPct = progress;
          updateUI(currentPct);
        }
        if (elapsed >= DURATION) {
          finishAndDismiss();
        }
      }, 20);

      function finishAndDismiss() {
        if (dismissed) return;
        dismissed = true;
        clearInterval(simInterval);
        updateUI(100);
        setTimeout(function () {
          loader.classList.add('loader-dismissing');
          setTimeout(function () {
            try {
              if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            } catch (e) {
              loader.style.display = 'none';
            }
          }, 400);
        }, 150);
      }

      // React calls this when the app has mounted
      window.__dismissPortalLoader = function () {
        isReady = true;
        var elapsed = performance.now() - startTime;
        if (elapsed >= DURATION) {
          finishAndDismiss();
        } else {
          setTimeout(finishAndDismiss, DURATION - elapsed);
        }
      };

      // Strict safety fallback: never exceed 2 seconds
      setTimeout(function () { if (!dismissed) finishAndDismiss(); }, DURATION);
    })();
  </script>

    // --- LOCAL BROWSER DATA STORE ---
    // IndexedDB provides substantially more capacity than localStorage while
    // localStorage keeps the first render fast and preserves older saved data.
    const LOCAL_DB_NAME = 'mic-college-portal-local';
    const LOCAL_DB_VERSION = 1;
    const LOCAL_STORE_NAME = 'portal-data';
    let localDbPromise = null;

    // Supabase credentials are preserved across sessions ,  do NOT remove them here.

    function openLocalDataDb() {
      if (!window.indexedDB) return Promise.resolve(null);
      if (!localDbPromise) {
        localDbPromise = new Promise(resolve => {
          const request = indexedDB.open(LOCAL_DB_NAME, LOCAL_DB_VERSION);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains(LOCAL_STORE_NAME)) {
              request.result.createObjectStore(LOCAL_STORE_NAME);
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => resolve(null);
        });
      }
      return localDbPromise;
    }

    function saveDataToBrowserDb(data) {
      openLocalDataDb().then(db => {
        if (!db) return;
        const tx = db.transaction(LOCAL_STORE_NAME, 'readwrite');
        tx.objectStore(LOCAL_STORE_NAME).put(data, 'current');
      }).catch(e => { if (e) console.warn('[Sync Warning]', e.message || e); });
    }

    function loadDataFromBrowserDb() {
      return openLocalDataDb().then(db => new Promise(resolve => {
        if (!db) return resolve(null);
        const request = db.transaction(LOCAL_STORE_NAME, 'readonly').objectStore(LOCAL_STORE_NAME).get('current');
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => resolve(null);
      })).catch(e => { console.warn('[Sync]', e?.message || e); return null; });

    const AUTH_SALT = 'mic_portal_auth_2026_';
    async function hashPassword(plainText) {
      if (!plainText) return '';
      try {
        const msgUint8 = new TextEncoder().encode(AUTH_SALT + String(plainText));
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        let hash = 0;
        const str = AUTH_SALT + plainText;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return 'fallback_' + Math.abs(hash).toString(16);
      }
    }

    async function verifyPassword(enteredPassword, storedPasswordOrHash) {
      if (!enteredPassword || !storedPasswordOrHash) return false;
      const enteredHash = await hashPassword(enteredPassword);
      if (enteredHash === storedPasswordOrHash) return true;
      if (enteredPassword === storedPasswordOrHash) return true;
      return false;
    }

          }
          notifyCloudStatus('offline', error.message);
          return { connected: false, isPaused: false, message: error.message };
        }
        notifyCloudStatus('connected', 'Live & Synchronized');
        return { connected: true, needsSchema: false, message: 'Connected to Supabase PostgreSQL database!' };
      } catch (e) {
        const errStr = String(e);
        const isNetworkOrPaused = errStr.includes('Failed to fetch') || errStr.includes('NetworkError') || errStr.includes('ENOTFOUND');

        notifyCloudStatus('offline', errStr);
        return { connected: false, isPaused: false, message: errStr };
      }
    }

    // Realtime Cloud Listener Setup for cross-device live sync
    function setupCloudRealtimeListener(onDataChanged) {
      const client = getSupabaseClient();
      if (!client) return () => { };
      try {
        if (realtimeChannelInstance) {
          try { client.removeChannel(realtimeChannelInstance); } catch (e) { }
        }
        realtimeChannelInstance = client.channel('mic-portal-sync-channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'marks_records' }, payload => {
            console.log('[Supabase Realtime] marks_records change detected:', payload.eventType);
            notifyCloudStatus('syncing', 'Syncing incoming marks...');
            if (onDataChanged) onDataChanged('marks');
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, payload => {
            console.log('[Supabase Realtime] students change detected:', payload.eventType);
            notifyCloudStatus('syncing', 'Syncing incoming students...');
            if (onDataChanged) onDataChanged('students');
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'subjects' }, payload => {
            console.log('[Supabase Realtime] subjects change detected:', payload.eventType);
            if (onDataChanged) onDataChanged('subjects');
          })
          .subscribe(status => {
            if (status === 'SUBSCRIBED') {
              console.log('[Supabase Realtime] Connected and listening for cross-device changes.');
            }
          });
      } catch (e) {
        console.warn('[Supabase Realtime] Setup error:', e);
      }
      return () => {
        if (realtimeChannelInstance) {
          try { client.removeChannel(realtimeChannelInstance); } catch (e) { }
        }
      };
    }

    // --- PRODUCTION INPUT VALIDATION HELPERS (Part 21) ---
    function validateMarksInput({ mid1Exam, mid1Assign, mid2Exam, mid2Assign }) {
      const errors = [];
      const m1e = toNum(mid1Exam);
      const m1a = toNum(mid1Assign);
      const m2e = toNum(mid2Exam);
      const m2a = toNum(mid2Assign);

      if (!isNaN(m1e) && (m1e < 0 || m1e > 50)) errors.push('Mid-1 Exam marks must be between 0 and 50');
      if (!isNaN(m1a) && (m1a < 0 || m1a > 5)) errors.push('Mid-1 Assignment marks must be between 0 and 5');
      if (!isNaN(m2e) && (m2e < 0 || m2e > 50)) errors.push('Mid-2 Exam marks must be between 0 and 50');
      if (!isNaN(m2a) && (m2a < 0 || m2a > 5)) errors.push('Mid-2 Assignment marks must be between 0 and 5');
      return errors;
    }

    function validateAttendanceInput({ conductedClasses, attendedClasses }) {
      const errors = [];
      const cc = toNum(conductedClasses);
      const ca = toNum(attendedClasses);

      if (!isNaN(cc) && cc < 0) errors.push('Conducted classes cannot be negative');
      if (!isNaN(ca) && ca < 0) errors.push('Attended classes cannot be negative');
      if (!isNaN(cc) && !isNaN(ca) && ca > cc) errors.push('Attended classes cannot exceed conducted classes');
      return errors;
    }

    function toNum(v) { if (v === '' || v === null || v === undefined) return NaN; return Number(v); }

    function verifyEditPermission(currentUser, action, payload = {}, data = {}) {
      if (!currentUser) {
        return { allowed: false, reason: 'Authentication required. Please sign in to perform this action.' };
      }

      // 1. Super Admin: full system-wide permissions
      if (currentUser.role === 'super_admin') {
        return { allowed: true };
      }

      // 2. HOD permissions
      if (currentUser.role === 'hod') {
        if (currentUser.status === 'disabled') {
          return { allowed: false, reason: 'Access Denied: Your HOD account is currently disabled. Contact Principal.' };
        }
        if (payload.dept && payload.dept !== currentUser.department) {
          return { allowed: false, reason: `Access Denied: HOD can only manage their own department (${currentUser.department}).` };
        }
        if (payload.subjectId && data.subjects) {
          const sub = data.subjects.find(s => s.id === payload.subjectId);
          if (sub && sub.dept !== currentUser.department) {
            return { allowed: false, reason: `Access Denied: Subject '${sub.name}' belongs to ${sub.dept}, not ${currentUser.department}.` };
          }
        }
        if (payload.studentId && data.students) {
          const stu = data.students.find(s => s.id === payload.studentId);
          if (stu && stu.dept !== currentUser.department) {
            return { allowed: false, reason: `Access Denied: Student belongs to ${stu.dept}, not ${currentUser.department}.` };
          }
        }
        return { allowed: true };
      }

      // Attendance permission check (for save_attendance / edit_attendance)
      if (action === 'save_attendance' || action === 'edit_attendance') {
        if (currentUser.role === 'super_admin') return { allowed: true };
        if (currentUser.role === 'hod') {
          if (currentUser.status === 'disabled') return { allowed: false, reason: 'HOD account disabled.' };
          if (payload.dept && payload.dept !== currentUser.department) return { allowed: false, reason: 'HOD can only manage their own department.' };
          return { allowed: true };
        }
        if (currentUser.role === 'faculty') {
          if (currentUser.status === 'disabled') return { allowed: false, reason: 'Faculty account disabled.' };
          if (payload.dept && payload.dept !== currentUser.department) return { allowed: false, reason: 'Faculty can only manage their own department.' };
          const inChargeId = data.attendanceInCharges ? data.attendanceInCharges[currentUser.department] : null;
          const isInCharge = Boolean(currentUser.isAttendanceInCharge || currentUser.canEditAttendance || (inChargeId && inChargeId === currentUser.id));
          if (!isInCharge) {
            return { allowed: false, reason: 'Access Denied: Only the designated Attendance In-Charge can edit attendance. Contact your HOD.' };
          }
          return { allowed: true };
        }
      }

      // 3. Faculty permissions
      if (currentUser.role === 'faculty') {
        if (currentUser.status === 'disabled') {
          return { allowed: false, reason: 'Access Denied: Your faculty account has been disabled by your HOD.' };
        }
        if (payload.dept && payload.dept !== currentUser.department) {
          return { allowed: false, reason: `Access Denied: Faculty can only access their assigned department (${currentUser.department}).` };
        }
        if (payload.studentId && data.students) {
          const stu = data.students.find(s => s.id === payload.studentId);
          if (stu && stu.dept !== currentUser.department) {
            return { allowed: false, reason: `Access Denied: Target student belongs to ${stu.dept}.` };
          }
        }
        if (payload.subjectId) {
          const sub = data.subjects ? data.subjects.find(s => s.id === payload.subjectId) : null;
          if (sub && sub.dept !== currentUser.department) {
            return { allowed: false, reason: `Access Denied: Subject does not belong to your department (${currentUser.department}).` };
          }
          const perm = (currentUser.assignedSubjects || []).find(p => p.subjectId === payload.subjectId);
          if (!perm) {
            return { allowed: false, reason: `Access Denied: You are not assigned to subject '${sub ? sub.name : payload.subjectId}'.` };
          }
          if (!perm.canEdit) {
            return { allowed: false, reason: `Access Denied: You do not have EDIT permission for '${sub ? sub.name : payload.subjectId}'. Contact your HOD.` };
          }
        }
        return { allowed: true };
      }

      return { allowed: false, reason: 'Access Denied: Invalid user role.' };
    }

    function detectSmartColumnMapping(headers, sampleRows = []) {
      const mapping = [];
      const usedFields = new Set();

      headers.forEach((headerRaw, colIdx) => {
        const rawStr = String(headerRaw !== undefined && headerRaw !== null ? headerRaw : '').trim();
        const norm = rawStr.toLowerCase().replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
        const normNoSpace = norm.replace(/\s+/g, '');

        // 1. Check if column is distinctly irrelevant
        const isIrrelevant = IRRELEVANT_PATTERNS.some(pat => norm.includes(pat) || normNoSpace.includes(pat));
        if (isIrrelevant && !norm.includes('roll') && !norm.includes('student') && !norm.includes('mark') && !norm.includes('mid') && !norm.includes('exam')) {
          mapping.push({
            colIdx,
            originalHeader: rawStr || `Col ${colIdx + 1}`,
            fieldId: 'IGNORED',
            targetKey: null,
            fieldName: 'Ignored Column',
            confidence: 95,
            confidenceLevel: 'HIGH',
            isIgnored: true,
            reason: 'Irrelevant/non-portal data'
          });
          return;
        }

        // 2. Score candidate schema fields
        let bestField = null;
        let highestScore = 0;
        let matchReason = '';

        for (const [fieldId, def] of Object.entries(SMART_SCHEMA)) {
          let score = 0;

          // Header exact alias match
          for (const alias of def.aliases) {
            const aNorm = alias.toLowerCase().replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
            const aNormNoSpace = aNorm.replace(/\s+/g, '');

            if (norm === aNorm || normNoSpace === aNormNoSpace) {
              score = Math.max(score, 98);
              matchReason = `Exact header match for "${def.name}"`;
            } else if (norm.startsWith(aNorm) || norm.endsWith(aNorm)) {
              score = Math.max(score, 88);
              matchReason = `Header match for "${def.name}"`;
            } else if (norm.includes(aNorm)) {
              score = Math.max(score, 78);
              matchReason = `Substring match for "${def.name}"`;
            }
          }

          // Sample values scoring boost
          if (sampleRows.length > 0 && def.testVal) {
            let valMatches = 0;
            let valTested = 0;
            for (let r = 0; r < Math.min(sampleRows.length, 20); r++) {
              const row = sampleRows[r];
              const cellVal = Array.isArray(row) ? row[colIdx] : (row && typeof row === 'object' ? row[rawStr] : null);
              if (cellVal !== undefined && cellVal !== null && String(cellVal).trim() !== '') {
                valTested++;
                valMatches += def.testVal(cellVal);
              }
            }
            if (valTested > 0) {
              const valRatio = valMatches / valTested;
              if (valRatio >= 0.7) {
                score += Math.round(valRatio * 20);
                if (!matchReason) matchReason = `Value patterns match "${def.name}"`;
              }
            }
          }

          // If field already used by another column with higher score, penalize
          if (usedFields.has(fieldId)) {
            score -= 25;
          }

          if (score > highestScore) {
            highestScore = score;
            bestField = def;
          }
        }

        // Determine confidence
        const finalScore = Math.min(Math.max(highestScore, 0), 100);
        let confLevel = 'LOW';
        if (finalScore >= 85) confLevel = 'HIGH';
        else if (finalScore >= 50) confLevel = 'MEDIUM';

        if (bestField && finalScore >= 45) {
          usedFields.add(bestField.id);
          mapping.push({
            colIdx,
            originalHeader: rawStr || `Col ${colIdx + 1}`,
            fieldId: bestField.id,
            targetKey: bestField.key,
            fieldName: bestField.name,
            confidence: finalScore,
            confidenceLevel: confLevel,
            isIgnored: false,
            reason: matchReason || `Mapped to ${bestField.name}`
          });
        } else {
          mapping.push({
            colIdx,
            originalHeader: rawStr || `Col ${colIdx + 1}`,
            fieldId: 'IGNORED',
            targetKey: null,
            fieldName: 'Ignored Column',
            confidence: 85,
            confidenceLevel: 'HIGH',
            isIgnored: true,
            reason: 'No matching portal field'
          });
        }
      });

      return mapping;
    }

    function normalizeSmartRecord(source, columnMappings) {
      const rec = {
        'Student Name': '',
        'Roll Number': '',
        'Department': 'CSE',
        'Section': 'A',
        'Semester': 1,
        'Subject': 'Academic Subject',
        'Mid-1 Exam Mark /50': '',
        'Mid-1 Assignment Mark /5': '',
        'Mid-2 Exam Mark /50': '',
        'Mid-2 Assignment Mark /5': '',
        'Classes Conducted': '',
        'Classes Attended': ''
      };

      if (Array.isArray(source)) {
        columnMappings.forEach(m => {
          if (m.isIgnored || !m.targetKey) return;
          const val = source[m.colIdx];
          if (val !== undefined && val !== null) {
            rec[m.targetKey] = val;
          }
        });
      } else if (source && typeof source === 'object') {
        columnMappings.forEach(m => {
          if (m.isIgnored || !m.targetKey) return;
          const val = source[m.originalHeader] !== undefined ? source[m.originalHeader] : source[m.targetKey];
          if (val !== undefined && val !== null) {
            rec[m.targetKey] = val;
          }
        });
      }

      // Format roll
      rec['Roll Number'] = String(rec['Roll Number'] || '').trim().toUpperCase();
      rec['Student Name'] = String(rec['Student Name'] || '').trim();

      // Normalize department
      let d = String(rec['Department'] || '').trim().toUpperCase();
      if (d.includes('COMP') || d.includes('CSE')) d = 'CSE';
      else if (d.includes('AIML') || d.includes('AI&ML') || d.includes('AI/ML')) d = 'AIML';
      else if (d.includes('AIDS') || d.includes('AI&DS') || d.includes('DATA')) d = 'AIDS';
      else if (d.includes('INFO') || d.includes('IT')) d = 'IT';
      else if (d.includes('CIVIL') || d.includes('CIV')) d = 'CIVIL';
      else if (d.includes('MECH')) d = 'MECH';
      else if (d.includes('ECE') || d.includes('COMMUN')) d = 'ECE';
      else if (d.includes('EEE') || d.includes('ELECT')) d = 'EEE';
      else if (!/^(CSE|AIDS|AIML|ECE|EEE|MECH|CIVIL|IT)$/.test(d)) d = 'CSE';
      rec['Department'] = d;

      // Normalize section
      let sec = String(rec['Section'] || '').trim().toUpperCase();
      const secM = sec.match(/[A-D]/);
      rec['Section'] = secM ? secM[0] : 'A';

      // Normalize semester
      let sem = parseInt(String(rec['Semester'] || '').trim(), 10);
      if (isNaN(sem) || sem < 1 || sem > 8) {
        const roman = { 'I': 1, 'II': 2, 'III': 3, 'IV': 4, 'V': 5, 'VI': 6, 'VII': 7, 'VIII': 8 };
        const rStr = String(rec['Semester'] || '').trim().toUpperCase();
        sem = roman[rStr] || 1;
      }
      rec['Semester'] = sem;

      rec['Subject'] = String(rec['Subject'] || '').trim() || 'Academic Subject';

      // Clean numeric marks - DO NOT invent fake numbers!
      const parseNumVal = (v) => {
        if (v === '' || v === null || v === undefined) return '';
        const n = Number(v);
        return isNaN(n) ? '' : n;
      };

      rec['Mid-1 Exam Mark /50'] = parseNumVal(rec['Mid-1 Exam Mark /50']);
      rec['Mid-1 Assignment Mark /5'] = parseNumVal(rec['Mid-1 Assignment Mark /5']);
      rec['Mid-2 Exam Mark /50'] = parseNumVal(rec['Mid-2 Exam Mark /50']);
      rec['Mid-2 Assignment Mark /5'] = parseNumVal(rec['Mid-2 Assignment Mark /5']);
      rec['Classes Conducted'] = parseNumVal(rec['Classes Conducted']);
      rec['Classes Attended'] = parseNumVal(rec['Classes Attended']);

      return rec;
    }

    function validateSmartRow(rec, seenRollsInFile, existingDbRecordKeys) {
      const errors = [];
      const warnings = [];

      // Required fields
      if (!rec['Roll Number']) {
        errors.push('Missing Roll Number (Required)');
      } else {
        // Roll number format
        if (rec['Roll Number'].length < 5 || rec['Roll Number'].length > 15 || !/^[A-Za-z0-9_-]+$/.test(rec['Roll Number'])) {
          errors.push(`Invalid Roll Number format: "${rec['Roll Number']}"`);
        }
      }

      if (!rec['Student Name']) {
        errors.push('Missing Student Name (Required)');
      } else if (rec['Student Name'].length < 2) {
        errors.push(`Student Name too short: "${rec['Student Name']}"`);
      } else if (/\d{2,}/.test(rec['Student Name'])) {
        warnings.push('Student Name contains numbers');
      }

      // Check marks bounds
      const m1e = rec['Mid-1 Exam Mark /50'];
      if (m1e !== '') {
        if (m1e < 0 || m1e > 50) errors.push(`Mid-1 Exam mark (${m1e}) out of valid range (0-50)`);
      }

      const m1a = rec['Mid-1 Assignment Mark /5'];
      if (m1a !== '') {
        if (m1a < 0 || m1a > 5) errors.push(`Mid-1 Assignment mark (${m1a}) out of valid range (0-5)`);
      }

      const m2e = rec['Mid-2 Exam Mark /50'];
      if (m2e !== '') {
        if (m2e < 0 || m2e > 50) errors.push(`Mid-2 Exam mark (${m2e}) out of valid range (0-50)`);
      }

      const m2a = rec['Mid-2 Assignment Mark /5'];
      if (m2a !== '') {
        if (m2a < 0 || m2a > 5) errors.push(`Mid-2 Assignment mark (${m2a}) out of valid range (0-5)`);
      }

      // Attendance check
      const cc = rec['Classes Conducted'];
      const ca = rec['Classes Attended'];
      if (cc !== '' && cc < 0) errors.push(`Classes Conducted (${cc}) cannot be negative`);
      if (ca !== '' && ca < 0) errors.push(`Classes Attended (${ca}) cannot be negative`);
      if (cc !== '' && ca !== '' && ca > cc) {
        errors.push(`Classes Attended (${ca}) cannot exceed Conducted (${cc})`);
      }

      // Duplicate checks
      const recRoll = rec['Roll Number'] ? rec['Roll Number'].toLowerCase() : '';
      const recSub = rec['Subject'] ? rec['Subject'].toLowerCase() : '';
      const fileKey = `${recRoll}|${recSub}`;

      let isDuplicate = false;
      if (recRoll) {
        if (seenRollsInFile && seenRollsInFile.has(fileKey)) {
          warnings.push('Duplicate record in file (will update preceding row)');
          isDuplicate = true;
        } else if (seenRollsInFile) {
          seenRollsInFile.add(fileKey);
        }

        if (existingDbRecordKeys && existingDbRecordKeys.has(fileKey)) {
          warnings.push('Already exists in database (will update)');
          isDuplicate = true;
        }
      }

      return {
        errors,
        warnings,
        status: errors.length > 0 ? 'ERROR' : (warnings.length > 0 ? 'WARNING' : 'VALID'),
        isDuplicate
      };
    }

    // -----------------------------------------------------------------
    // SMART WORK & AUTOMATION INTELLIGENCE FOR JNTUK / H7 ROLL NUMBERS
    // -----------------------------------------------------------------
    function detectDeptFromRoll(roll) {
      if (!roll || typeof roll !== 'string') return null;
      const clean = roll.toUpperCase().replace(/[^A-Z0-9]/g, '');
      const m = clean.match(/^\d{2}[A-Z0-9]{2}[15]A([0-9A-Z]{2})/i);
      if (m) {
        const code = m[1].toUpperCase();
        if (code === '05') return 'CSE';
        if (code === '42' || code === '61') return 'AIML';
        if (code === '44' || code === '54') return 'AIDS';
        if (code === '12') return 'IT';
        if (code === '04') return 'ECE';
        if (code === '02') return 'EEE';
        if (code === '03') return 'MECH';
        if (code === '01') return 'CIVIL';
      }
      return null;
    }

    function detectSemFromRoll(roll) {
      if (!roll || typeof roll !== 'string') return null;
      const clean = roll.toUpperCase().replace(/[^A-Z0-9]/g, '');
      const m = clean.match(/^(\d{2})/);
      if (m) {
        const yy = parseInt(m[1], 10);
        // Academic batch calculation (2025-2026 Academic Year)
        if (yy === 22) return 7;
        if (yy === 23) return 5;
        if (yy === 24) return 3;
        if (yy === 25) return 1;
        if (yy === 26) return 1;
      }
      return null;
    }

    function cleanStudentName(raw) {
      if (!raw || typeof raw !== 'string') return '';
      return raw
        .trim()
        .replace(/^(\d{1,4}[\.\-\)\s]+|s\.?no\.?\s*\d*[\.\-\)\s]+)/i, '')
        .trim();
    }

    // Universal Student Row Extractor supporting all CSV, Excel, and Array formats
    function extractStudentFromAnyRow(r, defaultDept = 'CSE', defaultSem = 1, defaultSec = 'A') {
      if (!r) return null;
      const row = (r && typeof r === 'object' && r.data) ? r.data : r;

      let roll = '';
      for (const k of ['Roll Number', 'roll_number', 'Roll No', 'roll_no', 'Roll', 'roll', 'HTNO', 'htno', 'Regd No', 'regd_no', 'REGD NO', 'HT No', 'ht_no', 'PIN', 'pin', 'id', 'ID', 'Student ID', 'student_id', 'Roll_No', 'Roll_Num', 'Hall Ticket No']) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
          roll = String(row[k]).trim().toUpperCase();
          break;
        }
      }

      let name = '';
      for (const k of ['Student Name', 'student_name', 'Name', 'name', 'Candidate Name', 'candidate_name', 'Full Name', 'full_name', 'Student', 'student', 'Name of Student', 'Name of the Candidate', 'Student_Name']) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
          name = String(row[k]).trim();
          break;
        }
      }

      // If row is a 2D array:
      if (Array.isArray(row)) {
        const rollPattern = /\b([0-9]{2}[A-Za-z0-9]{2}[0-9A-Za-z][A-Za-z0-9]{4,5}|[0-9]{2}[A-Za-z0-9]{8}|2[0-9][A-Za-z0-9]{7,9})\b/i;
        for (let i = 0; i < Math.min(row.length, 6); i++) {
          const cellStr = String(row[i] || '').trim();
          if (!roll && rollPattern.test(cellStr)) {
            roll = cellStr.toUpperCase();
          } else if (!name && /^[A-Za-z. ]{3,50}$/.test(cellStr) && !/^(CSE|AIDS|AIML|ECE|EEE|MECH|CIVIL|IT)$/i.test(cellStr)) {
            name = cellStr;
          }
        }
      }

      // Check object keys dynamically if standard keys were not matched
      if (!roll || !name) {
        if (typeof row === 'object' && !Array.isArray(row)) {
          const keys = Object.keys(row);
          if (!roll) {
            const rollKey = keys.find(k => /^(roll|htno|regd|pin|student_?id)/i.test(k.replace(/[^a-z0-9]/gi, '')));
            if (rollKey && row[rollKey]) roll = String(row[rollKey]).trim().toUpperCase();
          }
          if (!name) {
            const nameKey = keys.find(k => /^(name|student_?name|candidate)/i.test(k.replace(/[^a-z0-9]/gi, '')));
            if (nameKey && row[nameKey]) name = String(row[nameKey]).trim();
          }
          if (!roll) {
            const rollPattern = /\b([0-9]{2}[A-Za-z0-9]{2}[0-9A-Za-z][A-Za-z0-9]{4,5}|[0-9]{2}[A-Za-z0-9]{8}|2[0-9][A-Za-z0-9]{7,9})\b/i;
            for (const k of keys) {
              const val = String(row[k] || '').trim();
              if (rollPattern.test(val)) {
                roll = val.toUpperCase();
                break;
              }
            }
          }
          if (!name) {
            for (const k of keys) {
              const val = String(row[k] || '').trim();
              if (val && val !== roll && /^[A-Za-z. ]{3,50}$/.test(val) && !/^(CSE|AIDS|AIML|ECE|EEE|MECH|CIVIL|IT)$/i.test(val)) {
                name = val;
                break;
              }
            }
          }
        }
      }

      if (!roll) return null;
      if (!name) name = 'Student ' + roll;
      name = cleanStudentName(name);

      let dept = defaultDept || 'CSE';
      for (const k of ['Department', 'department', 'Dept', 'dept', 'Branch', 'branch']) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
          dept = String(row[k]).trim().toUpperCase();
          break;
        }
      }
      if (dept.includes('COMP') || dept.includes('CSE')) dept = 'CSE';
      else if (dept.includes('AIML') || dept.includes('AI&ML')) dept = 'AIML';
      else if (dept.includes('AIDS') || dept.includes('AI&DS')) dept = 'AIDS';
      else if (dept.includes('INFO') || dept.includes('IT')) dept = 'IT';
      else if (dept.includes('CIVIL') || dept.includes('CIV')) dept = 'CIVIL';
      else if (dept.includes('MECH')) dept = 'MECH';
      else if (dept.includes('ECE')) dept = 'ECE';
      else if (dept.includes('EEE')) dept = 'EEE';
      else if (!/^(CSE|AIDS|AIML|ECE|EEE|MECH|CIVIL|IT)$/.test(dept)) {
        // SMART WORK: Auto-detect branch from JNTUK roll number
        const autoDept = detectDeptFromRoll(roll);
        dept = autoDept || defaultDept || 'CSE';
      }

      let section = defaultSec || 'A';
      for (const k of ['Section', 'section', 'Sec', 'sec']) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
          const m = String(row[k]).trim().toUpperCase().match(/[A-D]/);
          if (m) section = m[0];
          break;
        }
      }

      let semester = defaultSem || 1;
      let hasExplicitSem = false;
      for (const k of ['Semester', 'semester', 'Sem', 'sem', 'Year']) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
          const n = parseInt(row[k], 10);
          if (!isNaN(n) && n >= 1 && n <= 8) {
            semester = n;
            hasExplicitSem = true;
          }
          break;
        }
      }
      if (!hasExplicitSem) {
        // SMART WORK: Auto-detect semester from admission year in roll number
        const autoSem = detectSemFromRoll(roll);
        if (autoSem) semester = autoSem;
      }

      return {
        id: roll,
        roll,
        name,
        dept,
        section,
        semester,
        status: 'active'
      };
    }

    // Compatibility shim for legacy normalizeStudentRow calls
    function normalizeStudentRow(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const headers = Object.keys(raw);
      const mapping = detectSmartColumnMapping(headers, [raw]);
      return normalizeSmartRecord(raw, mapping);
    }

    // Smart 2D Grid Extractor with Header Detection, Mapping, and Anomaly Validation
    function extractRecordsFromRawGrid(rawRows, existingDbRecordKeys = new Set()) {
      if (!rawRows || !Array.isArray(rawRows) || rawRows.length === 0) return [];
      const cleanGrid = rawRows.filter(r => Array.isArray(r) && r.some(c => String(c !== undefined && c !== null ? c : '').trim() !== ''));
      if (cleanGrid.length === 0) return [];

      const rollRegex = /\b([0-9]{2}[A-Za-z0-9]{2}[0-9A-Za-z][A-Za-z0-9]{4,5}|[0-9]{2}[A-Za-z0-9]{8}|2[0-9][A-Za-z0-9]{7,9})\b/i;

      // Score first 25 rows to identify the TRUE header row
      let bestHeaderIdx = -1;
      let bestScore = 0;

      for (let i = 0; i < Math.min(cleanGrid.length, 25); i++) {
        const row = cleanGrid[i];
        if (!Array.isArray(row) || row.length < 2) continue;

        let rowScore = 0;
        row.forEach((cell) => {
          const s = String(cell || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
          if (!s) return;
          if (s.includes('roll') || s.includes('htno') || s.includes('regd') || s.includes('regno') || s.includes('pin') || s === 'id' || s === 'ht') rowScore += 10;
          if (s.includes('name') || s.includes('student') || s.includes('candidate')) rowScore += 8;
          if (s.includes('dept') || s.includes('branch')) rowScore += 4;
          if (s.includes('sec') || s === 'section') rowScore += 3;
          if (s.includes('sem') || s.includes('year')) rowScore += 3;
          if (s.includes('sub') || s.includes('course')) rowScore += 4;
          if (s.includes('mid') || s.includes('mark') || s.includes('attend') || s.includes('exam')) rowScore += 3;
        });

        if (rowScore > bestScore) {
          bestScore = rowScore;
          bestHeaderIdx = i;
        }
      }

      let headers = [];
      let dataStartIdx = 0;

      if (bestScore >= 8 && bestHeaderIdx !== -1) {
        headers = cleanGrid[bestHeaderIdx].map(h => String(h || '').trim());
        dataStartIdx = bestHeaderIdx + 1;
      } else {
        // No explicit header row: generate column placeholders and start from row 0
        const maxCols = Math.max(...cleanGrid.map(r => r.length));
        for (let c = 0; c < maxCols; c++) headers.push(`Column ${c + 1}`);
        dataStartIdx = 0;
      }

      const sampleRows = cleanGrid.slice(dataStartIdx, dataStartIdx + 30);
      const columnMappings = detectSmartColumnMapping(headers, sampleRows);

      // Verify Roll & Name mapping from value patterns if still missing
      let hasRoll = columnMappings.some(m => m.fieldId === 'roll');
      let hasName = columnMappings.some(m => m.fieldId === 'name');

      if (!hasRoll) {
        // Scan columns for roll pattern
        for (let c = 0; c < headers.length; c++) {
          let matches = 0;
          for (let r = dataStartIdx; r < Math.min(cleanGrid.length, dataStartIdx + 20); r++) {
            if (cleanGrid[r] && rollRegex.test(String(cleanGrid[r][c] || ''))) matches++;
          }
          if (matches >= 2) {
            const m = columnMappings.find(cm => cm.colIdx === c);
            if (m) {
              m.fieldId = 'roll';
              m.targetKey = 'Roll Number';
              m.fieldName = 'Roll Number';
              m.confidence = 90;
              m.confidenceLevel = 'HIGH';
              m.isIgnored = false;
              m.reason = 'Value pattern matched Roll Number';
              hasRoll = true;
              break;
            }
          }
        }
      }

      if (!hasName) {
        // Scan for name column (alphabetic strings)
        for (let c = 0; c < headers.length; c++) {
          const m = columnMappings.find(cm => cm.colIdx === c);
          if (m && m.fieldId === 'roll') continue;
          let textMatches = 0;
          for (let r = dataStartIdx; r < Math.min(cleanGrid.length, dataStartIdx + 20); r++) {
            const val = String(cleanGrid[r] && cleanGrid[r][c] || '').trim();
            if (/^[A-Za-z. ]{3,40}$/.test(val) && !/^(CSE|AIDS|AIML|ECE|EEE|MECH|CIVIL|IT)$/i.test(val)) textMatches++;
          }
          if (textMatches >= 2) {
            if (m) {
              m.fieldId = 'name';
              m.targetKey = 'Student Name';
              m.fieldName = 'Student Name';
              m.confidence = 85;
              m.confidenceLevel = 'HIGH';
              m.isIgnored = false;
              m.reason = 'Value pattern matched Student Name';
              hasName = true;
              break;
            }
          }
        }
      }

      const seenRollsInFile = new Set();
      const results = [];

      for (let i = dataStartIdx; i < cleanGrid.length; i++) {
        const row = cleanGrid[i];
        if (!Array.isArray(row) || row.length === 0) continue;

        const rec = normalizeSmartRecord(row, columnMappings);
        // Skip empty rows where neither name nor roll exists
        if (!rec['Roll Number'] && !rec['Student Name']) continue;

        const val = validateSmartRow(rec, seenRollsInFile, existingDbRecordKeys);
        rec._errors = val.errors;
        rec._warnings = val.warnings;
        rec._status = val.status;
        rec._isDuplicate = val.isDuplicate;

        results.push(rec);
      }

      // Attach AI detection metadata to results array
      const ignoredCount = columnMappings.filter(m => m.isIgnored).length;
      results.columnMappings = columnMappings;
      results.summary = {
        total: results.length,
        valid: results.filter(r => r._status === 'VALID').length,
        warnings: results.filter(r => r._status === 'WARNING').length,
        errors: results.filter(r => r._status === 'ERROR').length,
        duplicates: results.filter(r => r._isDuplicate).length,
        ignoredColumns: ignoredCount,
        hasRoll,
        hasName
      };

      // Unrelated file detection: if 0 rolls or names found in all rows
      results.isUnrelated = results.length === 0 || (!hasRoll && !hasName);

      return results;
    }

    async function processGridWithAiOrHeuristic(rawGrid, fileMetadata, existingDbRecordKeys = new Set(), onProgress) {
      if (!rawGrid || !Array.isArray(rawGrid) || rawGrid.length === 0) {
        const empty = [];
        empty.isUnrelated = true;
        empty.columnMappings = [];
        empty.summary = { total: 0, valid: 0, warnings: 0, errors: 0, duplicates: 0, ignoredColumns: 0 };
        return empty;
      }

      const cleanGrid = rawGrid.filter(r => Array.isArray(r) && r.some(c => String(c !== undefined && c !== null ? c : '').trim() !== ''));
      if (cleanGrid.length === 0) {
        const empty = [];
        empty.isUnrelated = true;
        empty.columnMappings = [];
        empty.summary = { total: 0, valid: 0, warnings: 0, errors: 0, duplicates: 0, ignoredColumns: 0 };
        return empty;
      }

      if (onProgress) onProgress(65, 'AI analyzing column semantics & reordering...');

              columnMappings.push({
                colIdx: idx,
                originalHeader: m.source_column || targetKey,

                fieldName: targetKey,

                confidenceLevel: m.confidence || 'HIGH',
                isIgnored: false,

          }

          if (Array.isArray(data.ignored_columns)) {
            data.ignored_columns.forEach((colName, idx) => {
              columnMappings.push({

                originalHeader: colName,

                targetKey: null,
                fieldName: 'Ignored Column',
                confidence: 90,
                confidenceLevel: 'HIGH',
                isIgnored: true,
                reason: 'Non-portal academic / personal data'
              });
            });
          }

          // If AI returned structured rows, validate them deterministically
          let rowsToProcess = [];
          if (Array.isArray(data.rows) && data.rows.length > 0) {
            rowsToProcess = data.rows;
          }

          if (rowsToProcess.length > 0) {
            const seenRollsInFile = new Set();
            const validatedRows = [];

            for (const r of rowsToProcess) {
              const rec = {

                'Mid-1 Assignment Mark /5': (r['Mid-1 Assignment Mark /5'] !== null && r['Mid-1 Assignment Mark /5'] !== undefined && r['Mid-1 Assignment Mark /5'] !== '') ? Number(r['Mid-1 Assignment Mark /5']) : '',

                'Classes Attended': (r['Classes Attended'] !== null && r['Classes Attended'] !== undefined && r['Classes Attended'] !== '') ? Number(r['Classes Attended']) : ''

              if (!rec['Roll Number'] && !rec['Student Name']) continue;

            const hasRoll = validatedRows.some(r => r['Roll Number']);
