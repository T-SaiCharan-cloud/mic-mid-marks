    function Overview({ data, setTab, currentUser, persist }) {
      const [curPass, setCurPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [msg, setMsg] = useState('');
      // Principal email registration (super_admin only)
      const [principalEmail, setPrincipalEmail] = useState(() => localStorage.getItem('mic_principal_email_verified') || SUPER_ADMIN_ACCOUNT.email);
      const [emailEdit, setEmailEdit] = useState('');
      const [emailEditMode, setEmailEditMode] = useState(false);
      const [emailOtpSent, setEmailOtpSent] = useState(false);
      const [emailOtpInput, setEmailOtpInput] = useState('');
      const [emailMsg, setEmailMsg] = useState('');


      const deptInfo = useMemo(() => {
        if (!currentUser?.department) return null;
        return DEPARTMENTS.find(d => d.code === currentUser.department);
      }, [currentUser]);

      const deptStudents = useMemo(() => {
        if (currentUser?.role === 'super_admin') return data.students;
        return data.students.filter(s => s.dept === currentUser?.department);
      }, [data.students, currentUser]);

      const deptSubjects = useMemo(() => {
        if (currentUser?.role === 'super_admin') return data.subjects;
        return data.subjects.filter(s => s.dept === currentUser?.department);
      }, [data.subjects, currentUser]);

      const deptFaculties = useMemo(() => {
        return (data.faculties || []).filter(f => f.department === currentUser?.department);
      }, [data.faculties, currentUser]);

      const activeFacultyCount = useMemo(() => {
        return deptFaculties.filter(f => f.status !== 'disabled').length;
      }, [deptFaculties]);

      const disabledFacultyCount = useMemo(() => {
        return deptFaculties.filter(f => f.status === 'disabled').length;
      }, [deptFaculties]);

      const facultyAssigned = useMemo(() => {
        if (currentUser?.role !== 'faculty') return [];
        return (currentUser.assignedSubjects || []).map(p => {
          const sub = data.subjects.find(s => s.id === p.subjectId);
          return { ...p, name: sub?.name || p.subjectId, semester: sub?.semester || '-' };
        });
      }, [currentUser, data.subjects]);

      const handleSendEmailOtp = async () => {
        setEmailMsg(null);
        const trimmed = (emailEdit || '').trim().toLowerCase();
        if (!trimmed || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) {
          setEmailMsg({ text: 'Please enter a valid email address.', type: 'err' });
          return;
        }
        setEmailMsg({ text: 'Sending OTP to ' + trimmed + '...', type: 'info' });
        const res = await sendOtpViaSupabase(trimmed);
        if (res && res.success) {
          setEmailOtpSent(true);
          setEmailMsg({ text: 'OTP sent! Please check your email inbox and enter the 6-digit code.', type: 'ok' });
        } else {
          setEmailMsg({ text: res?.error || 'Failed to send OTP. Check your internet connection.', type: 'err' });
        }
      };

      const handleDirectRegisterEmail = async () => {
        setEmailMsg(null);
        const trimmed = (emailEdit || '').trim().toLowerCase();
        if (!trimmed || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) {
          setEmailMsg({ text: 'Please enter a valid official email address.', type: 'err' });
          return;
        }
        try {
          const client = getSupabaseClient();
          if (client && client.auth) {
            const { error: emailErr } = await client.auth.updateUser({ email: trimmed });
            if (emailErr) console.warn('[Supabase Auth] Principal email update notice:', emailErr.message);
          }
        } catch (e) { }
        localStorage.setItem('mic_principal_email_verified', trimmed);
        SUPER_ADMIN_ACCOUNT.email = trimmed;
        if (currentUser) currentUser.email = trimmed;
        setPrincipalEmail(trimmed);
        setEmailEditMode(false);
        setEmailEdit('');
        setEmailMsg({ text: 'Principal email registered successfully!', type: 'ok' });
        showToast('Principal email registered successfully!', 'success');
      };

      const handleVerifyEmailOtp = async () => {
        setEmailMsg(null);
        const trimmed = (emailEdit || '').trim().toLowerCase();
        const code = (emailOtpInput || '').trim();
        if (!code || code.length !== 6) {
          setEmailMsg({ text: 'Please enter the 6-digit OTP code received in your email.', type: 'err' });
          return;
        }
        try {
          setEmailMsg({ text: 'Verifying OTP...', type: 'info' });
          const client = getSupabaseClient();
          if (!client || !client.auth) throw new Error('Database client not available');
          const { data: authData, error } = await client.auth.verifyOtp({
            email: trimmed,
            token: code,
            type: 'email'
          });
          if (error) throw error;
          await client.auth.signOut().catch(e => { if (e) console.warn('[Auth signOut]', e.message || e); });
          localStorage.setItem('mic_principal_email_verified', trimmed);
          SUPER_ADMIN_ACCOUNT.email = trimmed;
          setPrincipalEmail(trimmed);
          setEmailEditMode(false);
          setEmailOtpSent(false);
          setEmailOtpInput('');
          setEmailEdit('');
          setEmailMsg({ text: 'Email verified and registered successfully!', type: 'ok' });
          showToast('Principal email verified and registered!', 'success');
        } catch (err) {
          setEmailMsg({ text: 'Invalid or expired OTP code: ' + (err?.message || err), type: 'err' });
        }
      };

      const handlePwdChange = async (e) => {
        e.preventDefault();
        setMsg('');
        const strengthErr = validatePasswordStrength(newPass);
        if (strengthErr) {
          setMsg({ text: strengthErr, type: 'err' });
          return;
        }

        // For Principal (super_admin): Update password directly in Supabase Auth
        if (currentUser.role === 'super_admin') {
          const client = getSupabaseClient();
          if (!client || !client.auth) {
            setMsg({ text: 'Database authentication service is offline. Live Supabase connection required.', type: 'err' });
            return;
          }
          if (curPass) {
            const { error: verifyErr } = await client.auth.signInWithPassword({
              email: currentUser.email || SUPER_ADMIN_ACCOUNT.email,
              password: curPass
            });
            if (verifyErr) {
              setMsg({ text: 'Current password is incorrect.', type: 'err' });
              return;
            }
          }
          const { error: updateErr } = await client.auth.updateUser({ password: newPass });
          if (updateErr) {
            setMsg({ text: 'Failed to update password in Supabase Auth: ' + updateErr.message, type: 'err' });
            return;
          }
          localStorage.removeItem('mic_principal_password_hash');
          setMsg({ text: 'Master password updated securely in Supabase Auth!', type: 'ok' });
          showToast('Password updated in Supabase Auth!', 'success');
          setCurPass('');
          setNewPass('');
          return;
        }

        // For HOD and Faculty (portal-managed hashed accounts)
        if (currentUser.password) {
          const isMatch = await verifyPassword(curPass, currentUser.password);
          if (!isMatch) {
            setMsg({ text: 'Current password does not match.', type: 'err' });
            return;
          }
        }
        const hashedPass = await hashPassword(newPass);
        if (currentUser.role === 'hod') {
          persist(prev => {
            const hods = (prev.hods || []).map(h => (h.id === currentUser.id || h.department === currentUser.department) ? { ...h, password: hashedPass } : h);
            return { ...prev, hods };
          });
          currentUser.password = hashedPass;
          saveSession(currentUser);
        } else if (currentUser.role === 'faculty') {
          persist(prev => {
            const faculties = (prev.faculties || []).map(f => f.id === currentUser.id ? { ...f, password: hashedPass } : f);
            return { ...prev, faculties };
          });
          currentUser.password = hashedPass;
          saveSession(currentUser);
        }

        setMsg({ text: 'Password successfully updated!', type: 'ok' });
        showToast('Password updated successfully!', 'success');
        setCurPass('');
        setNewPass('');
      };

      return (
        <div className="animate-entry">
          {/* Header Banner */}
          <div style={{
            background: 'linear-gradient(135deg, #071b8b 0%, #0d2295 100%)', borderTop: '4px solid #cf2c31',

            justifyContent: 'space-between',
            alignItems: 'center',

            gap: 16
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap' }}>
              <div>
                <div style={{
                  display: 'inline-block',
                  background: 'rgba(212, 175, 55, 0.2)',
                  border: '1px solid rgba(212, 175, 55, 0.4)',
                  padding: '4px 12px',

                  fontWeight: 700,
                  color: '#FEF3C7',
                  marginBottom: 8
                }}>
                  {currentUser?.role === 'super_admin' ? 'Principal Portal' : currentUser?.role === 'hod' ? `HOD Portal  |  ${currentUser.department}` : `Faculty Portal  |  ${currentUser.department}`}
                </div>
                <h1 style={{ fontFamily: 'var(--font-crest)', fontSize: 24, fontWeight: 800, margin: '0 0 6px', color: '#FEF3C7' }}>
                  {currentUser?.role === 'super_admin' && 'Principal Overview'}
                  {currentUser?.role === 'hod' && `Department of ${deptInfo?.name || currentUser.department}`}
                  {currentUser?.role === 'faculty' && `Welcome, ${currentUser.name}`}
                </h1>
                <p style={{ color: '#94A3B8', fontSize: 13.5, margin: 0 }}>
                  {currentUser?.role === 'super_admin' && 'Institution-wide academic control, HOD management, and system governance.'}
                  {currentUser?.role === 'hod' && `Academic control, faculty supervision, and subject permission management for ${currentUser.department}.`}
                  {currentUser?.role === 'faculty' && `Assigned faculty ID: ${currentUser.id}  |  Department of ${currentUser.department}.`}
                </p>
              </div>
            </div>

            {/* Quick Action Shortcuts */}
            <div style={{ display: 'flex', gap: 10 }}>
              {currentUser?.role === 'hod' && (
                <>
                  <button
                    onClick={() => setTab('faculties')}
                    style={{

    // -------------------------------------------------------------
    // HOD FACULTY MANAGEMENT COMPONENT (Section 4 & 5 & 6)
    // -------------------------------------------------------------
    function HodFacultyManagementTab({ data, persist, currentUser }) {
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all'); // 'all' | 'active' | 'disabled'
      const [showAddModal, setShowAddModal] = useState(false);
      const [selectedFacultyForAccess, setSelectedFacultyForAccess] = useState(null);
      const [resetPwdFaculty, setResetPwdFaculty] = useState(null);
      const [newPwdVal, setNewPwdVal] = useState('');
      const [toastMsg, setToastMsg] = useState('');

      const deptCode = currentUser?.department || 'CSE';
      const deptSubjects = useMemo(() => {
        return data.subjects.filter(s => s.dept === deptCode);
      }, [data.subjects, deptCode]);

      const deptFaculties = useMemo(() => {
        return (data.faculties || []).filter(f => f.department === deptCode);
      }, [data.faculties, deptCode]);

      const filteredFaculties = useMemo(() => {
        return deptFaculties.filter(f => {
          const matchSearch = f.name.toLowerCase().includes(search.toLowerCase()) ||
            f.id.toLowerCase().includes(search.toLowerCase()) ||
            f.username.toLowerCase().includes(search.toLowerCase());
          const matchStatus = statusFilter === 'all' ? true : (statusFilter === 'active' ? f.status !== 'disabled' : f.status === 'disabled');
          return matchSearch && matchStatus;
        });
      }, [deptFaculties, search, statusFilter]);

      const handleToggleStatus = (faculty) => {
        const nextStatus = faculty.status === 'disabled' ? 'active' : 'disabled';
        const actionLabel = nextStatus === 'active' ? 'Faculty Enabled' : 'Faculty Disabled';
        persist(prev => {
          const faculties = prev.faculties.map(f => f.id === faculty.id ? { ...f, status: nextStatus } : f);
          return { ...prev, faculties };
        });
        addAuditLog(persist, {
          action: actionLabel,
          department: deptCode,
          performedBy: currentUser,
          target: `${faculty.name} (${faculty.id})`,
          details: `Account status updated to ${nextStatus}`
        });
        setToastMsg(`${faculty.name} ${actionLabel.toLowerCase()} successfully.`);
        setTimeout(() => setToastMsg(''), 2400);
      };

      const handleDeleteFaculty = (faculty) => {
        if (!window.confirm(`Are you sure you want to remove ${faculty.name} (${faculty.id}) from the department faculty roster?`)) return;
        persist(prev => {
          const faculties = prev.faculties.filter(f => f.id !== faculty.id);
          return { ...prev, faculties };
        });
        addAuditLog(persist, {
          action: 'Faculty Removed',
          department: deptCode,
          performedBy: currentUser,
          target: `${faculty.name} (${faculty.id})`,
          details: `Faculty deleted from department ${deptCode}`
        });
        // Permanently delete faculty from Supabase
        supabaseDeleteFaculty(faculty.id);
        setToastMsg(`${faculty.name} removed from faculty directory.`);
        setTimeout(() => setToastMsg(''), 2400);
      };

      const handleResetPasswordSubmit = async (e) => {
        e.preventDefault();
        if (!newPwdVal || newPwdVal.length < 4) {
          alert('Password must be at least 4 characters long.');
          return;
        }
        const hashedPassword = await hashPassword(newPwdVal);
        persist(prev => {
          const faculties = prev.faculties.map(f => f.id === resetPwdFaculty.id ? { ...f, password: hashedPassword } : f);
          return { ...prev, faculties };
        });
        addAuditLog(persist, {
          action: 'Faculty Password Reset',
          department: deptCode,
          performedBy: currentUser,
          target: `${resetPwdFaculty.name} (${resetPwdFaculty.id})`,
          details: 'Password was reset by HOD'
        });
        setResetPwdFaculty(null);
        setNewPwdVal('');
        setToastMsg('Password reset successfully.');
        setTimeout(() => setToastMsg(''), 2400);
      };

      return (
        <div className="animate-entry">
          {toastMsg && (
            <div style={{
              position: 'fixed',
              top: 24,
              right: 24,
              background: '#065F46',
              color: '#FFFFFF',
              padding: '12px 20px',
              borderRadius: 10,
              boxShadow: '0 10px 25px rgba(0,0,0,0.2)',
              zIndex: 999999,
              fontWeight: 700,
              fontSize: 13.5
            }}>
              ✓ {toastMsg}
            </div>
          )}

          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 22, flexWrap: 'wrap', gap: 14 }}>
            <div>
              <h2 style={{ fontFamily: 'var(--font-crest)', fontSize: 22, fontWeight: 800, color: 'var(--primary-900)', margin: '0 0 4px' }}>
                Department Faculty Directory
              </h2>
              <p style={{ color: 'var(--text-muted)', fontSize: 13.5, margin: 0 }}>
                Manage faculty accounts, assign department subjects, and configure EDIT permissions for {deptCode}.
              </p>
            </div>
            <button
              onClick={() => setShowAddModal(true)}
              style={{
                ...btnPrimary,
                display: 'flex',
                alignItems: 'center',
                gap: 6,
                padding: '10px 18px',
                fontSize: 13.5
              }}
            >
              <Plus size={16} /> Add New Faculty
            </button>
          </div>

          {/* Search & Filter Bar */}
          <div style={{
            background: '#FFFFFF',
            borderRadius: 14,
            padding: '14px 18px',
            border: '1px solid var(--border-card)',
            boxShadow: '0 2px 10px rgba(0,0,0,0.03)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: 14,
            marginBottom: 20,
            flexWrap: 'wrap'
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flex: 1, minWidth: 260 }}>
              <Search size={16} color="var(--text-muted)" />
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search faculty by name, ID, or username..."
                style={{ border: 'none', outline: 'none', width: '100%', fontSize: 13.5 }}
              />
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              {['all', 'active', 'disabled'].map(st => (
                <button
                  key={st}
                  onClick={() => setStatusFilter(st)}
                  style={{
                    border: '1px solid ' + (statusFilter === st ? 'var(--primary-900)' : '#E2E8F0'),
                    background: statusFilter === st ? 'var(--primary-900)' : '#FFFFFF',
                    color: statusFilter === st ? '#FEF3C7' : '#64748B',
                    padding: '6px 14px',
                    borderRadius: 20,
                    fontSize: 12,
                    fontWeight: 700,
                    cursor: 'pointer',
                    textTransform: 'capitalize'
                  }}
                >
                  {st} ({st === 'all' ? deptFaculties.length : st === 'active' ? deptFaculties.filter(f => f.status !== 'disabled').length : deptFaculties.filter(f => f.status === 'disabled').length})
                </button>
              ))}
            </div>
          </div>

          {/* Faculty Table */}
          <div style={{
            background: '#FFFFFF',
            borderRadius: 16,
            border: '1px solid var(--border-card)',
            boxShadow: '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
            overflow: 'hidden'
          }}>
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13.5 }}>
                <thead>
                  <tr style={{ background: '#F8FAFC', borderBottom: '1.5px solid #E2E8F0', textAlign: 'left' }}>
                    <th style={{ padding: '14px 18px', fontWeight: 700, color: 'var(--primary-900)' }}>Faculty Name &amp; ID</th>
                    <th style={{ padding: '14px 18px', fontWeight: 700, color: 'var(--primary-900)' }}>Login Username</th>
                    <th style={{ padding: '14px 18px', fontWeight: 700, color: 'var(--primary-900)' }}>Department</th>
                    <th style={{ padding: '14px 18px', fontWeight: 700, color: 'var(--primary-900)' }}>Assigned Subjects &amp; Edit Status</th>
                    <th style={{ padding: '14px 18px', fontWeight: 700, color: 'var(--primary-900)' }}>Account Status</th>
                    <th style={{ padding: '14px 18px', fontWeight: 700, color: 'var(--primary-900)', textAlign: 'right' }}>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredFaculties.length === 0 ? (
                    <tr>
                      <td colSpan={6} style={{ textAlign: 'center', padding: '36px', color: 'var(--text-muted)' }}>

                    filteredFaculties.map(f => {

                      return (
                        <tr key={f.id} style={{ borderBottom: '1px solid #F1F5F9', background: f.status === 'disabled' ? '#FFFDFD' : '#FFFFFF' }}>
                          <td style={{ padding: '14px 18px' }}>
                            <div style={{ fontWeight: 700, color: '#0F172A' }}>{f.name}</div>
                            <div style={{ fontSize: 12, color: '#64748B', fontFamily: 'monospace' }}>{f.id}</div>
                            {(f.isAttendanceInCharge || (data.attendanceInCharges && data.attendanceInCharges[deptCode] === f.id)) && (
                              <div style={{ marginTop: 4 }}>
                                <span style={{
                                  display: 'inline-flex',

                                gap: 4,
                                padding: '3px 9px',
                                borderRadius: 12,
                                background: 'var(--emerald-bg)',
                                color: 'var(--emerald)',
                                fontSize: 12,
                                fontWeight: 700
                              }}>
                                <UserCheck size={12} /> Active
                              </span>
                            )}
                          </td>
                          <td style={{ padding: '14px 18px', textAlign: 'right' }}>
                            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                              <button
                                onClick={() => setSelectedFacultyForAccess(f)}
                                title="Manage Faculty Subject Access & Edit Permission"
                                style={{
                                  background: 'linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%)',
                                  color: '#1E40AF',
                                  border: '1px solid #BFDBFE',
                                  padding: '6px 11px',
                                  borderRadius: 6,
                                  fontSize: 12,
                                  fontWeight: 700,
                                  cursor: 'pointer',
                                  display: 'inline-flex',
                                  alignItems: 'center',
                                  gap: 4
                                }}
                              >
                                <Lock size={12} /> Manage Access
                              </button>

                              <button
                                onClick={() => handleToggleStatus(f)}
                                title={f.status === 'disabled' ? 'Enable Faculty Account' : 'Disable Faculty Account'}
                                style={{
                                  background: f.status === 'disabled' ? '#ECFDF5' : '#FEF2F2',
                                  color: f.status === 'disabled' ? '#065F46' : '#EF4444',
                                  border: '1px solid ' + (f.status === 'disabled' ? '#A7F3D0' : '#FECACA'),
                                  padding: '6px 10px',
                                  borderRadius: 6,
                                  fontSize: 12,
                                  fontWeight: 700,
                                  cursor: 'pointer'
                                }}
                              >
                                {f.status === 'disabled' ? 'Enable' : 'Disable'}
                              </button>

                              <button
                                onClick={() => { setResetPwdFaculty(f); setNewPwdVal(''); }}
                                title="Reset Password"
                                style={{
                                  ...iconActionBtn,
                                  color: '#475569'
                                }}
                              >
                                <Key size={14} />
                              </button>

                              <button
                                onClick={() => handleDeleteFaculty(f)}
                                title="Remove Faculty"
                                style={{
                                  ...iconActionBtn,
                                  color: '#EF4444'
                                }}
                              >
                                <Trash2 size={14} />
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Add Faculty Modal */}
          {showAddModal && (
            <AddFacultyModal
              dept={deptCode}
              availableSubjects={deptSubjects}
              existingFaculties={data.faculties || []}
              existingHods={data.hods || []}
              onClose={() => setShowAddModal(false)}
              onSave={(newFaculty) => {
                persist(prev => ({
                  ...prev,
                  faculties: [...(prev.faculties || []), newFaculty]
                }));
                addAuditLog(persist, {
                  action: 'Faculty Added',
                  department: deptCode,
                  performedBy: currentUser,
                  target: `${newFaculty.name} (${newFaculty.id})`,
                  details: `Added new faculty to ${deptCode} with ${newFaculty.assignedSubjects.length} subjects`
                });
                setShowAddModal(false);
                setToastMsg(`Faculty ${newFaculty.name} added successfully!`);
                setTimeout(() => setToastMsg(''), 2400);
              }}
            />
          )}

          {/* Manage Subject-Wise Edit Access Modal (Section 6) */}
          {selectedFacultyForAccess && (
            <ManageFacultyAccessModal
              faculty={selectedFacultyForAccess}
              availableSubjects={deptSubjects}
              onClose={() => setSelectedFacultyForAccess(null)}
              onSave={(updatedAssignedSubjects, updatedCanEditAttendance) => {
                persist(prev => {
                  const faculties = prev.faculties.map(f => {
                    if (f.id === selectedFacultyForAccess.id) {
                      return {
                        ...f,
                        assignedSubjects: updatedAssignedSubjects,
                        canEditAttendance: !!updatedCanEditAttendance,
                        isAttendanceInCharge: !!updatedCanEditAttendance
                      };
                    }
                    if (updatedCanEditAttendance && f.department === deptCode) {
                      return { ...f, canEditAttendance: false, isAttendanceInCharge: false };
                    }
                    return f;
                  });
                  const nextInCharges = { ...(prev.attendanceInCharges || {}) };
                  if (updatedCanEditAttendance) {
                    nextInCharges[deptCode] = selectedFacultyForAccess.id;
                  } else if (nextInCharges[deptCode] === selectedFacultyForAccess.id) {
                    delete nextInCharges[deptCode];
                  }
                  return { ...prev, faculties, attendanceInCharges: nextInCharges };
                });
                const editCount = updatedAssignedSubjects.filter(s => s.canEdit).length;
                addAuditLog(persist, {
                  action: 'Faculty Access Updated',
                  department: deptCode,
                  performedBy: currentUser,
                  target: `${selectedFacultyForAccess.name} (${selectedFacultyForAccess.id})`,
                  details: `Permissions: ${updatedAssignedSubjects.length} subjects, ${editCount} with EDIT; Attendance Edit: ${updatedCanEditAttendance ? 'YES' : 'NO'}.`
                });
                setSelectedFacultyForAccess(null);
                setToastMsg(`Access permissions updated for ${selectedFacultyForAccess.name}!`);
                setTimeout(() => setToastMsg(''), 2400);
              }}
            />
          )}

          {/* Reset Password Modal */}
          {resetPwdFaculty && (
            <Modal title={`Reset Password - ${resetPwdFaculty.name}`} onClose={() => setResetPwdFaculty(null)} maxWidth={420}>
              <form onSubmit={handleResetPasswordSubmit}>
                <div style={{ marginBottom: 14 }}>
                  <label style={labelStyle}>Faculty ID</label>
                  <input value={resetPwdFaculty.id} disabled style={{ ...inputStyle, background: '#F1F5F9' }} />
                </div>
                <div style={{ marginBottom: 14 }}>
                  <label style={labelStyle}>Username</label>
                  <input value={resetPwdFaculty.username} disabled style={{ ...inputStyle, background: '#F1F5F9' }} />
                </div>
                <div style={{ marginBottom: 18 }}>
                  <label style={labelStyle}>New Password</label>
                  <input
                    type="password"
                    value={newPwdVal}
                    onChange={e => setNewPwdVal(e.target.value)}
                    placeholder="Enter new password"
                    style={inputStyle}
                    autoFocus
                  />
                </div>
                <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                  <button type="button" onClick={() => setResetPwdFaculty(null)} style={btnSecondary}>Cancel</button>
                  <button type="submit" style={btnPrimary}>Set New Password</button>
                </div>
              </form>
            </Modal>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // ADD FACULTY MODAL (Section 4 - Email OTP Passwordless)
    // -------------------------------------------------------------
    function AddFacultyModal({ dept, availableSubjects, existingFaculties, existingHods, onClose, onSave }) {
      const [name, setName] = useState('');
      const [facultyId, setFacultyId] = useState('');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [email, setEmail] = useState('');
      const [assignments, setAssignments] = useState({}); // { [subjectId]: { assigned: boolean, canEdit: boolean } }
      const [err, setErr] = useState('');

      // Initialize assignments
      useEffect(() => {
        const init = {};
        availableSubjects.forEach(s => {
          init[s.id] = { assigned: false, canEdit: true };
        });
        setAssignments(init);
      }, [availableSubjects]);

      const toggleAssigned = (subId) => {
        setAssignments(prev => ({
          ...prev,
          [subId]: {
            ...prev[subId],
            assigned: !prev[subId]?.assigned
          }
        }));
      };

      const toggleCanEdit = (subId) => {
        setAssignments(prev => ({
          ...prev,
          [subId]: {
            ...prev[subId],
            canEdit: !prev[subId]?.canEdit
          }
        }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErr('');

        if (!name.trim()) { setErr('Faculty Name is required.'); return; }
        if (!facultyId.trim()) { setErr('Faculty ID is required.'); return; }
        if (!username.trim()) { setErr('Login Username is required.'); return; }
        if (!password.trim()) { setErr('Password is required.'); return; }
        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail || !cleanEmail.includes('@') || !cleanEmail.includes('.')) {
          setErr('A valid Faculty Email is required for OTP login.');
          return;
        }

        const cleanId = facultyId.trim();
        const cleanUser = username.trim().toLowerCase();

        // Prevent duplicate Faculty IDs
        const idExists = existingFaculties.some(f => f.id.toLowerCase() === cleanId.toLowerCase());
        if (idExists) {
          setErr(`Duplicate Faculty ID: An account with ID '${cleanId}' already exists.`);
          return;
        }

        // Prevent duplicate usernames across faculties and HODs
        const userExistsInFaculty = existingFaculties.some(f => f.username.toLowerCase() === cleanUser);
        const userExistsInHod = existingHods.some(h => h.username.toLowerCase() === cleanUser);
        if (userExistsInFaculty || userExistsInHod || cleanUser === 'sai' || cleanUser === 'admin') {
          setErr(`Duplicate Username: Username '${cleanUser}' is already in use. Please choose another.`);
          return;
        }

        // Prevent duplicate email across faculties and HODs
        const emailExists = existingFaculties.some(f => (f.email || '').toLowerCase() === cleanEmail) ||
          existingHods.some(h => (h.email || '').toLowerCase() === cleanEmail);
        if (emailExists) {
          setErr(`Duplicate Email: Email '${cleanEmail}' is already registered.`);
          return;
        }

        const assignedSubjects = [];
        Object.entries(assignments).forEach(([subId, conf]) => {
          if (conf.assigned) {
            assignedSubjects.push({ subjectId: subId, canEdit: conf.canEdit });
          }
        });

        const hashedPassword = await hashPassword(password.trim());
        const newFaculty = {
          id: cleanId,
          name: name.trim(),
          username: cleanUser,
          password: hashedPassword,
          email: cleanEmail,
          department: dept, // Automatically locked to HOD's department
          status: 'active',
          assignedSubjects
        };

        onSave(newFaculty);
      };

      return (
        <Modal title={`Add New Faculty (${dept} Department)`} onClose={onClose} maxWidth={540}>
          {err && (
            <div style={{ padding: '10px 14px', borderRadius: 8, background: 'var(--crimson-bg)', color: 'var(--crimson)', fontSize: 13, fontWeight: 600, marginBottom: 16 }}>
              {err}
            </div>
          )}

          <form onSubmit={handleSubmit}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 14 }}>
              <div>
                <label style={labelStyle}>Faculty Full Name *</label>
                <input
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder="Enter Faculty Name"
                  style={inputStyle}
                  autoFocus
                />
              </div>
              <div>
                <label style={labelStyle}>Faculty ID *</label>
                <input
                  value={facultyId}
                  onChange={e => setFacultyId(e.target.value)}
                  placeholder="Enter Faculty ID"
                  style={inputStyle}
                />
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 14 }}>
              <div>
                <label style={labelStyle}>Login Username/ID *</label>
                <input
                  value={username}
                  onChange={e => setUsername(e.target.value)}
                  placeholder="Enter Username"
                  style={inputStyle}
                  required
                />
              </div>
              <div>
                <label style={labelStyle}>Initial Password *</label>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  placeholder="Enter Password"
                  style={inputStyle}
                  required
                />
              </div>
            </div>

            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Faculty Email (Personal Gmail/Outlook or Official) *</label>
              <input
                type="email"
                value={email}
                onChange={e => setEmail(e.target.value)}
                placeholder="e.g. faculty.name@gmail.com or college mail"
                style={inputStyle}
                required
              />
            </div>

            <div style={{ marginBottom: 18 }}>
              <label style={labelStyle}>Department (Auto-locked to HOD)</label>
              <input
                value={`${dept} - Locked to logged-in HOD's department`}
                disabled
                style={{ ...inputStyle, background: '#F1F5F9', color: '#1E40AF', fontWeight: 700 }}
              />
            </div>

            {/* Initial Subject Assignment */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <label style={{ ...labelStyle, marginBottom: 0 }}>Assign Department Subjects &amp; Edit Permission</label>
                <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>*Can also be changed anytime later</span>
              </div>

              <div style={{
                maxHeight: 210,
                overflowY: 'auto',
                border: '1.5px solid var(--border-card)',
                borderRadius: 10,
                padding: '8px 12px',
                background: '#FAFAFC'
              }}>
                {availableSubjects.map(sub => {
                  const conf = assignments[sub.id] || { assigned: false, canEdit: true };
                  return (
                    <div
                      key={sub.id}
                      style={{
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        padding: '7px 6px',
                        borderBottom: '1px solid #F1F5F9'
                      }}
                    >
                      <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 13, flex: 1 }}>
                        <input
                          type="checkbox"
                          checked={conf.assigned}
                          onChange={() => toggleAssigned(sub.id)}
                          style={{ width: 16, height: 16 }}
                        />
                        <span style={{ fontWeight: conf.assigned ? 700 : 500, color: conf.assigned ? '#0F172A' : '#64748B' }}>
                          {sub.name} <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>(Sem {sub.semester})</span>
                        </span>
                      </label>

                      {conf.assigned && (
                        <button
                          type="button"
                          onClick={() => toggleCanEdit(sub.id)}
                          style={{
                            background: conf.canEdit ? '#ECFDF5' : '#FEF2F2',
                            color: conf.canEdit ? '#065F46' : '#EF4444',
                            border: '1px solid ' + (conf.canEdit ? '#A7F3D0' : '#FECACA'),
                            padding: '3px 9px',
                            borderRadius: 6,
                            fontSize: 11,
                            fontWeight: 700,
                            cursor: 'pointer'
                          }}
                        >
                          {conf.canEdit ? '✓ EDIT ENABLED' : '🔒 EDIT DISABLED'}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
              <button type="button" onClick={onClose} style={btnSecondary}>Cancel</button>
              <button type="submit" style={btnPrimary}>Create Faculty Account</button>
            </div>
          </form>
        </Modal>
      );
    }

    // -------------------------------------------------------------
    // MANAGE FACULTY ACCESS MODAL (Section 6: Subject-wise Edit Access)
    // -------------------------------------------------------------
    function ManageFacultyAccessModal({ faculty, availableSubjects, onClose, onSave }) {
      const [assignments, setAssignments] = useState({});
      const [canEditAttendance, setCanEditAttendance] = useState(!!faculty.canEditAttendance);

      useEffect(() => {
        const state = {};
        const currentAssigned = faculty.assignedSubjects || [];
        availableSubjects.forEach(sub => {
          const found = currentAssigned.find(a => a.subjectId === sub.id);
          state[sub.id] = {
            assigned: !!found,
            canEdit: found ? found.canEdit : true
          };
        });
        setAssignments(state);
        setCanEditAttendance(!!faculty.canEditAttendance);
      }, [faculty, availableSubjects]);

      const toggleAssigned = (subId) => {
        setAssignments(prev => ({
          ...prev,
          [subId]: {
            ...prev[subId],
            assigned: !prev[subId]?.assigned
          }
        }));
      };

      const toggleCanEdit = (subId) => {
        setAssignments(prev => ({
          ...prev,
          [subId]: {
            ...prev[subId],
            canEdit: !prev[subId]?.canEdit
          }
        }));
      };

      const handleSave = () => {
        const result = [];
        Object.entries(assignments).forEach(([subId, conf]) => {
          if (conf.assigned) {
            result.push({ subjectId: subId, canEdit: conf.canEdit });
          }
        });
        onSave(result, canEditAttendance);
      };

      return (
        <Modal title={`Manage Faculty Access  |  ${faculty.name}`} onClose={onClose} maxWidth={560}>
          <div style={{
            background: '#F0F9FF',
            border: '1px solid #BAE6FD',
            borderRadius: 10,
            padding: '12px 16px',
            marginBottom: 18,
            fontSize: 13,
            color: '#0369A1'
          }}>
            <strong>Subject-Wise Edit Permission Control:</strong>
            <p style={{ margin: '4px 0 0', lineHeight: 1.4 }}>
              Faculty can <strong>only</strong> edit marks for subjects where <strong>EDIT is ENABLED</strong>.
              If EDIT is disabled or subject unassigned, faculty will have zero editing capability.
            </p>
          </div>

          <div style={{
            maxHeight: 340,
            overflowY: 'auto',
            border: '1px solid var(--border-card)',
            borderRadius: 12,
            padding: '8px 14px',
            background: '#FAFAFC',
            marginBottom: 20
          }}>
            {availableSubjects.map(sub => {
              const conf = assignments[sub.id] || { assigned: false, canEdit: false };
              return (
                <div
                  key={sub.id}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    padding: '10px 8px',
                    borderBottom: '1px solid #E2E8F0'
                  }}
                >
                  <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', flex: 1 }}>
                    <input
                      type="checkbox"
                      checked={conf.assigned}
                      onChange={() => toggleAssigned(sub.id)}
                      style={{ width: 17, height: 17 }}
                    />
                    <div>
                      <div style={{ fontWeight: conf.assigned ? 700 : 500, color: conf.assigned ? '#0F172A' : '#64748B', fontSize: 13.5 }}>
                        {sub.name}
                      </div>
                      <div style={{ fontSize: 11.5, color: '#94A3B8' }}>
                        ID: {sub.id}  |  Semester {sub.semester}
                      </div>
                    </div>
                  </label>

                  <div>
                    {conf.assigned ? (
                      <button
                        type="button"
                        onClick={() => toggleCanEdit(sub.id)}
                        style={{
                          background: conf.canEdit ? '#ECFDF5' : '#F1F5F9',
                          color: conf.canEdit ? '#065F46' : '#64748B',
                          border: '1.5px solid ' + (conf.canEdit ? '#10B981' : '#CBD5E1'),
                          padding: '5px 12px',
                          borderRadius: 20,
                          fontSize: 12,
                          fontWeight: 700,
                          cursor: 'pointer',
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: 6
                        }}
                      >
                        {conf.canEdit ? (
                          <>
                            <CheckCircle2 size={13} color="#10B981" /> EDIT ENABLED
                          </>
                        ) : (
                          <>
                            <Lock size={13} color="#64748B" /> EDIT DISABLED
                          </>
                        )}
                      </button>
                    ) : (
                      <span style={{ fontSize: 12, color: '#94A3B8', fontStyle: 'italic', paddingRight: 8 }}>
                        Not Assigned
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Attendance In-Charge Designation */}
          <div style={{
            background: canEditAttendance ? '#FEFCE8' : '#F8FAFC',
            border: '1.5px solid ' + (canEditAttendance ? '#FACC15' : '#E2E8F0'),
            borderRadius: 10,
            padding: '12px 16px',
            marginBottom: 16,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: 12
          }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: canEditAttendance ? '#854D0E' : '#334155' }}>
                ⭐ Designated Department Attendance In-Charge
              </div>
              <div style={{ fontSize: 12, color: '#64748B', marginTop: 3 }}>
                When designated, this faculty member is granted exclusive authority to record, update, and manage student attendance for this department.
              </div>
            </div>
            <button
              type="button"
              onClick={() => setCanEditAttendance(prev => !prev)}
              style={{
                background: canEditAttendance ? '#D1FAE5' : '#F1F5F9',
                color: canEditAttendance ? '#065F46' : '#64748B',
                border: '1.5px solid ' + (canEditAttendance ? '#10B981' : '#CBD5E1'),
                padding: '7px 16px',
                borderRadius: 20,
                fontSize: 12.5,
                fontWeight: 700,
                cursor: 'pointer',
                display: 'inline-flex',
                alignItems: 'center',
                gap: 6,
                whiteSpace: 'nowrap'
              }}
            >
              {canEditAttendance ? (<><CheckCircle2 size={14} color="#10B981" /> ENABLED</>) : (<><Lock size={14} color="#64748B" /> DISABLED</>)}
            </button>
          </div>

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: 12.5, color: 'var(--text-muted)' }}>
              Total assigned: <strong>{Object.values(assignments).filter(a => a.assigned).length}</strong> (with EDIT: <strong>{Object.values(assignments).filter(a => a.assigned && a.canEdit).length}</strong>)
            </span>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={onClose} style={btnSecondary}>Cancel</button>
              <button onClick={handleSave} style={btnPrimary}>Save Access Permissions</button>
            </div>
          </div>
        </Modal>
      );
    }

    // -------------------------------------------------------------
    // AUDIT LOG TAB (Section 11)
    // -------------------------------------------------------------
    function AuditLogTab({ data, currentUser }) {
      const [search, setSearch] = useState('');
      const [actionFilter, setActionFilter] = useState('all');

      const isHOD = currentUser?.role === 'hod';
      const deptCode = isHOD ? currentUser.department : 'ALL';

      const logs = useMemo(() => {
        const all = data.auditLogs || [];
        return all.filter(l => {
          if (isHOD) {
            return l.department === deptCode || l.department === 'ALL';
          }
          return true;
        });
      }, [data.auditLogs, isHOD, deptCode]);

      const filteredLogs = useMemo(() => {
        return logs.filter(l => {
          const matchSearch = (l.action || '').toLowerCase().includes(search.toLowerCase()) ||
            (l.performedBy?.name || '').toLowerCase().includes(search.toLowerCase()) ||
            (l.target || '').toLowerCase().includes(search.toLowerCase()) ||
            (l.details || '').toLowerCase().includes(search.toLowerCase());
          const matchAction = actionFilter === 'all' ? true : l.action.toLowerCase().includes(actionFilter.toLowerCase());
          return matchSearch && matchAction;
        });
      }, [logs, search, actionFilter]);

      const actionBadge = (act) => {
        const a = (act || '').toLowerCase();
        if (a.includes('add')) return { bg: '#ECFDF5', color: '#065F46' };
        if (a.includes('disabled') || a.includes('remov')) return { bg: '#FEF2F2', color: '#991B1B' };
        if (a.includes('enable')) return { bg: '#EFF6FF', color: '#1E40AF' };
        if (a.includes('mark') || a.includes('edit')) return { bg: '#FEF3C7', color: '#92400E' };
        return { bg: '#F1F5F9', color: '#334155' };
      };

      return (
        <div className="animate-entry">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 12 }}>
            <div>
              <h2 style={{ fontFamily: 'var(--font-crest)', fontSize: 22, fontWeight: 800, color: 'var(--primary-900)', margin: '0 0 4px' }}>
                {isHOD ? `${deptCode} Department Activity &amp; Audit Log` : 'Institutional Audit &amp; Activity Log'}
              </h2>
              <p style={{ color: 'var(--text-muted)', fontSize: 13.5, margin: 0 }}>
                Immutable historical record of faculty modifications, subject permission changes, and marks entries.
              </p>

    // ADD / CONFIGURE HOD MODAL (Email OTP Passwordless)
    // -------------------------------------------------------------
    function AddHodModal({ deptCode, deptName, existingHod, existingHods = [], onClose, onSave }) {
      const [name, setName] = useState(existingHod?.name || '');
      const [username, setUsername] = useState(existingHod?.username || '');
      const [password, setPassword] = useState('');
      const [email, setEmail] = useState(existingHod?.email || '');
      const [err, setErr] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErr('');

        if (!name.trim()) { setErr('HOD Full Name is required.'); return; }
        if (!username.trim()) { setErr('Login Username is required.'); return; }
        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail || !cleanEmail.includes('@') || !cleanEmail.includes('.')) {
          setErr('A valid HOD Email is required for OTP login.');
          return;
        }
        if (!existingHod?.password && !password.trim()) {
          setErr('Password is required for new HOD account.');
          return;
        }

        const cleanUser = username.trim().toLowerCase();
        const userExists = existingHods.some(h => h.username.toLowerCase() === cleanUser && h.department !== deptCode);
        if (userExists) {
          setErr(`Duplicate Username: '${cleanUser}' is already in use.`);
          return;
        }

        const emailExists = existingHods.some(h => (h.email || '').toLowerCase() === cleanEmail && h.department !== deptCode);
        if (emailExists) {
          setErr(`Duplicate Email: '${cleanEmail}' is already registered.`);
          return;
        }

        let hashedPassword = existingHod?.password || '';
        if (password.trim()) {
          hashedPassword = await hashPassword(password.trim());
        }

        const updatedHod = {
          ...(existingHod || {}),
          id: existingHod?.id || `hod_${deptCode.toLowerCase()}`,
          name: name.trim(),
          username: cleanUser,
          password: hashedPassword,
          email: cleanEmail,
          department: deptCode,
          status: existingHod?.status || 'active'
        };

        onSave(updatedHod);
      };

      return (
        <Modal title={`Configure HOD  |  ${deptCode}`} onClose={onClose} maxWidth={460}>
          {err && (
            <div style={{ padding: '10px 14px', borderRadius: 8, background: 'var(--crimson-bg)', color: 'var(--crimson)', fontSize: 13, fontWeight: 600, marginBottom: 16 }}>
              {err}
            </div>
          )}
          <form onSubmit={handleSubmit}>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Department</label>
              <input value={`${deptCode} - ${deptName || deptCode}`} disabled style={{ ...inputStyle, background: '#F1F5F9' }} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>HOD Full Name *</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="Enter HOD Name" style={inputStyle} autoFocus required />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Login Username *</label>
              <input value={username} onChange={e => setUsername(e.target.value)} placeholder="Enter Username" style={inputStyle} required />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>HOD Password {existingHod?.password ? '(leave blank to keep current)' : '*'}</label>
              <input
                type="password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                placeholder={existingHod?.password ? "Enter new password (optional)" : "Enter HOD Password"}
                style={inputStyle}
                required={!existingHod?.password}
              />
            </div>
            <div style={{ marginBottom: 18 }}>
              <label style={labelStyle}>HOD Email (Personal Gmail/Outlook or Official) *</label>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="e.g. hod.dept@gmail.com or college mail" style={inputStyle} required />
            </div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
              <button type="button" onClick={onClose} style={btnSecondary}>Cancel</button>
              <button type="submit" style={btnPrimary}>Save HOD Configuration</button>
            </div>
          </form>
        </Modal>
      );
    }
