      fontWeight: 700,
      fontSize: 12
    };

    // Main App
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Portal Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ minHeight: '100vh', background: '#091326', color: '#FFF', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, textAlignment: 'center' }}>
              <div style={{ background: '#1E293B', borderRadius: 16, padding: 32, maxWidth: 500, width: '100%', border: '1px solid #334155', boxShadow: '0 20px 40px rgba(0,0,0,0.5)', textAlign: 'center' }}>
                <div style={{ width: 56, height: 56, borderRadius: '50%', background: '#FEF2F2', color: '#EF4444', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px', fontSize: 28, fontWeight: 'bold' }}>!</div>
                <h2 style={{ fontFamily: 'Cinzel, serif', color: '#F8FAFC', marginBottom: 10, fontSize: 20 }}>Portal Error Detected</h2>
                <p style={{ color: '#94A3B8', fontSize: 14, marginBottom: 20, lineHeight: 1.5 }}>
                  {this.state.error?.message || "An unexpected rendering error occurred."}
                </p>
                <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
                  <button onClick={() => window.location.reload()} style={{ background: '#2563EB', color: '#FFF', border: 'none', padding: '10px 20px', borderRadius: 8, fontWeight: 600, cursor: 'pointer' }}>
                    Refresh Portal
                  </button>
                  <button onClick={() => { localStorage.clear(); window.location.reload(); }} style={{ background: '#DC2626', color: '#FFF', border: 'none', padding: '10px 20px', borderRadius: 8, fontWeight: 600, cursor: 'pointer' }}>
                    Reset Portal Data
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      // NEVER initialize privileged super_admin view or user from unverified localStorage
      const [view, setView] = useState(() => {
        const sess = loadSession();
        return (sess && sess.role !== 'super_admin') ? 'faculty-dashboard' : 'student-search';
      });
      const [data, setData] = useState(() => loadData());
      const [currentUser, setCurrentUser] = useState(() => {
        const sess = loadSession();
        if (sess && sess.role === 'super_admin') {
          saveSession(null); // Immediately purge unverified super_admin from localStorage
          return null;
        }
        return sess;
      });
      const [loginRole, setLoginRole] = useState('faculty');
      const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);
      const [cloudStatus, setCloudStatus] = useState(currentCloudStatus);

      useEffect(() => {
        const unsub = subscribeCloudStatus((st) => setCloudStatus(st));
        return unsub;
      }, []);

      // Server-Verified Security Guard for Principal (super_admin) Session
      useEffect(() => {
        let isCancelled = false;
        const verifyPrincipalSession = async () => {
          const sess = loadSession();
          if (sess && sess.role === 'super_admin') {
            const client = getSupabaseClient();
            if (!client || !client.auth) {
              console.warn('[Security] Supabase Auth unavailable. Dropping unverified Principal session.');
              if (!isCancelled) {
                setCurrentUser(null);
                saveSession(null);
                setView('student-search');
                showToast('Authentication connection required. Please sign in.', 'error');
              }
              return;
            }
            try {
              const { data: { session: authSession } } = await client.auth.getSession();
              if (!authSession || !authSession.user) {
                console.warn('[Security] No Supabase Auth token found for Principal session. Revoking forged session.');
                saveSession(null);
                setCurrentUser(null);
                setView('student-search');
                return;
              }
              const { data: { user }, error } = await client.auth.getUser();
              if (error || !user) {
                console.warn('[Security] Unauthorized or forged Principal session detected in localStorage. Revoking access.');
                if (!isCancelled) {
                  setCurrentUser(null);
                  saveSession(null);
                  setView('student-search');
                  showToast('Session expired or unauthorized. Please sign in.', 'error');
                }
                return;
              }
              // Server-side Authorization: Verify authenticated user UUID against public.admin_users table
              const { data: adminRecord, error: adminErr } = await client
                .from('admin_users')
                .select('id, role')
                .eq('id', user.id)
                .eq('role', 'super_admin')
                .maybeSingle();

              if (adminErr || !adminRecord) {
                console.warn('[Security] Authenticated user is not found in public.admin_users. Revoking session.');
                if (!isCancelled) {
                  await client.auth.signOut().catch(() => {});
                  setCurrentUser(null);
                  saveSession(null);
                  setView('student-search');
                  showToast('Access denied: Account not registered in database admin_users table.', 'error');
                }
                return;
              }
              // Verified by Supabase Auth server! Hydrate authenticated session
              if (!isCancelled) {
                const verifiedPrincipal = {
                  id: user.id,
                  role: 'super_admin',
                  name: 'System Administrator (SAI)',
                  username: SUPER_ADMIN_ACCOUNT.username || 'SAI',
                  email: user.email,
                  authSession: true
                };
                setCurrentUser(verifiedPrincipal);
                setView('faculty-dashboard');
              }
            } catch (err) {
              console.warn('[Security] Session verification error:', err);
              if (!isCancelled) {
                setCurrentUser(null);
                saveSession(null);
                setView('student-search');
              }
            }
          }
        };
        verifyPrincipalSession();

        // Listen for Supabase Auth state changes
        try {
          const client = getSupabaseClient();
          if (client && client.auth) {
            const { data: { subscription } } = client.auth.onAuthStateChange((event, session) => {
              if (event === 'SIGNED_OUT') {
                const cur = loadSession();
                if (cur && cur.role === 'super_admin') {
                  setCurrentUser(null);
                  saveSession(null);
                  setView('student-search');
                }
              }
            });
            return () => {
              isCancelled = true;
              if (subscription && subscription.unsubscribe) subscription.unsubscribe();
            };
          }
        } catch (e) { }

        return () => { isCancelled = true; };
      }, []);

      // Dismiss the official intro loader when portal is mounted and ready
      useEffect(() => {
        if (window.__dismissPortalLoader) window.__dismissPortalLoader();
      }, []);

      // Safe, rock-solid initial hydration: NEVER wipe local data, NO automatic polling overwrites
      useEffect(() => {
        loadDataFromBrowserDb().then(async storedData => {
          if (storedData && Array.isArray(storedData.students) && storedData.students.length > 0) {
            setData(prev => ({
              ...prev,
              ...storedData,
              students: storedData.students,
              records: storedData.records || prev.records,
              subjects: (storedData.subjects && storedData.subjects.length > 0) ? storedData.subjects : prev.subjects
            }));
          }

          // Authoritative initial cloud pull: Supabase Cloud is the SINGLE SOURCE OF TRUTH
          try {
            const cloudData = await loadDataFromSupabase(null);
            if (cloudData && cloudData.fromCloud) {
              // Purge legacy browser cache so stale demo/default students or marks never resurrect
              try {
                localStorage.removeItem(DATA_KEY);
                localStorage.removeItem('mic-college-data-v1');
                openLocalDataDb().then(db => {
                  if (db) {
                    const tx = db.transaction(LOCAL_STORE_NAME, 'readwrite');
                    tx.objectStore(LOCAL_STORE_NAME).clear();
                  }
                }).catch(e => { if (e) console.warn('[Sync Warning]', e.message || e); });
              } catch (e) { }

              setData({
                students: cloudData.students || [],
                subjects: cloudData.subjects || [],
                records: cloudData.records || [],
                classAttendance: (cloudData.classAttendance && cloudData.classAttendance.length > 0) ? cloudData.classAttendance : (storedData?.classAttendance || []),
                publishSettings: cloudData.publishSettings || storedData?.publishSettings || {},
                attendanceInCharges: cloudData.attendanceInCharges || storedData?.attendanceInCharges || {},
                faculties: (cloudData.faculties && cloudData.faculties.length > 0) ? cloudData.faculties : [],
                hods: (cloudData.hods && cloudData.hods.length > 0) ? cloudData.hods : [],
                auditLogs: cloudData.auditLogs || [],
                fromCloud: true
              });
            }
          } catch (cloudErr) {
            console.warn('[Supabase Cloud] Initial hydration notice:', cloudErr);
          }
        });
      }, []);

      const persist = useCallback(updater => {
        setData(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          saveData(next);
          scheduleCloudSnapshotSync(next);
          return next;
        });
      }, []);

      const handleLogin = (user) => {
        setCurrentUser(user);
        saveSession(user);
        setView('faculty-dashboard');
      };

      const handleLogout = async () => {
        try {
          const client = getSupabaseClient();
          if (client && client.auth) {
            await client.auth.signOut().catch(() => {});
          }
        } catch (e) { }
        setCurrentUser(null);
        saveSession(null);
        setView('student-search');
      };

      return (
        <div className="app-shell" style={{ minHeight: '100vh', width: '100%', position: 'relative' }}>
          <ToastContainer />
          {/* CloudSyncModal removed from public view for student security */}
          {view === 'student-search' && (
            <>
              <TopBar
                setView={setView}
                currentUser={currentUser}
                onLogout={handleLogout}
                setLoginRole={setLoginRole}
                cloudStatus={cloudStatus}
              />
              <StudentSearch data={data} persist={persist} />
            </>
          )}

          {view === 'portal-login' && (
            <MultiRoleLogin
              data={data}
              persist={persist}
              defaultRole={loginRole}
              onSuccess={handleLogin}
              onBack={() => setView('student-search')}
            />
          )}

          {view === 'faculty-dashboard' && currentUser && (
            <FacultyDashboard
              data={data}
              persist={persist}
              currentUser={currentUser}
              onLogout={handleLogout}
              setView={setView}
            />
          )}

          {view === 'faculty-dashboard' && !currentUser && (
            <MultiRoleLogin
              data={data}
              persist={persist}
              defaultRole={loginRole}
              onSuccess={handleLogin}
              onBack={() => setView('student-search')}
            />
          )}
        </div>
      );
    }

    // Render React immediately ,  loader will be dismissed by __dismissPortalLoader once App has mounted
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
